<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Entregador</title>

    <!-- Mesmo bundle do index.html (src/main.jsx) — o app do entregador é a
         mesma tela (pages/courier) servida pela própria entry. Só muda o
         profile, que o vite/app-profiles.js reescreve no build. -->
    <meta name="app-profile" content="entregador" />
    <script data-app-profile>window.__APP_PROFILE__ = "entregador";</script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- iOS: Safari ignora manifest.json pra ícone/tela cheia, precisa disso -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Entregador" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
