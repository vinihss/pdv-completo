<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>PDV</title>

    <!-- Perfil desta entry. `all` (e não `pdv`) porque no build padrão este
         index.html é o APP INTEIRO — é o que `frontendDist: "../dist"` em
         src-tauri/tauri.conf.json abre, com as 4 telas em 1. Num build de app
         isolado (`npm run build:kds`) o index.html é reusado como entrada e
         quem manda é o VITE_APP_PROFILE, não esta tag. As outras 3 entries
         (kds/garcon/entregador.html) declaram o perfil delas. O par meta+script
         é reescrito pelo vite/app-profiles.js; o app lê em
         src/shared/lib/appProfile.js. -->
    <meta name="app-profile" content="all" />
    <script data-app-profile>window.__APP_PROFILE__ = "all";</script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0a09" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- iOS: Safari ignora manifest.json pra ícone/tela cheia, precisa disso -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PDV" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
