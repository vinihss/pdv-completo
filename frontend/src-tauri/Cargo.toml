[package]
name = "app"
version = "0.2.0"
description = "PDV — aplicativo desktop"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
# HTTP vai pelo Rust porque o app desktop roda na origem `tauri.localhost`, e
# o backend (CORS_ORIGIN com o domínio) não libera essa origem. O plugin
# ignora CORS; no web continua sendo `fetch` normal.
tauri-plugin-http = "2"
# `relaunch()` depois que o updater instala a nova versão.
tauri-plugin-process = "2"
# Update automático no boot. Sem este crate o `checkForUpdate()` do JS
# sempre falha e o app abre na versão em disco (comportamento correto em
# loja offline, mas sem update). A chave pública em tauri.conf.json
# valida o manifesto; a privada vive em TAURI_SIGNING_PRIVATE_KEY.
tauri-plugin-updater = "2"

# Impressão térmica direta (fase 1 do plano de impressão). `windows` já
# entra no lock pelo Tauri; o que falta aqui é a feature de spooler
# (`Win32_Graphics_Printing`), usada por `printing/spooler.rs` para
# listar filas, escrever ESC/POS cru e ler o status do dispositivo.
#
# Só no Windows de propósito: no Linux/macOS (dev) o crate não compila, e
# o código do spooler é `#[cfg(windows)]`. A sondagem de status por
# DLE EOT (printing/status.rs) é rede pura e funciona em qualquer
# plataforma — o dev consegue testar essa parte no Linux.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Printing", "Win32_Foundation"] }
