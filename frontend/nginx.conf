server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service Worker: nunca cachear para garantir atualização imediata
    # O Cloudflare respeita esses headers e não cacheia o sw.js
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA: qualquer rota não encontrada cai no index.html (React Router
    # cuida da navegação client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agressivo pra assets com hash no nome (gerados pelo Vite build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
