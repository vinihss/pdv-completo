services:
  osrm:
    image: osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/sul-261015.osrm"]
    ports: ["5001:5000"]
    volumes: ["./data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:5000/route/v1/driving/-46.63,-23.55;-46.62,-23.55?overview=false' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  tiles:
    image: overv/openstreetmap-tile-server:2.3.0
    command: run
    ports: ["8080:80"]
    volumes:
      - ./data:/data
    shm_size: 1gb
    environment:
      - UPDATES=enabled
    restart: unless-stopped

