# ============================================================
# Deploy LOCAL (sem HTTPS) — usado pelo ~/umami-utils/docker-up.sh.
# Compose standalone (não é override): o merge de `ports` entre
# arquivos concatenaria 80/443 duplicados do compose cloud.
#
# Uso: PDV_PORT=8080 ~/umami-utils/docker-up.sh  (porta padrão: 80)
# Acesso: http://localhost  ou  http://<IP-da-maquina-na-LAN>
#
# Mesma topologia do compose de produção: `backend`/`frontend` +
# `backend-next`/`frontend-next` e o mesmo switch (deploy/switch.sh
# --profile local), para que o deploy sem downtime seja testado aqui
# antes de ir para o VPS.
# ============================================================
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Monta a config dentro do container (ver deploy/caddy-assemble.sh).
    # DIRETÓRIO montado, não arquivo: ver a nota no compose de produção
    # (o `git checkout -f` da tag troca o inode do arquivo).
    entrypoint: ["/bin/sh", "/srv/pdv-deploy/caddy-assemble.sh"]
    command: ["run"]
    ports:
      - "${PDV_PORT:-80}:80"
    environment:
      - DOMAIN=localhost
      - PDV_CADDY_CONFIG=/srv/pdv-deploy/Caddyfile.local
      - PDV_UPSTREAM_STATE=/srv/pdv-deploy/state/active-upstream
    volumes:
      - ./:/srv/pdv-deploy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build: ../backend
    image: ${BACKEND_IMAGE:-pdv-backend:local}
    restart: unless-stopped
    environment:
      - DEPLOYMENT_MODE=local
      - DATABASE_URL=postgres://${POSTGRES_USER:-pdv}:${POSTGRES_PASSWORD:-pdv_password}@postgres:5432/${POSTGRES_DB:-pdv}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=
      - PORT=3000
      - LOG_LEVEL=info
      - APP_TAG=${APP_TAG:-}
    volumes:
      - backend_uploads:/app/uploads
    # Mesmo portão do compose de produção: /health só responde depois das
    # migrations (server.ts roda runMigrations() antes do app.listen).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    # Não expõe porta pro host — o Caddy fala com ele via rede interna

  backend-next:
    extends:
      service: backend
    profiles: ["canary"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    image: ${FRONTEND_IMAGE:-pdv-frontend:local}
    restart: unless-stopped
    # nginx serve conteúdo estático, mas "estático" não quer dizer "pronto no
    # instante": o switch espera este healthcheck antes de apontar o proxy,
    # senão o primeiro F5 pós-deploy pega 502. A imagem nginx:alpine traz
    # wget do busybox (não traz curl).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    # idem — só o Caddy acessa

  frontend-next:
    extends:
      service: frontend
    profiles: ["canary"]

  # Banco oficial (mesmo nome de volume do compose de produção, para o
  # mesmo banco ser reaproveitado entre as duas formas de subir).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pdv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pdv_password}
      - POSTGRES_DB=${POSTGRES_DB:-pdv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Publica a porta do Postgres no HOST, em 127.0.0.1 por padrão (a nota
    # longa, com o porquê do loopback e o aviso de segurança, está no compose
    # de produção). O cabeçalho deste arquivo diz que o app é acessado de
    # outras máquinas da LAN — isso é pelo Caddy, na porta do `PDV_PORT`; o
    # banco não precisa (e não deve) sair do host. Quem quiser falar com o
    # Postgres direto usa `psql -h 127.0.0.1` na própria máquina.
    #
    # A armadilha da porta do HOST: este serviço usa o mesmo volume
    # `pdv_postgres_data` do compose de produção, mas a porta 5432 é uma só por
    # máquina. Com as duas formas de subir ativas (esta e a de produção), a
    # segunda falha com "address already in use" — não é corrupção de volume, é
    # o bind. Mude a porta do HOST (POSTGRES_PORT=55432) ou mantenha só uma das
    # duas stacks no ar.
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv} -d ${POSTGRES_DB:-pdv}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Mesmos nomes explícitos do compose de produção (pdv_*) para que o banco
  # e os certs sejam reaproveitados entre as duas formas de subir.
  backend_uploads:
    name: pdv_backend_uploads # fotos de produto — backup junto com o banco (deploy/backup.sh)
  caddy_data:
    name: pdv_caddy_data
  caddy_config:
    name: pdv_caddy_config
  postgres_data:
    name: pdv_postgres_data # dados do Postgres — NUNCA apague sem backup
