# ============================================================
# Deploy LOCAL (sem HTTPS) — usado pelo docker-up.sh na raiz.
# Compose standalone (não é override): o merge de `ports` entre
# arquivos concatenaria 80/443 duplicados do compose cloud.
#
# Uso: PDV_PORT=8080 ./docker-up.sh  (porta padrão: 80)
# Acesso: http://localhost  ou  http://<IP-da-maquina-na-LAN>
# ============================================================
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PDV_PORT:-80}:80"
    environment:
      - DOMAIN=localhost
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      - DEPLOYMENT_MODE=local
      - DATABASE_URL=postgres://${POSTGRES_USER:-pdv}:${POSTGRES_PASSWORD:-pdv_password}@postgres:5432/${POSTGRES_DB:-pdv}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=
      - PORT=3000
      - LOG_LEVEL=info
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Não expõe porta pro host — o Caddy fala com ele via rede interna

  frontend:
    build: ../frontend
    restart: unless-stopped
    # idem — só o Caddy acessa

  # Banco oficial (mesmo nome de volume do compose de produção, para o
  # mesmo banco ser reaproveitado entre as duas formas de subir).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pdv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pdv_password}
      - POSTGRES_DB=${POSTGRES_DB:-pdv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv} -d ${POSTGRES_DB:-pdv}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Mesmos nomes explícitos do compose de produção (pdv_*) para que o banco
  # e os certs sejam reaproveitados entre as duas formas de subir.
  backend_uploads:
    name: pdv_backend_uploads # fotos de produto — backup junto com o banco (deploy/backup.sh)
  caddy_data:
    name: pdv_caddy_data
  caddy_config:
    name: pdv_caddy_config
  postgres_data:
    name: pdv_postgres_data # dados do Postgres — NUNCA apague sem backup