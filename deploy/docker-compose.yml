# ============================================================
# Deploy completo: Caddy (HTTPS) + backend + frontend
# Uso: cd deploy && cp .env.example .env && ajuste os valores && docker compose up -d
#
# PostgreSQL é o ÚNICO banco suportado (o SQLite foi removido). O serviço
# `postgres` abaixo sobe junto por padrão e o backend espera o healthcheck.
# Para usar um Postgres gerenciado (RDS, Neon, etc.), aponte DATABASE_URL para o
# endpoint externo e suba o backend sem a dependência do serviço local:
#   docker compose up -d --no-deps backend frontend caddy
#
# ---------- Deploy sem downtime ----------
# A partir do 2º deploy, NÃO use `docker compose up -d --build`: use
# `deploy/switch.sh` (o mesmo que o CI chama). A topologia tem duas
# instâncias de backend e duas de frontend — `backend`/`frontend` e
# `backend-next`/`frontend-next` — que saem da MESMA âncora (e da mesma
# imagem), então "próxima" e "atual" são só nomes. O que decide quem está
# no ar é o ponteiro `state/active-upstream`, lido pelo container do Caddy
# (ver caddy-assemble.sh). As instâncias `-next` estão no profile
# `canary`: um `up` comum não as sobe, o que mantém esta instalação
# igual à anterior para quem nunca fez um switch.
# ============================================================
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Monta a config dentro do container e sobe/recarrega por ela. O
    # `run` é o boot; o `reload` é o que o switch.sh chama para trocar o
    # upstream sem derrubar quem está conectado.
    #
    # O entrypoint e a Caddyfile vêm do DIRETÓRIO montado, não de um
    # arquivo único: o CI troca o código com `git checkout -f`, que
    # substitui os arquivos por inodes novos — e um bind mount de arquivo
    # deixaria o container preso ao inode antigo, servindo a configuração
    # anterior sem reclamar no log. Montando o diretório, o conteúdo novo
    # aparece no próximo reload.
    entrypoint: ["/bin/sh", "/srv/pdv-deploy/caddy-assemble.sh"]
    command: ["run"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - PDV_CADDY_CONFIG=/srv/pdv-deploy/Caddyfile
      - PDV_UPSTREAM_STATE=/srv/pdv-deploy/state/active-upstream
      # Qual implementação serve o /realtime* (`node` = a atual, no backend;
      # `go` = o gateway em Go de ../ws-gateway). O caddy-assemble.sh
      # traduz isso no upstream `PDV_WS_UPSTREAM` da Caddyfile.
      #
      # O `.env` NÃO é lido pelo container em tempo de reload: variável de
      # ambiente só entra no boot dele. Quem troca o destino do realtime sem
      # recriar o proxy (e sem os 1-3s de queda do recreate) é a linha
      # PDV_WS_UPSTREAM no ponteiro state/active-upstream — ver .env.example.
      - WS_BACKEND=${WS_BACKEND:-node}
    volumes:
      # O diretório `deploy/` inteiro, só-leitura: é dele que saem a
      # Caddyfile, o caddy-assemble.sh e o ponteiro de upstream (o único
      # estado de deploy que vive no host).
      - ./:/srv/pdv-deploy:ro
      # Artefatos do auto-update (latest.json + installer). Escrito pelo CI
      # em deploy/updates/ via SSH; servido somente-leitura pelo Caddy.
      - ./updates:/srv/pdv-updates:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # ---------- Backend ----------
  # `backend` e `backend-next` são o MESMO serviço com nomes diferentes
  # (`extends`, não cópia: não há como os dois divergirem por esquecimento
  # no meio do caminho). A diferença entre "atual" e "próxima" é o
  # healthcheck + o `stop_grace_period`, não o conteúdo.
  backend:
    build:
      context: ../backend
      dockerfile: ${DOCKERFILE:-Dockerfile}
    # Nome explícito para as duas instâncias compartilharem a imagem: o
    # switch.sh faz `compose build backend` uma vez e as duas sobem com o
    # mesmo tag (duas imagens iguais custariam build e disco à toa).
    image: ${BACKEND_IMAGE:-pdv-backend:local}
    restart: unless-stopped
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-pdv}:${POSTGRES_PASSWORD:-pdv_password}@postgres:5432/${POSTGRES_DB:-pdv}}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      # Lista de origens permitidas, separada por vírgula. O padrão é só o
      # domínio do app; se o PDV também for servido em outro endereço (ex.:
      # hostname antigo do servidor), defina CORS_ORIGIN no .env com a lista
      # completa — se não, o navegador bloqueia a API e o app "carrega mas
      # não funciona".
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${DOMAIN}}
      - PORT=3000
      - LOG_LEVEL=info
      # ---------- WhatsApp Cloud API (Embedded Signup) ----------
      # Sem isto a aba 'WhatsApp' do gerente mostra 'não configurado' — o
      # resto do app funciona normal.
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID=${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      - WHATSAPP_GRAPH_VERSION=${WHATSAPP_GRAPH_VERSION:-v25.0}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - APP_TAG=${APP_TAG:-}
    volumes:
      - backend_uploads:/app/uploads
    # Portão do switch: o container só fica "healthy" depois que o
    # /health responde, e o /health só abre depois das migrations
    # (server.ts roda runMigrations() antes do app.listen). Sem isto o
    # switch poderia cortar o tráfego para uma instância ainda sem schema.
    # A imagem é node:slim, sem curl/wget — o próprio node faz o check.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    # O SIGTERM já drena as requisições em voo (app.close() em server.ts);
    # a janela existe para o processo terminar isso antes do SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    # Não expõe porta pro host — só o Caddy fala com ele, via rede interna do compose

  # Instância "próxima" do switch. Só sobe com `--profile canary`, que é
  # o que o switch.sh usa. Mesmo ambiente, mesma imagem, mesmo volume de
  # uploads do backend atual.
  backend-next:
    extends:
      service: backend
    profiles: ["canary"]
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Frontend ----------
  # Mesma lógica: nginx servindo build estático, duas instâncias do mesmo
  # tag. Sem healthcheck porque é conteúdo estático — o nginx atende assim
  # que sobe, e o switch.sh confirma o resultado pelo probe HTTP.
  frontend:
    build: ../frontend
    image: ${FRONTEND_IMAGE:-pdv-frontend:local}
    restart: unless-stopped
    # nginx serve conteúdo estático, mas "estático" não quer dizer "pronto no
    # instante": o switch espera este healthcheck antes de apontar o proxy,
    # senão o primeiro F5 pós-deploy pega 502. A imagem nginx:alpine traz
    # wget do busybox (não traz curl).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  frontend-next:
    extends:
      service: frontend
    profiles: ["canary"]

  # ---------- Gateway WebSocket em Go (opt-in) ----------
  # Servidor WS do PDV escrito em Go: serve `/realtime`, `/realtime/public`
  # e `/health`, e publica o que o backend grava em `outbox_event`. Mesmo
  # handshake, mesmas rooms e mesmo token do `WsGateway` do Node — quem não
  # muda é o app. Não escreve nada no banco, então não tem migration e não
  # tem estado em disco.
  #
  # ---------- Por que está atrás de `profiles` ----------
  # O dispatcher do gateway disputa com o do Node o MESMO advisory lock
  # (`pdv:outbox:owner`, backend/src/infra/locks.ts) e marca o evento como
  # publicado mesmo com ZERO assinantes na room. Um gateway de pé que não
  # está no caminho do `/realtime` ganha metade dos ciclos e engole os
  # eventos realtime de quem está no Node — sem erro em log nenhum, só a
  # tela do salão que não atualiza. Ou seja: subir este container não é
  # inofensivo como "só mais um serviço parado". Ele sobe junto com a flag
  # `WS_BACKEND=go` (README §"Gateway WebSocket em Go"), e o Caddy não
  # depende dele de propósito: o rollback pro Node tem que funcionar com o
  # gateway quebrado ou parado.
  #
  # O `profiles:` segura o `up` do dia a dia, e só isso. Ele NÃO fecha a
  # janela perigosa: subir o container para preparar a virada faz o gateway
  # disputar o lock com o Node antes do Caddy virar, e é justamente aí que
  # ele parece inofensivo (ninguém conectado nele). Quem fecha essa janela
  # é o gate `WS_DISPATCH` (ver `environment` abaixo e
  # `ws-gateway/internal/outbox/gate.go`): desligado, o dispatcher do
  # gateway simplesmente não existe, e o `profile` volta a ser só convenção
  # de inicialização. Por isso os dois andam juntos — o profile é a
  # convenção, o gate é a garantia.
  ws-gateway:
    build:
      context: ../ws-gateway
      dockerfile: ${WS_DOCKERFILE:-Dockerfile}
    image: ${WS_GATEWAY_IMAGE:-pdv-ws-gateway:local}
    profiles: ["ws-gateway"]
    restart: unless-stopped
    environment:
      # Mesmo banco e mesmo `outbox_event` do backend — o gateway não tem
      # schema próprio, é só um leitor da fila que o backend grava.
      #
      # `?sslmode=disable` no DEFAULT (e só no default): o driver do gateway é o
      # lib/pq, que assume `sslmode=require` quando a DSN não diz nada, e o
      # `postgres` deste compose não tem TLS — sem o parâmetro o `db.Connect`
      # falha com "pq: SSL is not enabled on the server" e o gateway sobe SEM
      # pool: `/health` 200, `outboxEnabled:false`, log de aviso, e nenhum
      # evento sai. Medido. Quem aponta `DATABASE_URL` no `.env` (Postgres
      # externo, com ou sem TLS) escolhe o próprio parâmetro, porque aí a DSN
      # inteira vem de fora.
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-pdv}:${POSTGRES_PASSWORD:-pdv_password}@postgres:5432/${POSTGRES_DB:-pdv}?sslmode=disable}
      - PORT=8080
      # `JWT_SECRET` e NÃO `WS_JWT_SECRET`: o binário aceita os dois (o
      # primeiro com fallback para o segundo), mas passar só um garante que
      # os dois processos não podem divergir. Divergindo, a falha é o pior
      # caso possível — o browser leva 401 no handshake, o WebSocket morre
      # em silêncio e o app entra em loop de reconexão sem mensagem nenhuma
      # no servidor além do log do gateway.
      - JWT_SECRET=${JWT_SECRET}
      # Vazio (default) = aceita qualquer origem; atrás do Caddy é o certo,
      # porque quem autentica o realtime é o JWT no subprotocol. Ver
      # .env.example antes de preencher.
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
      # Gate de posse do realtime: desligado (vazio) por padrão, e o gateway
      # NÃO despacha `outbox_event` — ele serve as conexões e não come a fila
      # de quem ainda está conectado no Node. Só `1|true|yes|on` ligam.
      #
      # Repassar isto aqui não é opcional: sem a linha, a variável chega
      # VAZIA no container (o `docker compose run/up` só injeta o que está
      # declarado), o gate fica desligado para sempre e `WS_BACKEND=go` vira
      # no-op silencioso — o Caddy aponta /realtime para o gateway, o
      # handshake passa, o `join` é aceito e NENHUM evento chega, sem erro em
      # lugar nenhum. O sino do salão só volta a tocar no F5 seguinte.
      #
      # Ligue junto com a virada do proxy (README §"Como ligar"), nunca
      # antes: ligado cedo, o gateway passa a disputar o advisory lock
      # `pdv:outbox:owner` com o Node e a ganhar metade dos ciclos, marcando
      # `published = true` de evento que o Node ainda precisa entregar a quem
      # está conectado lá. O `profiles:` abaixo segura o `up` normal, não essa
      # janela — o gate é que fecha.
      - WS_DISPATCH=${WS_DISPATCH:-}
      # Só aparece no /health ("version"). A pipeline ainda não exporta
      # GIT_SHA, então em produção vem "dev" — quando exportar, dá para
      # confirmar pelo /health qual build do gateway está no ar.
      - GIT_SHA=${GIT_SHA:-}
    # ---------- O /health e o que ele realmente porta ----------
    # O /health responde 503 quando o banco deixa de responder, e a diferença
    # que importa é a do banco CONGELADO: lá o TCP está aberto e nada responde,
    # um `PingContext` nunca volta, e antes desta versão o endpoint pendurava
    # sem responder — sem prazo. Agora um probe de fundo pergunta a 1s (no máx.
    # 2 perguntas em andamento) e o handler só lê o resultado; um "ok" mais
    # velho que 3s deixa de valer, então é o tempo, não o driver, que degrada.
    # Medido com Postgres de verdade: banco travado → 503 em ~1-3ms, destravado
    # → 200 sozinho, sem restart.
    #
    # Sem `DATABASE_URL` o /health responde 200, e isso é decisão: o rollback
    # do realtime é voltar o Caddy para o Node com o gateway vivo, e com o
    # dispatcher desligado pelo `WS_DISPATCH` o gateway mudo é o modo normal de
    # subida lado a lado, não um estado degradado. Degradar esse caso quebraria
    # o `--profile ws-gateway` e o caminho de rollback.
    #
    # O portão real do deploy continua sendo o /health do BACKEND: o `switch.sh`
    # não espera este serviço (o `wait_healthy` cobre backend e frontend) e o
    # Caddy não roteia `/health` para cá. A imagem é alpine (busybox tem wget,
    # não curl).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      # `retries: 20` com `interval: 3s` é o que segura o ruído: um banco
      # congelado vira 503 em ~3s, mas o container só fica `unhealthy` depois de
      # ~60s de 503 seguidos (medido: t+63s), e volta a `healthy` sozinho quando
      # o banco destrava — o probe de fundo retoma e o próximo ok fecha a janela.
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    # O binário trata o SIGTERM com um drain de até 10s (fecha as conexões
    # com frame de close antes de sair), então a janela precisa ser MAIOR que
    # isso — abaixo de 10s o SIGKILL corta o drain no meio e o cliente só
    # descobre pela queda, em vez de reconectar para outro lugar.
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    # Não expõe porta pro host — só o Caddy fala com ele, na rede interna
    # do compose, como o backend.

  # Banco oficial. Sem profile: sobe sempre, e o backend espera o healthcheck.
  # (Postgres externo? ajuste DATABASE_URL no .env e use --no-deps, senão o
  # depends_on do backend sobe este Postgres mesmo sem uso.)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pdv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pdv_password}
      - POSTGRES_DB=${POSTGRES_DB:-pdv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Não expõe porta pro host — só o backend acessa via rede interna do compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv} -d ${POSTGRES_DB:-pdv}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Nomes explícitos (sem prefixo do projeto) para que o backup.sh e os
  # comandos de operação não dependam do nome da pasta do compose.
  backend_uploads:
    name: pdv_backend_uploads # fotos de produto — incluir no backup junto com o banco
  caddy_data:
    name: pdv_caddy_data # certificados TLS emitidos pelo Let's Encrypt, reaproveitados entre restarts
  caddy_config:
    name: pdv_caddy_config
  postgres_data:
    name: pdv_postgres_data # dados do Postgres — NUNCA apague sem backup
