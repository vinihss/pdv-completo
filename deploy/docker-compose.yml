name: pdv
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Portas publicadas só no docker-compose.override.yml (dev): o host pode
    # já ter o Caddy de produção nas 80/443.
    environment:
      - DOMAIN=localhost
      - PDV_WS_UPSTREAM=${PDV_WS_UPSTREAM:-backend:3000}
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./geo-test:/srv/geo-test:ro # página de smoke test (geo.localhost)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - pdv-internal

  backend:
    build:
      context: ../backend
      dockerfile: ${DOCKERFILE:-Dockerfile}
    # Nome explícito para as duas instâncias compartilharem a imagem: o
    # switch.sh faz `compose build backend` uma vez e as duas sobem com o
    # mesmo tag (duas imagens iguais custariam build e disco à toa).
    image: ${BACKEND_IMAGE:-pdv-backend:local}
    restart: unless-stopped
    networks:
      - pdv-internal
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-pdv}:${POSTGRES_PASSWORD:-pdv_password}@postgres:5432/${POSTGRES_DB:-pdv}}
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://${DOMAIN}}
      - PORT=3000
      - LOG_LEVEL=info
      - DEFAULT_TENANT_SCHEMA=${DEFAULT_TENANT_SCHEMA:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TENANT_ROUTING=${TENANT_ROUTING:-false}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID=${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      - WHATSAPP_GRAPH_VERSION=${WHATSAPP_GRAPH_VERSION:-v25.0}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - APP_TAG=${APP_TAG:-}
    volumes:
      - backend_uploads:/app/uploads

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    # O SIGTERM já drena as requisições em voo (app.close() em server.ts);
    # a janela existe para o processo terminar isso antes do SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Não expõe porta pro host — só o Caddy fala com ele, via rede interna do compose

  # Instância "próxima" do switch. Só sobe com `--profile canary`, que é
  # o que o switch.sh usa. Mesmo ambiente, mesma imagem, mesmo volume de
  # uploads do backend atual.
  backend-next:
    extends:
      service: backend
    profiles: ["canary"]
    # Override OBRIGATÓRIO do `ipv4_address` herdado do `backend`: o
    # `extends` copia o `networks` do serviço base, e sem esta linha os dois
    # serviços nasceriam com o MESMO 172.18.0.241 — o Docker recusa o
    # segundo container ("Pool overlaps"). Mesma razão, faixa contígua.
    networks:
      - pdv-internal
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Frontend ----------
  # Mesma lógica: nginx servindo build estático, duas instâncias do mesmo
  # tag. Sem healthcheck porque é conteúdo estático — o nginx atende assim
  # que sobe, e o switch.sh confirma o resultado pelo probe HTTP.
  frontend:
    build: ../frontend
    image: ${FRONTEND_IMAGE:-pdv-frontend:local}
    restart: unless-stopped
    # IP fixo para o `/etc/hosts` do caddy-host.sh (mesma razão do `backend`).
    networks:
      - pdv-internal

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s


  ws-gateway:
    build:
      context: ../ws-gateway
      dockerfile: ${WS_DOCKERFILE:-Dockerfile}
    image: ${WS_GATEWAY_IMAGE:-pdv-ws-gateway:local}
    profiles: ["ws-gateway"]
    restart: unless-stopped
    # IP fixo para o `/etc/hosts` do caddy-host.sh (mesma razão do `backend`).
    # De quebra, o probe do host (`curl http://ws-gateway:8080/health`) passa
    # a funcionar: a porta 8080 não é publicada, mas o host alcança o IP da
    # bridge diretamente.
    networks:
      - pdv-internal
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-pdv}:${POSTGRES_PASSWORD:-pdv_password}@postgres:5432/${POSTGRES_DB:-pdv}?sslmode=disable}
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}

      - WS_DISPATCH=${WS_DISPATCH:-}

      - GIT_SHA=${GIT_SHA:-}

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      # `retries: 20` com `interval: 3s` é o que segura o ruído: um banco
      # congelado vira 503 em ~3s, mas o container só fica `unhealthy` depois de
      # ~60s de 503 seguidos (medido: t+63s), e volta a `healthy` sozinho quando
      # o banco destrava — o probe de fundo retoma e o próximo ok fecha a janela.
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - pdv-internal
    #    ports:
    #      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
#   1. BANCO DE DADOS GEOGRÁFICO EXCLUSIVO
#  pdv_gis_db:
#    image: postgis/postgis:15-3.3
#    container_name: pdv_gis_db
#    environment:
#      POSTGRES_USER: pdv_geo_admin
#      POSTGRES_PASSWORD: DefinaUmaSenhaSeguraAqui
#      POSTGRES_DB: pdv_delivery_geo
#    ports:
#      - "5433:5432" # Porta isolada para evitar conflito com o Postgres principal (5432)
#    volumes:
#      - gis_data:/var/lib/postgresql/data
#    networks:
#      - pdv-internal
#    restart: always
#    deploy:
#      resources:
#        limits:
#          memory: 2g




  # 2. MOTOR DE ROTAS AVANÇADO (Valhalla)
  # Sobe em cima dos tiles compilados por ../prepare-geo-data.sh — sem
  # deploy/map_data/valhalla/valhalla_tiles.tar o container entra em crash loop.
  router:
    # GHCR (não Docker Hub): o `valhalla/valhalla:run-latest` do Hub está
    # congelado na 3.3.0 (2023) e falha com configs atuais.
    image: ghcr.io/valhalla/valhalla:latest
    restart: unless-stopped
    command: valhalla_service /custom_files/valhalla.json
    volumes:
      - ./map_data/valhalla:/custom_files
    networks:
      - pdv-internal
    healthcheck:
      # A imagem não traz curl/wget; o probe abre um socket crú no serviço HTTP.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8002' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sem porta publicada: acesso externo é só via Caddy (routes.localhost).

  # 3. OTIMIZADOR DE DELIVERY (VROOM — VRP multi-parada)
  # Resolve a sequência ideal de entregas; usa o `router` (Valhalla) como
  # motor de matrizes de distância/tempo (ver map_data/vroom/config.yml).
  # A imagem oficial é `vroom-docker`: vroom-express (HTTP :3000) + vroom core.
  optimizer:
    image: ghcr.io/vroom-project/vroom-docker:v1.15.0
    restart: unless-stopped
    volumes:
      - ./map_data/vroom:/conf
    environment:
      - VROOM_ROUTER=valhalla # precede o `router` do config.yml; host/port vêm do config
    networks:
      - pdv-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok||r.status===404?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Sem porta publicada: acesso externo é só via Caddy (optimizer.localhost).

  # 4. SERVIDOR DE TILES ATUALIZADO (TileServer GL)
  tiles:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    volumes:
      - ./map_data/tileserver:/data
    command: -c /data/config.json
    networks:
      - pdv-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/data.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Sem porta publicada: acesso externo é só via Caddy (tiles.localhost).

volumes:
  caddy_data:
    name: pdv_caddy_data
  caddy_config:
    name: pdv_caddy_config
  backend_uploads:
    name: pdv_backend_uploads # fotos de produto — incluir no backup junto com o banco
  redis_data:
    name: pdv_redis_data
  postgres_data:
    name: pdv_postgres_data # dados do Postgres — NUNCA apague sem backup
#  gis_data:
#    name: pdv_gis_data

networks:
  pdv-internal:
    driver: bridge
    name: pdv-internal  # <-- Isto força o nome exato sem prefixos