name: Instalador Windows (Tauri)

# ============================================================
# O CAMINHO CANÔNICO dos instaladores da família standalone.
#
# Duas portas de entrada, uma só definição de build:
#
#   1. `workflow_call` — chamada pelo job `build-desktop` de
#      deploy-on-tag.yml, que é quem roda a cada tag `v*.*.*` (backend) e
#      `app-v*.*.*` (app) e publica
#      o manifesto do auto-update junto com o deploy do backend.
#   2. `workflow_dispatch` — "gera só o instalador, agora": útil para
#      repetir o build de uma versão já publicada, conferir que o runner
#      Windows ainda compila, ou produzir o instalador de um commit que
#      ainda não virou tag. Não depende de tag nenhuma.
#
# Por que não são dois arquivos: dois workflows de instalador divergem (um
# assina, o outro não; um publica no servidor, o outro não) e quem for
# publicar a próxima versão acaba escolhendo o caminho errado.
#
# A matriz `app: [pdv, kds]` cobre os dois apps DESKTOP da família (PDV Caixa e
# KDS Cozinha). Os apps mobile (Garçom/Entregador) moram no repo separado
# `pdv-mobile-apps`.
#
# O que este workflow garante:
# - assina o artefato com a chave Ed25519 do secret; sem o secret o
#   `tauri build` falha em vez de gerar um instalador que o app instalado
#   rejeita;
# - roda lint e testes do frontend antes de compilar;
# - monta o `latest.json` de CADA app no formato que o
#   `tauri-plugin-updater` entende (sem BOM, assinatura por plataforma),
#   apontando para o endpoint do app — se PDV e KDS publicassem no
#   mesmo manifesto, um consumiria o update do outro;
# - publica manifesto e `.exe` em `deploy/updates/<app>/` no servidor,
#   que é o que dá o download por URL própria e o auto-update.
#
# O app v1 (frontend/src-tauri, em produção) tem o seu próprio script
# de build: `scripts/build/build-app.sh`. Este workflow não o substitui.
# ============================================================

on:
  workflow_call:
    inputs:
      publicar_no_servidor:
        description: "Publica latest.json + instalador em deploy/updates/ no VPS (auto-update)"
        type: boolean
        default: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      UPDATE_BASE_URL:
        required: false
      HOSTINGER_HOST:
        required: false
      HOSTINGER_PORT:
        required: false
      HOSTINGER_USER:
        required: false
      HOSTINGER_SSH_KEY:
        required: false
      # É o secret que o job `publish` (abaixo) lê no input `fingerprint` das
      # três actions appleboy. A DECLARAÇÃO aqui não é cosmética: em
      # `workflow_call` o secret do chamador é a interseção das permissões, e
      # um secret que não for declarado neste bloco nem chega no workflow
      # chamado — sem esta linha o `fingerprint` seria vazio mesmo com o
      # secret cadastrado no repositório. O chamador é o job `build-desktop`
      # de deploy-on-tag.yml (que é quem passa o valor); no disparo manual
      # (`workflow_dispatch`) não há chamador e o secret vem direto do repo.
      HOSTINGER_SSH_FINGERPRINT:
        required: false
      HOSTINGER_APP_PATH:
        required: false

  workflow_dispatch:
    inputs:
      publicar_no_servidor:
        description: "Publica latest.json + instalador em deploy/updates/ no VPS (auto-update)"
        type: boolean
        default: true
      nota:
        description: "Observação da release (vai nas notas do manifesto)"
        type: string
        default: ""

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [pdv, kds]
    name: build (${{ matrix.app }})
    permissions:
      contents: write
    env:
      APP: ${{ matrix.app }}
      CRATE_DIR: standalone-${{ matrix.app }}
      # ============================================================
      # ONDE O BUNDLE NSIS NASCE — E POR QUE É A RAIZ DO REPO
      # ============================================================
      # Esta é a FONTE ÚNICA do caminho do bundle. Os três lugares que
      # precisam dele (montar o latest.json, o upload-artifact e o resumo
      # final) usam `${{ env.BUNDLE_DIR }}`; não cole o caminho em lugar
      # nenhum, e não "conserte" de volta para dentro do crate.
      #
      # O caminho é a RAIZ do workspace Cargo, NÃO `<crate>/target`. Isto NÃO
      # é bug, é a regra do Cargo, e já custou um run inteiro (37390730557):
      # `standalone-pdv` e `standalone-kds` são MEMBERS do workspace declarado no
      # `Cargo.toml` da raiz, e o Cargo SEMPRE compila no `target/` da raiz
      # do workspace — o `target/` do member nunca é criado. Não existe
      # `.cargo/config.toml` no repo (nenhum `target-dir` customizado), então
      # não há como o bundle cair dentro do crate.
      #
      # Prova, não é teoria — o próprio log do build deste workflow:
      #
      #   Finished 1 bundle at:
      #           D:\a\pdv-completo\pdv-completo\target\release\bundle\nsis\
      #             KDS Cozinha_0.1.0_x64-setup.exe
      #
      # `pdv-completo\target\...` é a RAIZ. Com o caminho relativo ao crate,
      # o passo seguinte fazia `Get-ChildItem "target/release/bundle/nsis"`
      # de dentro de `standalone-kds/` — um diretório que nunca existiu — e
      # morria com "Nenhum .exe em ... (build do instalador nao rodou?)".
      # Aquela mensagem era enganosa: o build tinha rodado e o .exe estava lá.
      #
      # Confirmação local, sem Windows e sem 20 min de build:
      #   $ cargo metadata --no-deps --format-version 1
      #   "target_directory": "<repo>/target", "workspace_root": "<repo>"
      #
      # `CRATE_DIR` continua existindo e continua sendo o `working-directory`
      # de quem precisa do `Cargo.toml` do crate (resolver a versão) ou da CLI
      # do Tauri (`tauri build` tem de rodar de dentro do crate, senão a
      # busca por tauri.conf.json desce 3 níveis e acha frontend/src-tauri).
      # Onde o bundle SAI é a raiz; de onde o build é INVOCADO é o crate.
      BUNDLE_DIR: ${{ github.workspace }}/target/release/bundle/nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Dois lockfiles, por motivos diferentes: a CLI do Tauri
          # (@tauri-apps/cli) agora mora na RAIZ do repo (cache e `npm ci`
          # da raiz abaixo), e o lint/testes + beforeBuildCommand ainda usam
          # frontend/node_modules (frontend/package-lock.json).
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      # A versão publicada é a do Cargo.toml do crate (os tauri.conf.json da
      # família standalone NÃO declaram `version` — o Tauri lê do Cargo.toml
      # automaticamente). O Cargo.toml do crate pode trazer `version = "x.y.z"`
      # literal em [package], OU herdar do workspace com
      # `version.workspace = true` — aí a fonte é [workspace.package].version
      # do Cargo.toml da RAIZ do repo (é o caso hoje: 0.1.0). O passo abaixo
      # resolve as duas formas e falha se nenhuma casar.
      #
      # A resolução se repete NOS TRÊS pontos que precisam da versão (este
      # passo, o latest.json e a tag da release) de propósito: passos pwsh são
      # independentes e não há como compartilhar variável entre eles (nem
      # entre jobs) sem exportar via GITHUB_ENV/outputs — e cada cópia fica
      # ao lado do único lugar que a usa. Repetição intencional.
      #
      # A tag NÃO é conferida contra a versão dos standalone: a tag é do
      # app v1/backend (o que o deploy-on-tag publica), e cada crate da
      # família tem sua própria versão. A conferência tag-vs-conf do app v1
      # continua sendo manual, no `scripts/build/build-app.sh`.
      - name: Conferir versão do crate
        working-directory: ${{ env.CRATE_DIR }}
        shell: pwsh
        run: |
          # Resolve a versão do crate. Duas formas válidas, nesta ordem:
          #   1. literal em [package]          -> version = "1.2.3"
          #   2. herdada do workspace          -> version.workspace = true
          #      (fonte: [workspace.package].version no Cargo.toml da RAIZ)
          # Os tauri.conf.json da família não declaram `version`, então este
          # Cargo.toml é a única fonte da versão publicada. Sem resolver,
          # falha — versão vazia aqui vira tag `v`, latest.json com
          # "version": null, e o auto-update para de funcionar em silêncio.
          function Resolve-CrateVersion([string]$crateCargo) {
            $cargo = Get-Content -LiteralPath $crateCargo -Raw
            # Só a seção [package]: um `version = "1"` noutra seção (ex.:
            # [dependencies.foo]) não é a versão do crate.
            $pkg = [regex]::Match($cargo, '(?ms)^\[package\].*?(?=^\[|\z)').Value
            if ($pkg -match '(?m)^[ \t]*version\s*=\s*"([^"]+)"') {
              return $Matches[1]
            }
            if ($pkg -match '(?m)^[ \t]*version\s*\.\s*workspace\s*=\s*true') {
              # standalone-<app>/ -> raiz do repo -> Cargo.toml do workspace.
              # [IO.Path] e nao `Split-Path -LiteralPath ... -Parent`: o pwsh
              # recusa -LiteralPath junto com -Parent ("Parameter set cannot
              # be resolved"), e -Path trataria [ ] da path como wildcard.
              $crateFile = (Resolve-Path -LiteralPath $crateCargo).Path
              $crateDir = [IO.Path]::GetDirectoryName($crateFile)
              $rootDir = [IO.Path]::GetDirectoryName($crateDir)
              $rootCargo = Join-Path -Path $rootDir -ChildPath 'Cargo.toml'
              $ws = [regex]::Match((Get-Content -LiteralPath $rootCargo -Raw), '(?ms)^\[workspace\.package\].*?(?=^\[|\z)').Value
              if ($ws -match '(?m)^[ \t]*version\s*=\s*"([^"]+)"') {
                return $Matches[1]
              }
              Write-Error "version.workspace = true em $crateCargo, mas $rootCargo nao tem [workspace.package].version"
              exit 1
            }
            Write-Error "Cargo.toml nao tem [package].version nem version.workspace = true: $crateCargo"
            exit 1
          }
          $cargoVersion = Resolve-CrateVersion 'Cargo.toml'
          Write-Host "Versao: $cargoVersion (do Cargo.toml do crate)"

      # O daemon de impressão saiu deste repositório (reescrita à parte), então
      # o sidecar Go não faz mais parte do build. Os tauri.conf.json da família
      # não declaram `externalBin`, então nada aqui depende do Go. Retomar
      # quando o novo daemon for embutido.

      # Duas instalações, propósitos distintos: a RAIZ traz a CLI do Tauri
      # (@tauri-apps/cli, usada no passo de build via ../node_modules/.bin)
      # e frontend/ traz o app em si — o beforeBuildCommand usa o vite de
      # frontend/node_modules. Nenhuma substitui a outra.
      - name: Instalar dependencias (raiz, CLI Tauri)
        working-directory: .
        run: npm ci

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint e testes do frontend
        working-directory: frontend
        # Não é enfeite: um instalador que "funciona" com o app quebrado é
        # pior do que um run vermelho, porque o cliente só descobre no caixa.
        run: npm run lint && npm run test

      # O beforeBuildCommand do tauri.conf.json compila o frontend com o
      # profile do app (`npm run build:pdv`, `build:kds`) e os confs mandam
      # `cd ../frontend && ...`. Esse `cd` só funciona se o CWD do hook for
      # <repo>/frontend — e o CWD NÃO vem do frontendDist (o comentário antigo
      # dizia isso e estava errado): a CLI usa TAURI_FRONTEND_PATH se existir;
      # senão parte do cwd de invocação e desce (depth 3) atrás de um
      # package.json; não achando, cai no PAI do crate = RAIZ do repo. O crate
      # não tem package.json, então SEM o env o hook rodava na raiz,
      # `cd ../frontend` apontava para fora do repo e o build morria com
      # "The system cannot find the path specified" (v1.0.15 e v1.0.16).
      #
      # A CLI do Tauri mora em node_modules/.bin na RAIZ do repo — os crates
      # não têm node_modules próprio, e `npx tauri` de dentro do crate não
      # acha o binário. Do crate (standalone-<app>/), o caminho relativo é
      # ../node_modules/.bin (instalado pelo `npm ci` da raiz acima).
      #
      # A lógica de build local (exigência de chave no --release, chave
      # descartável no build local, parse de --bundles, listagem de
      # artefatos e mensagem final) tem definição canônica em
      # scripts/lib/build-tauri.sh, compartilhada por build-standalone.sh
      # e build-app.sh. A duplicação pwsh deste passo é intencional: passos
      # pwsh são independentes e não há como compartilhar código entre eles
      # (nem entre jobs) sem exportar via GITHUB_ENV/outputs — ver o
      # comentário no passo "Conferir versão do crate".
      - name: Build do instalador (assinado)
        working-directory: ${{ env.CRATE_DIR }}
        shell: pwsh
        env:
          # Fixa o frontend_dir da CLI: sem isto o beforeBuildCommand roda na
          # raiz do repo e o `cd ../frontend` dos confs falha. Mesmo valor
          # exportado por scripts/build/build-standalone.sh no build local.
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/frontend
          # A chave publica esta no tauri.conf.json (plugins.updater.pubkey);
          # a privada so existe aqui. Sem TAURI_SIGNING_PRIVATE_KEY o build
          # falha em vez de gerar artefato que o app rejeita.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $tauri = "../node_modules/.bin/tauri.cmd"
          & $tauri build --bundles nsis

      # O manifesto é montado por app, com a URL apontando para o diretório
      # do app. Se PDV e KDS publicassem no mesmo latest.json, o updater
      # do PDV baixaria o instalador do KDS.
      #
      # O `working-directory` é o CRATE (o passo precisa do `Cargo.toml` dele
      # para resolver a versão), mas `$dir` NÃO pode ser relativo a ele: o
      # bundle nasce no `target/` da RAIZ do workspace. `${{ env.BUNDLE_DIR }}`
      # é absoluto e é a fonte única desse caminho — ver o bloco em `env:` do
      # job. Um caminho relativo aqui foi o que matou o run 37390730557 com a
      # mensagem enganosa "build do instalador nao rodou?" quando o build tinha
      # rodado e o .exe estava no lugar.
      - name: Montar manifesto latest.json
        working-directory: ${{ env.CRATE_DIR }}
        shell: pwsh
        run: |
          $dir = '${{ env.BUNDLE_DIR }}'
          # Descoberta pelo .sig, nao por extensao do artefato.
          #
          # Com createUpdaterArtifacts=true (modo v2, o que o conf do PDV usa)
          # o Tauri nao gera NENHUM zip no Windows: o updater reusa o proprio
          # instalador, e a assinatura sai como <artefato>.sig. O .nsis.zip
          # so existe em createUpdaterArtifacts="v1Compatible". Exigir .zip
          # aqui foi o que travou o primeiro build de verdade.
          #
          # O KDS nao tem updater (sem plugins.updater no conf), entao nao
          # gera .sig — o artefato é o .exe direto. O manifesto do KDS é
          # inócuo hoje, mas o layout já é o mesmo para quando tiver.
          $sig = Get-ChildItem "$dir/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            # So o ultimo segmento some: "X.exe.sig" -> "X.exe", "X.nsis.zip.sig" -> "X.nsis.zip".
            $artefato = [IO.Path]::GetFileNameWithoutExtension($sig.Name)
          } else {
            $exe = Get-ChildItem "$dir/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) {
              # A mensagem antiga ("build do instalador nao rodou?") era
              # enganosa e atirou o debug na direção errada: o build tinha
              # rodado, o que não existia era o caminho do bundle. Além do
              # caminho certo, este passo mostra ONDE procurou e onde o bundle
              # realmente pode estar — `cargo metadata` é a fonte da verdade.
              Write-Error "Nenhum .exe em $dir (fonte unica do caminho: env BUNDLE_DIR)"
              Write-Host "Procure tambem em <raiz-do-repo>/target/release/bundle/nsis e em <crate>/target/release/bundle/nsis."
              Get-ChildItem (Join-Path '${{ github.workspace }}' 'target/release') -Directory -ErrorAction SilentlyContinue |
                Select-Object FullName | Format-Table -AutoSize
              exit 1
            }
            $artefato = $exe.Name
          }
          $sigFull = if ($sig) { $sig.FullName } else { $null }

          $base = '${{ secrets.UPDATE_BASE_URL }}'
          if (-not $base) { $base = 'https://app.umamisushiarte.com.br' }
          $base = $base.TrimEnd('/')

          # Resolve a versão do crate. DUAS observações importantes aqui:
          #
          #   1. NÃO é mais `(Get-Content tauri.conf.json).version` — os
          #      tauri.conf.json da família standalone NÃO declaram `version`
          #      (o Tauri lê do Cargo.toml), então isso resultaria em $null e
          #      o manifesto sairia com "version": null: o caixa instalado
          #      ignoraria o update em silêncio, sem erro nenhum.
          #   2. Mesma resolução do passo "Conferir versão do crate" (literal
          #      em [package] OU version.workspace = true -> [workspace.package]
          #      na raiz do repo). A cópia é intencional: passos pwsh são
          #      independentes e não há como compartilhar variável entre eles
          #      sem exportar via GITHUB_ENV (ver comentário no início do job).
          function Resolve-CrateVersion([string]$crateCargo) {
            $cargo = Get-Content -LiteralPath $crateCargo -Raw
            # Só a seção [package]: um `version = "1"` noutra seção (ex.:
            # [dependencies.foo]) não é a versão do crate.
            $pkg = [regex]::Match($cargo, '(?ms)^\[package\].*?(?=^\[|\z)').Value
            if ($pkg -match '(?m)^[ \t]*version\s*=\s*"([^"]+)"') {
              return $Matches[1]
            }
            if ($pkg -match '(?m)^[ \t]*version\s*\.\s*workspace\s*=\s*true') {
              # standalone-<app>/ -> raiz do repo -> Cargo.toml do workspace.
              # [IO.Path] e nao `Split-Path -LiteralPath ... -Parent`: o pwsh
              # recusa -LiteralPath junto com -Parent ("Parameter set cannot
              # be resolved"), e -Path trataria [ ] da path como wildcard.
              $crateFile = (Resolve-Path -LiteralPath $crateCargo).Path
              $crateDir = [IO.Path]::GetDirectoryName($crateFile)
              $rootDir = [IO.Path]::GetDirectoryName($crateDir)
              $rootCargo = Join-Path -Path $rootDir -ChildPath 'Cargo.toml'
              $ws = [regex]::Match((Get-Content -LiteralPath $rootCargo -Raw), '(?ms)^\[workspace\.package\].*?(?=^\[|\z)').Value
              if ($ws -match '(?m)^[ \t]*version\s*=\s*"([^"]+)"') {
                return $Matches[1]
              }
              Write-Error "version.workspace = true em $crateCargo, mas $rootCargo nao tem [workspace.package].version"
              exit 1
            }
            Write-Error "Cargo.toml nao tem [package].version nem version.workspace = true: $crateCargo"
            exit 1
          }
          $version = Resolve-CrateVersion 'Cargo.toml'

          $nota = '${{ inputs.nota }}'
          if (-not $nota) { $nota = "${{ matrix.app }} $version" }

          # A URL do artefato é separada por app: /updates/files/<app>/windows-x86_64/.
          # O Caddyfile serve esse caminho (ver deploy/Caddyfile).
          $url = "$base/updates/files/${{ matrix.app }}/windows-x86_64/$artefato"

          # A assinatura vem do .sig; sem updater (KDS), fica vazia.
          $signature = ''
          if ($sigFull) { $signature = (Get-Content $sigFull -Raw).Trim() }

          # Chave da plataforma = {{target}}-{{arch}} do endpoint dinamico.
          # O alvo e Windows x64; um dia sair arm64 vira outra chave aqui.
          $manifest = @{
            version   = $version
            notes     = $nota
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url       = $url
              }
            }
          }
          # utf8NoBOM: um BOM no inicio faz o serde_json do plugin recusar o
          # manifesto (falha de parse em silencio, update nao acontece).
          $out = Join-Path $dir 'latest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $out -Encoding utf8NoBOM
          Write-Host "Manifesto $version -> $artefato ($url)"
          Get-Content $out

      # O bundle vai para um artefato do run, e o job `publish` é quem o
      # manda para o VPS. Além de o ssh-action não funcionar no runner
      # Windows, essa separação é o que torna a publicação barata de
      # iterar: o build do instalador leva ~20 min, mas se o publish
      # falhar dá para re-runar SÓ ele, baixando o bundle do artefato.
      - name: Guardar o bundle para o job de publicação
        uses: actions/upload-artifact@v4
        with:
          name: nsis-bundle-${{ matrix.app }}
          # Raiz do workspace, nunca `<crate>/target` — ver o bloco em `env:`.
          # Com o caminho do crate o `if-no-files-found: error` abaixo derrubava
          # o job DEPOIS dos ~20 min de build.
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 7

      # `if: always()` de propósito: quando o build falha, este passo é a única
      # saída que mostra o que existe de fato. Por isso ele NÃO pode estar
      # cego para o diretório certo — listar um caminho inexistente produzia uma
      # tabela vazia e silêncio, que é a pior leitura possível num run vermelho.
      - name: Resumo dos artefatos
        if: always()
        shell: pwsh
        run: |
          Write-Host "Bundle esperado em ${{ env.BUNDLE_DIR }} (raiz do workspace Cargo)"
          Get-ChildItem '${{ env.BUNDLE_DIR }}' -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize
          if ('${{ inputs.publicar_no_servidor }}' -ne 'true') {
            Write-Host ''
            Write-Host 'Publicacao no servidor DESLIGADA neste run: o latest.json nao foi servido e'
            Write-Host 'o app instalado nao vai encontrar esta versao. Para publicar depois, dispare'
            Write-Host 'este workflow de novo com "publicar_no_servidor" marcado.'
          }

  # A release é um job separado da matriz porque a release é POR TAG, não
  # por app: os dois instaladores (PDV + KDS) entram na mesma release. Se
  # fosse dentro da matriz, os dois jobs tentariam criar a release e o
  # segundo falharia com 422 (release já existe) — e o passo de upload
  # nunca rodaria, como já aconteceu com o `create || upload` antigo.
  #
  # A release vem ANTES do SSH de propósito: ela é o caminho de
  # download do instalador que não depende de nada externo. Se o scp
  # falhar (secret ausente, VPS fora, pasta com dono errado), o job
  # quebra aqui — mas o .exe já está salvo e pode ser publicado a mão.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # A tag é a ref quando começa com v (entrada por tag, via
      # deploy-on-tag.yml). Na entrada por dispatch não há tag: quem manda
      # na versão publicada é o Cargo.toml do crate do PDV
      # (standalone-pdv/Cargo.toml — os tauri.conf.json da família não
      # declaram `version`, e o Cargo.toml pode ser literal em [package] ou
      # herdado do workspace na raiz; mesma resolução do passo "Conferir
      # versão do crate", aqui repetida porque é outro job), e a release
      # aponta para o commit deste run (--target), que é o que assinou o
      # artefato.
      - name: Definir a tag da release
        id: tag
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'

          # Resolve a versão do crate (literal em [package] OU
          # version.workspace = true -> [workspace.package].version no
          # Cargo.toml da RAIZ). Cópia intencional do mesmo trecho dos
          # passos do job `build`: job e runner são outros (linux, sem
          # GITHUB_ENV em comum), então não há como compartilhar. Sem isto
          # `$conf.version` viraria $null em disparo manual e a tag sairia
          # como "v".
          function Resolve-CrateVersion([string]$crateCargo) {
            $cargo = Get-Content -LiteralPath $crateCargo -Raw
            # Só a seção [package]: um `version = "1"` noutra seção (ex.:
            # [dependencies.foo]) não é a versão do crate.
            $pkg = [regex]::Match($cargo, '(?ms)^\[package\].*?(?=^\[|\z)').Value
            if ($pkg -match '(?m)^[ \t]*version\s*=\s*"([^"]+)"') {
              return $Matches[1]
            }
            if ($pkg -match '(?m)^[ \t]*version\s*\.\s*workspace\s*=\s*true') {
              # standalone-<app>/ -> raiz do repo -> Cargo.toml do workspace.
              # [IO.Path] e nao `Split-Path -LiteralPath ... -Parent`: o pwsh
              # recusa -LiteralPath junto com -Parent ("Parameter set cannot
              # be resolved"), e -Path trataria [ ] da path como wildcard.
              $crateFile = (Resolve-Path -LiteralPath $crateCargo).Path
              $crateDir = [IO.Path]::GetDirectoryName($crateFile)
              $rootDir = [IO.Path]::GetDirectoryName($crateDir)
              $rootCargo = Join-Path -Path $rootDir -ChildPath 'Cargo.toml'
              $ws = [regex]::Match((Get-Content -LiteralPath $rootCargo -Raw), '(?ms)^\[workspace\.package\].*?(?=^\[|\z)').Value
              if ($ws -match '(?m)^[ \t]*version\s*=\s*"([^"]+)"') {
                return $Matches[1]
              }
              Write-Error "version.workspace = true em $crateCargo, mas $rootCargo nao tem [workspace.package].version"
              exit 1
            }
            Write-Error "Cargo.toml nao tem [package].version nem version.workspace = true: $crateCargo"
            exit 1
          }

          if ($ref -like 'v*') {
            $tag = $ref
            Write-Host "Entrada por tag: $tag"
          } else {
            $crateVersion = Resolve-CrateVersion 'standalone-pdv/Cargo.toml'
            $tag = "v$crateVersion"
            Write-Host "Disparo manual a partir de $ref, nao de tag."
            Write-Host "ATENCAO: a release $tag vai apontar para o commit deste run (--target), e e ele que assinou o artefato."
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TAG=$tag"

      # O create é melhor esforço de propósito. O `||` que existia aqui
      # ("create || upload") era armadilha nos dois sentidos, e foi assim
      # que a release ficou sem o instalador por seis runs seguidos com o
      # passo VERDE:
      #   * release nova  → create ganha, o upload NUNCA roda, e a release
      #     nasce sem asset nenhum;
      #   * release velha → o create falha (422) e o upload devia rodar,
      #     mas o passo terminava em 5s, sem tempo de subir 212 MB.
      # Em ambos os casos o sintoma era invisível: a release existia, o
      # job passava, e só o cliente perceberia (update que nunca chega).
      - name: Criar a release (se não existir)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          # --repo explicito: a inferencia por repositorio git depende do CWD.
          # --target: a release tem de apontar para o commit que gerou este
          # .exe. Sem isso ela nasce no topo da branch padrao — outro codigo,
          # com o mesmo nome de versao.
          gh release create $tag --repo '${{ github.repository }}' --title "PDV $tag" --target '${{ github.sha }}' --generate-notes 2>$null

      - name: Baixar os bundles do run
        uses: actions/download-artifact@v4
        with:
          pattern: nsis-bundle-*
          merge-multiple: true
          path: bundles

      - name: Anexar instaladores na release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG
          $exes = Get-ChildItem 'bundles/*.exe' | Sort-Object Name
          if (-not $exes) { Write-Error "Nenhum .exe nos bundles baixados"; exit 1 }
          foreach ($exe in $exes) {
            # Path completo, e nao glob: o glob depende de quem expande (bash
            # expande antes do gh, PowerShell nao), e um glob que nao casa nao
            # erro — apenas não sobe nada.
            gh release upload $tag --repo '${{ github.repository }}' $exe.FullName --clobber
          }

          # Confere de verdade que os assets subiram. Sem isto, qualquer falha
          # de upload (release sem asset, glob que nao casou, token sem escopo)
          # produzia release vazia com o passo verde.
          $assets = gh release view $tag --repo '${{ github.repository }}' --json assets --jq '.assets | length'
          if ([int]$assets -lt 1) {
            Write-Error "Release $tag ficou sem assets depois do upload (assets=$assets)"
            exit 1
          }
          gh release view $tag --repo '${{ github.repository }}' --json url -q '"release: " + .url'
          Write-Host "assets na release: $assets"

  # Publicar latest.json + instalador em deploy/updates/ no VPS.
  #
  # Job separado, e em Linux, por causa de uma incompatibilidade concreta: o
  # appleboy/ssh-action e o scp-action nao rodam no runner Windows. O primeiro
  # build de verdade morreu assim, depois de 20 min de compilacao:
  #
  #   Unknown or unsupported platform: mingw64_nt-10.0-26100.
  #   Supported platforms are Linux, Darwin, and Windows.
  #
  # O shell do runner Windows e Git Bash (MSYS/MinGW), e o entrypoint dessas
  # actions-docker nao reconhece esse uname. Nao e segredo faltando nem VPS
  # fora: e a plataforma. O job `deploy` de deploy-on-tag.yml usa as MESMAS
  # actions e funciona, porque roda em ubuntu-latest.
  #
  # Onde este job falha, a release do GitHub ja existe com os .exe anexados
  # (o job release faz isso antes), entao o download por URL do GitHub nunca
  # dependeu do VPS.
  #
  # A verificacao da host key do SSH esta nos TRES steps de appleboy deste
  # job (o mkdir, o scp e o ajuste de layout), e nao e mais um buraco. O que
  # estava aqui era o oposto de protecao: HOSTINGER_KNOWN_HOSTS estava
  # DECLARADO no bloco `secrets:` do workflow_call e nao era usado em lugar
  # nenhum do arquivo. Ele nunca verificou nada — `known_hosts` NAO e input
  # do appleboy/ssh-action@v1 nem do appleboy/scp-action@v1 (cada uma ignora
  # e segue, avisando so no log: "Unexpected input(s) 'known_hosts', valid
  # inputs are ['host', 'port', ..., 'fingerprint', ...]"). Um secret
  # declarado e nao usado e o pior dos dois mundos: a leitura do arquivo era
  # "a chave do host esta sendo conferida", e em TODA publicacao de instalador
  # (tag de app ou workflow_dispatch) o `key` de producao ia para o VPS sem
  # nenhuma conferencia. O aviso silencioso e o que torna isso pior do que
  # abertamente nao passar.
  #
  # O input que verifica e `fingerprint`, e ele existe nas TRES actions
  # usadas aqui — inclusive no scp-action, com a mesma descricao ("SHA256
  # fingerprint of the host's public key. If not set, host key verification
  # is skipped"), ou seja, mesmo formato e mesmo comportamento opt-in. Com o
  # secret vazio a action cai em `ssh.InsecureIgnoreHostKey()`, que e o
  # comportamento de hoje: a linha estar presente nao ativa nada sozinha.
  # ENQUANTO HOSTINGER_SSH_FINGERPRINT NAO EXISTIR NO REPOSITORIO A
  # VERIFICACAO CONTINUA DESLIGADA — sem regressao, sem deploy quebrado. E o
  # que passa a proteger a chave de producao no dia em que o secret existir:
  # cadastrar e a unica coisa que falta, ninguem precisa mexer neste arquivo
  # de novo (por isso o secret nao virou valor fixo aqui — ele nasce do
  # `ssh-keyscan` no host, e quem opera o deploy e quem cadastra).
  #
  # O valor tem de ser a chave que o cliente SSH destas actions REALMENTE
  # negocia, e nao a linha que parece a obvio: o `ssh-keyscan` imprime UMA
  # LINHA POR TIPO de chave e, para o cliente delas (drone-ssh, em Go), a
  # preferencia e ecdsa-sha2-nistp256 > ecdsa-sha2-384 > ecdsa-sha2-521 >
  # rsa-sha2-256/512 > ssh-rsa > ssh-ed25519. `ed25519` e a ULTIMA
  # preferencia, entao colar a linha do ed25519 — a que o
  # `ssh-keyscan -t ed25519` devolve, e a que parece a obvia — da MISMATCH. O
  # formato e o "SHA256:..." do `ssh-keygen -lf`, e o valor de referencia
  # continua sendo o da linha `ecdsa-sha2-nistp256`. O job `deploy` de
  # deploy-on-tag.yml e a secao "Verificacao da host key do SSH (fingerprint)"
  # do deploy/README.md registram isto com o mesmo detalhe; se o host trocar
  # de chave, o que se atualiza em todos os lugares e o secret.
  #
  # Errar o valor nao publica nada pela metade: o mismatch acontece NO
  # HANDSHAKE, antes de qualquer comando remoto, e o custo e um run
  # vermelho. Isso e o que torna o cadastro valer a pena — o premio e a
  # chave privada de producao deixar de ir para qualquer coisa que se faca
  # passar pelo Hostinger no meio da rede, e o preco de errar o SHA256 e
  # alguns minutos de debug.
  #
  # ------------------------------------------------------------------
  # A REGRA DESTE JOB: `env:` DE JOB NÃO ALCANÇA O `script:` DA APPLEBOY
  # ------------------------------------------------------------------
  # Varredura dos TRÊS steps de appleboy deste job, feita para não ficar
  # só no conserto pontual (o primeiro deles quebrou no run 37414894926):
  #
  #   step                          | variáveis no script | como chegam
  #   ------------------------------|---------------------|----------------
  #   Preparar deploy/updates (ssh) | UPDATES, APP        | ambas interpoladas
  #   Publicar no servidor (scp)    | nenhuma (só source/ | sem shell: é o
  #                                  | target/strip_comp)  | input da action
  #   Ajustar layout (ssh)          | UPDATES, APP        | ambas interpoladas
  #
  # E o que NÃO é appleboy, no mesmo job: "Conferir o que será publicado"
  # é um `run:` do runner e usa `$APP` do `env:` de job — ali funciona, e
  # é o único uso legítimo desse `env:`.
  #
  # Motivo: o `script:` do appleboy/ssh-action é enviado por SSH e executado
  # no shell do usuário REMOTO (zsh no Hostinger). `${{ }}` é resolvido pelo
  # runner antes de enviar; `env:` de job/step vive no runner e não viaja.
  # Com `set -Eeuo pipefail`, qualquer `$VAR` não interpolada nesse script
  # morre na hora — "zsh:N: VAR: parameter not set" — DEPOIS de todo o
  # trabalho caro (build, assinatura e release). Regra: dentro de `script:`
  # de appleboy, tudo é `${{ }}` ou é declarado antes de usar.
  #
  # O job `deploy` do deploy-on-tag.yml segue a mesma regra (APP_PATH e TAG
  # interpolados no script, com o motivo registrado lá).
  publish:
    needs: release
    if: inputs.publicar_no_servidor
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [pdv, kds]
    name: publish (${{ matrix.app }})
    env:
      # Este `env:` de job é legítimo e continua aqui: o step "Conferir o que
      # será publicado" é um `run:` comum, executado pelo runner, onde o
      # ambiente do job CHEGA sim (é o único lugar deste job que usa `$APP`
      # sem interpolar).
      #
      # Ele NÃO alcança o `script:` das actions appleboy — o script roda no
      # shell remoto, por SSH, e não vê o ambiente do runner. Por isso os três
      # scripts de appleboy deste job interpolam o que precisam. O sintoma
      # dessa confusão está registrado no primeiro step ("Preparar
      # deploy/updates no servidor") e custou o run 37414894926.
      APP: ${{ matrix.app }}
    steps:
      # O mkdir vem antes do scp por um motivo concreto: o job `deploy` (dono
      # do ensure_updates_dir, em deploy-on-tag.yml) só acontece DEPOIS deste
      # workflow, na entrada por tag. Sem criar o diretório aqui, a primeira
      # publicação de uma instalação nova quebra no scp — e quebra depois de
      # já ter feito o trabalho caro.
      - name: Preparar deploy/updates no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          # `fingerprint` é o input que de fato confere a host key (o
          # `known_hosts` nunca existiu nestas actions) — ver o bloco do job
          # acima. Vazio = comportamento de hoje, sem verificação.
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          # ============================================================
          # POR QUE `$APP` É INTERPOLADO AQUI E NÃO VEM DO `env:` DO JOB
          # ============================================================
          # O job `publish` declara `env: APP: ${{ matrix.app }}`, e esse
          # `env:` NÃO CHEGA no `script:` desta action — foi o que matou o
          # run 37414894926 (tag app-v0.1.0), no primeiro step de appleboy,
          # DEPOIS dos dois instaladores compilarem, assinarem e a release
          # existirem:
          #
          #   zsh:9: APP: parameter not set
          #   ##[error]Process completed with exit code 1.
          #
          # Motivo: o `script:` do appleboy/ssh-action NÃO é executado pelo
          # runner — ele é enviado por SSH e roda no shell do USUÁRIO REMOTO
          # (no Hostinger, `zsh`, não bash). A interpolação `${{ }}` acontece
          # antes, na hora de montar o texto do script; o que o runner tem no
          # ambiente (`env:` de job e de step) simplesmente não existe lá
          # dentro. Com `set -Eeuo pipefail`, `$APP` indefinido mata o script
          # na hora em que aparece — linha 9 do script, que é o `mkdir` logo
          # abaixo.
          #
          # Por que não o input `envs:` da appleboy: ele existe no
          # ssh-action, mas (a) o scp-action NEM TEM esse input — os dois
          # steps de publicação precisariam de dois jeitos diferentes de
          # declarar a mesma variável, o que é pior que repetir a atribuição;
          # (b) o `envs:` é construído a partir de `${{ }}` de qualquer
          # jeito, ou seja, não economiza a interpolação; e (c) o padrão que
          # JÁ FUNCIONAVA neste arquivo é interpolar — é o que o step "Ajustar
          # layout no servidor" (mais abaixo) faz, e o que o job `deploy` do
          # deploy-on-tag.yml faz com APP_PATH e TAG. Uma atribuição a mais
          # não muda semântica nenhuma: o valor é o mesmo `matrix.app`.
          #
          # NÃO "simplifique" esta linha de volta para `$APP` puro achando que
          # o `env:` do job cobre. Se precisar de outra variável neste
          # script, declare-a logo abaixo desta, interpolada.
          script: |
            set -Eeuo pipefail
            UPDATES="${{ secrets.HOSTINGER_APP_PATH }}/deploy/updates"
            APP="${{ matrix.app }}"
            # `-p` sem problema: o dono é o mesmo usuário do scp, então não
            # há como o Docker criar isto antes como root (o que faria o scp
            # falhar com permission denied — ver switch.sh).
            # Cada app tem seu próprio diretório de manifesto e de artefatos:
            # o Caddy espera latest.json em deploy/updates/<app>/ e os
            # artefatos em deploy/updates/files/<app>/windows-x86_64/.
            mkdir -p "$UPDATES/$APP" "$UPDATES/files/$APP/windows-x86_64"

      - name: Baixar o bundle do run
        uses: actions/download-artifact@v4
        with:
          name: nsis-bundle-${{ matrix.app }}
          path: bundle

      - name: Conferir o que será publicado
        run: |
          set -Eeuo pipefail
          # `find` em vez de `ls` (SC2012, actionlint/shellcheck): nome de
          # arquivo de instalador pode ter caractere que o `ls` trata de forma
          # diferente do shell. E aqui a lista é só diagnóstico — o que decide
          # o run são os `test` e o `jq` abaixo.
          find bundle -maxdepth 1 -printf '%M %10s %f\n' | sort
          test -f bundle/latest.json || { echo "Faltou o latest.json no bundle"; exit 1; }
          # O artefato é derivado do .sig quando existe (PDV, com updater) ou
          # do .exe direto (KDS, sem updater — ver o passo Montar manifesto).
          sig=$(find bundle -maxdepth 1 -type f -name '*.sig' | sort | head -1)
          if [ -n "$sig" ]; then
            artefato="${sig%.sig}"
          else
            artefato=$(find bundle -maxdepth 1 -type f -name '*.exe' | sort | head -1)
          fi
          test -n "$artefato" || { echo "Faltou o artefato no bundle"; exit 1; }
          # O manifesto tem que apontar para um arquivo que realmente vai
          # subir. Errar aqui é melhor que publicar um latest.json que aponta
          # para o vazio — o app instalado ignoraria a versão em silêncio.
          jq -r '.platforms["windows-x86_64"].url' bundle/latest.json | grep -qF "/files/$APP/windows-x86_64/$(basename "$artefato")" \
            || { echo "O latest.json nao aponta para $(basename "$artefato")"; jq . bundle/latest.json; exit 1; }
          echo "OK: manifesto aponta para $(basename "$artefato")"

      - name: Publicar no servidor (SCP)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          # O `scp-action` tem o mesmo input `fingerprint`, com a mesma
          # semântica opt-in ("SHA256 fingerprint of the host's public key.
          # If not set, host key verification is skipped"). É este step que
          # manda a chave de assinatura e o instalador de produção para o
          # servidor, então é o que mais precisava da conferência.
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          # `source` do scp-action é resolvido a partir do workspace, e não de
          # um working-directory do step (que esta action não tem).
          source: 'bundle/*'
          target: ${{ secrets.HOSTINGER_APP_PATH }}/deploy/updates/${{ matrix.app }}/
          # O scp-action NÃO copia o conteúdo de um diretório: ele empacota
          # os sources em tar e desempacota no destino. E o tar grava os
          # paths COMO SÃO DADOS — `filepath.Glob("bundle/*")` devolve
          # "bundle/latest.json", "bundle/PDV...exe", e o tar preserva esse
          # prefixo. Sem isto o desempacotamento recriava
          # deploy/updates/bundle/ em vez de soltar os arquivos em
          # deploy/updates/, e o Caddy (que serve /srv/pdv-updates/latest.json,
          # via bind mount ./updates:/srv/pdv-updates) respondia 404 para
          # sempre: o manifesto existia, só que um diretório abaixo. O job
          # passava, o auto-update nunca acontecia.
          #
          # `strip_components: 1` arranca esse primeiro elemento na extração.
          # É o input documentado da action para isto, e é melhor do que
          # depender de baixar o artefato na raiz do workspace (o que
          # faria o `*` pegar qualquer outra coisa que estivesse lá).
          strip_components: 1

      - name: Ajustar layout no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          # Idem: os TRÊS steps de appleboy deste job são conferidos, não
          # só este. Este é o último comando remoto da publicação — um
          # fingerprint errado morre no handshake, antes de chegar aqui.
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          script: |
            set -Eeuo pipefail
            UPDATES="${{ secrets.HOSTINGER_APP_PATH }}/deploy/updates"
            APP="${{ matrix.app }}"
            # scp joga tudo no mesmo nivel; o Caddy espera latest.json em
            # deploy/updates/<app>/ e os artefatos em
            # deploy/updates/files/<app>/windows-x86_64/ (ver Caddyfile).
            cd "$UPDATES/$APP"
            # latest.json fica na raiz do app; todo o resto vai para o
            # diretorio da plataforma. O glob de assinatura e `*.sig`, e nao
            # `*.zip.sig`: em createUpdaterArtifacts=true o artefato do updater
            # e o proprio .exe, entao a assinatura chega como <exe>.sig.
            # Listar as duas extensoes de artefato e um `*.sig` cobre v2 e
            # v1Compatible.
            mv -f -- *.exe *.zip *.sig "../files/$APP/windows-x86_64/" 2>/dev/null || true
            # O `bundle/` é o que sobrou da publicação anterior, quando o
            # scp-action desempacotava com o prefixo do source (ver o
            # comentário no passo de scp). Não é servido pelo Caddy — só
            # ocupava 212 MB e confundia quem fosse olhar o diretório.
            # `--` e o cd acima mantêm isto restrito a $UPDATES/$APP/bundle.
            rm -rf -- bundle
            ls -la . "../files/$APP/windows-x86_64"
