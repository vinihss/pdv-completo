# ============================================================
# O GATE DE MERGE.
#
# Roda a cada pull_request contra `main` e nada mais: o que este arquivo
# NÃO faz também é intencional.
#
# - Não dispara em push direto na `main`. Quem escreve na main é o merge do
#   PR, e o PR já foi testado aqui; rodar de novo só duplicaria runner.
# - Não roda em tag. O gate de release é o `deploy-on-tag.yml`, que chama
#   a MESMA suíte (`tests.yml`) — mesmo contrato antes do merge e antes
#   do deploy, uma definição só.
# - Não substitui o `build-desktop.yml`. O instalador Windows não é
#   gate de merge (é lento e muda por decisão de release), e ele tem as
#   próprias verificações de frontend antes de compilar.
#
# O job abaixo não tem `runs-on`/`steps`: chama o workflow reutilizável.
#
# ============================================================
# UM JOB CHAMADOR, NÃO DOIS — LEIA ANTES DE "CORRIGIR"
# ============================================================
# A armadilha do `workflow_call` que custa runner dobrado: um job chamador
# NÃO escolhe qual job do workflow chamado roda. Ele chama o workflow
# INTEIRO, e o GitHub roda TODOS os jobs de dentro. O total de execuções
# num run é `jobs do chamador × jobs do chamado`:
#
#     2 chamadores × 2 jobs do tests.yml  =  4 execuções  (backend 2×, frontend 2×)
#     1 chamador   × 2 jobs do tests.yml  =  2 execuções  (backend 1×, frontend 1×)
#
# Foi assim que a primeira versão deste arquivo ficou: dois jobs chamadores
# (`test-backend` e `test-frontend`), ambos apontando para o mesmo
# `tests.yml` — e cada suíte rodou duas vezes, com o runner-minutes pelo
# meio. Do ponto de vista do YAML parecia innocuous; o desperdício só
# aparece em `gh pr checks`, que listava 4 checks num PR.
#
# NÃO "descompartilhe" em dois chamadores achando que está evitando
# colisão de nome: os nomes dos checks são `job do chamador / job do
# chamado`, então dois chamadores não colidem — eles só duplicam as
# execuções. Um chamador é o que produz 2 checks, um por suíte.
#
# (A saída alternativa, um input booleano + `if:` no workflow chamado,
# também funciona e deixa o número de chamadores igual ao de suítes —
# mas cobra um input e uma condição para comprar nada. Não é o caminho.)
#
# CONSEQUÊNCIA PARA O RULESET: com um chamador, o nome do check é
# `tests / <job de dentro>` — hoje `tests / test-backend`,
# `tests / test-frontend`, `tests / test-pedido-public`,
# `tests / test-ws-gateway` e `tests / test-pagarme-webhook` (o job chamador
# chama `tests`, e os jobs de dentro mantêm o nome). Antes eram
# `test-backend / test-backend` e `test-frontend / test-frontend`. Se
# houver ruleset exigindo check por nome, ele precisa do nome ATUAL —
# confirme em `gh pr checks` antes de escrever a regra.
#
# `test-pedido-public` entrou depois dos outros e é o terceiro exemplo de que a
# contagem acima ("2 jobs do tests.yml") não é um número fixo: acrescentei um
# job ao workflow chamado, este arquivo NÃO mudou, e o terceiro check passou a
# existir sozinho. É o motivo de a regra ser "um chamador" e não "liste os
# jobs": a lista é do `tests.yml`, que é o arquivo que muda.
# ============================================================

on:
  pull_request:
    branches:
      - main

# ============================================================
# CONCURRENCY: UM PUSH NOVO CANCELA O RUN VELHO DA MESMA PR
# ============================================================
# O gate de PR leva ~2min por execução (medido: `tests / test-printer-daemon`
# sozinho leva 116s no run 37411275059), e é o que trava o merge. Quem empurra
# 5 commits seguidos sem esperar o gate pagava 5 execuções de 7 jobs cada para
# ler só a última — e ainda ocupava a fila de concorrência do repositório, que é
# o limite real quando várias PRs estão abertas ao mesmo tempo.
#
# `cancel-in-progress: true` mata o run anterior de MESMA PR. O que NÃO é
# tocado:
#
# - outras PRs: o grupo leva o número da PR, então duas PRs abertas continuam
#   rodando em paralelo (a fila do próprio GitHub resolve o resto);
# - o `deploy-on-tag.yml`: NÃO tem `cancel-in-progress`, e não deve. O run de
#   produção não pode ser morto por um push novo — se duas tags saírem
#   seguidas, a segunda não pode cancelar o deploy da primeira. A política é
#   invertida de propósito: gate cancelável, produção não.
#
# POR QUE O NÚMERO DA PR E NÃO O `github.ref`: em `pull_request` o
# `github.ref` é `refs/pull/<n>/merge`, que também serviria, mas o número deixa
# o grupo legível na lista de runs ("CI (pull request)-110") e não depende do
# formato do ref.
#
# `github.workflow` no grupo (a recomendação da documentação do GitHub) isola
# este workflow dos outros do repo: um `pr-checks.yml` com o mesmo grupo
# cancelaria o `ci-pr.yml` e vice-versa.
#
# E POR QUE O `concurrency` NÃO ESTÁ NO `tests.yml`: um workflow chamado herda
# o `github.workflow` do chamador, e o `deploy-on-tag.yml` chama o `tests.yml`
# DUAS vezes — as duas chamadas cairiam no mesmo grupo e a segunda cancelaria a
# primeira. O porquê inteiro está no cabeçalho do `tests.yml`.
# ============================================================
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
