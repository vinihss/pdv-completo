name: PR Checks

# `edited` não é enfeite: o título da PR é o que vira a mensagem do squash, e
# ele muda DEPOIS de a PR ser aberta (e depois do commitlint passar). Sem
# `edited` no gatilho, renomear o título não reavalia nada.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          commitDepth: 1
          failOnWarnings: false

  # ============================================================
  # POR QUE UM JOB PARA O TÍTULO: O COMMITLINT NÃO OLHA O TÍTULO
  # ============================================================
  # O job acima valida os COMMITS DA BRANCH. Quem decide se o release sai
  # não é nenhum deles: no merge SQUASH o GitHub usa o TÍTULO da PR como
  # mensagem do commit. Um título fora do Conventional Commits vira um
  # commit que o `commit-analyzer` não entende — e o desfecho é a pior
  # categoria de falha de pipeline: run VERDE, merge concluído, NENHUMA
  # tag, ninguém avisado.
  #
  # MEDIDO NESTE REPO (PR #89): o título `feat/printer` entrou na main
  # como o commit `aaf4551`, com 31 arquivos e 5.586 linhas, e o log do
  # Semantic Release respondeu
  #   The commit should not trigger a release
  #   Analysis of 1 commits complete: no release
  # O commitlint reprovou a mesma PR pelo mesmo motivo
  # (`⧗ input: printer` / `subject may not be empty`), mas ele não é
  # gate de merge — a PR entrou assim mesmo.
  #
  # Shell puro, sem action de terceiro: a decisão do repo é que
  # dependência externa de Action é superfície de supply chain. O
  # `npx commitlint-cli` resolveria, mas traz o parser inteiro do
  # commitlint para checar UMA linha, e a mesma regra que o
  # `@commitlint/config-conventional` aplica cabe numa regex — que ainda
  # é auditável numa tela.
  #
  # O gate tem duas metades, e a segunda é a que ninguém esperava: não
  # basta o título ser Conventional Commit, é preciso que o `.releaserc.json`
  # publicue ALGUMA coisa com ele. `chore/docs/ci/...` são válidos e não
  # geram tag; e o `!` de breaking é pior — é aceito por todo mundo e não
  # gera nada. Os dois casos saem em `::warning::` com o motivo medido, porque
  # são Conventional Commits válidos: barrar a PR por eles seria alarme
  # falso. FALHAR fica reservado para o que o release não entende de jeito
  # nenhum — e aí a mensagem diz o que fazer, não só que a regex não casou.
  # ============================================================
  titulo-conventional:
    name: Validar título da PR (Conventional Commit)
    runs-on: ubuntu-latest
    steps:
      - name: Validar o título contra Conventional Commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail

          REPO="${GITHUB_REPOSITORY}"

          # A PR é lida na API, não do payload do evento: com `edited`, o
          # payload do disparo é um retrato do momento da edição e pode já
          # estar velho. A API é a autoridade do título atual.
          PR="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          TITULO="$(printf '%s' "$PR" | jq -r '.title // ""')"
          CORPO="$(printf '%s' "$PR" | jq -r '.body // ""')"
          N_COMMITS="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json commits --jq '.commits | length')"
          AUTO_MERGE="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json autoMergeRequest --jq '.autoMergeRequest.enabledAt // ""')"

          # ----------------------------------------------------------------
          # A CONFIGURAÇÃO DE SQUASH DO REPOSITÓRIO — E ELA ESTÁ NO MEIO
          # ----------------------------------------------------------------
          # Não basta o título: é preciso saber de ONDE sai a mensagem do
          # commit de squash. São dois campos independentes na API do repo:
          #
          #   squash_merge_commit_title    -> de onde vem a PRIMEIRA LINHA
          #   squash_merge_commit_message  -> de onde vem o CORPO
          #
          # Estado MEDIDO deste repositório (2026-10-05, `gh api repos/:owner/:repo`):
          #   squash_merge_commit_title   = COMMIT_OR_PR_TITLE
          #   squash_merge_commit_message = COMMIT_MESSAGES
          #
          # Isto é: com UM commit, a primeira linha do squash é a MENSAGEM
          # DESTE COMMIT (o título da PR nem entra); com DOIS ou mais, é o
          # título da PR. Conferido em quatro PRs: #89 (8 commits), #90 (2),
          # #85 (10) e #92 (2) — nos quatro, a primeira linha do squash foi
          # o título da PR. Por isso título em Conventional Commits é
          # condição NECESSÁRIA e não suficiente, e este gate não pode
          # prometer o que a configuração do repo não promete.
          #
          # A PR pode sobrescrever os dois campos; quando não sobrescreve, os
          # campos nem vêm no JSON da PR. Ordem: PR primeiro, repo depois.
          #
          # E o "repo depois" tem um senão medido: o `github.token` do PR NÃO
          # enxerga esses dois campos (a API responde null), porque são
          # metadados de configuração de merge. Por isso há um PADRÃO
          # declarado aqui, igual ao valor medido — a API só serve para
          # confirmar quando ela responde. Se um dia alguém mudar a
          # configuração de squash do repositório, este é o lugar a atualizar
          # (e o job imprime a fonte que usou, no log).
          # ----------------------------------------------------------------
          PADRAO_TITULO='COMMIT_OR_PR_TITLE'
          PADRAO_CORPO='COMMIT_MESSAGES'

          FONTE_TITULO="$(printf '%s' "$PR" | jq -r '.squash_merge_commit_title // ""')"
          FONTE_CORPO="$(printf '%s' "$PR" | jq -r '.squash_merge_commit_message // ""')"
          FONTE="config da PR"
          if [[ -z "$FONTE_TITULO" || -z "$FONTE_CORPO" ]]; then
            FONTE_TITULO="$(printf '%s' "$PR" | jq -r '.squash_merge_commit_title // ""')"
            FONTE_CORPO="$(printf '%s' "$PR" | jq -r '.squash_merge_commit_message // ""')"
            if [[ -z "$FONTE_TITULO" || -z "$FONTE_CORPO" ]]; then
              REPO_CFG="$(gh api "repos/${REPO}")"
              FONTE_TITULO="$(printf '%s' "$REPO_CFG" | jq -r '.squash_merge_commit_title // ""')"
              FONTE_CORPO="$(printf '%s' "$REPO_CFG" | jq -r '.squash_merge_commit_message // ""')"
              FONTE="config do repositório"
            fi
          fi
          if [[ -z "$FONTE_TITULO" ]]; then
            FONTE_TITULO="$PADRAO_TITULO"
            FONTE="${FONTE} (padrão medido deste repo)"
          fi
          if [[ -z "$FONTE_CORPO" ]]; then
            FONTE_CORPO="$PADRAO_CORPO"
            FONTE="${FONTE} (padrão medido deste repo)"
          fi

          # ----------------------------------------------------------------
          # AS REGRAS, COPIADAS DE ONTEM — não reescritas aqui.
          #
          # `type-enum` do `@commitlint/config-conventional` (o
          # `commitlint.config.cjs` do repo só desliga `body-max-line-length`
          # e `footer-max-line-length`; a lista de tipos continua a padrão).
          # Se um dia o `commitlint.config.cjs` ganhar um `type-enum` próprio,
          # esta lista tem de acompanhar — está anotado aqui justamente para
          # não ser um segundo lugar onde a regra vive sem ninguém perceber.
          # ----------------------------------------------------------------
          TIPOS='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'

          # Tipos que o `.releaserc.json` marca com `"release": false`. O
          # título é aceito, mas aquela linha NÃO vira tag. Avisar é evitar a
          # surpresa "mergeei e não saiu release" — que é a mesma classe de
          # falha do Gate A, só que um tipo abaixo.
          TIPOS_SEM_TAG='build|chore|ci|docs|refactor|style|test'

          # `tipo(escopo): descrição`, com escopo opcional e `!` de breaking nas duas
          # formas (`feat!: x` e `feat(api)!: x`). O `!` entra no gate porque
          # o commitlint aceita — mas o efeito dele no release é outro, e está
          # medido e explicado no aviso do fim do job.
          RE="^($TIPOS)(\([^()]+\))?(!)?: .+"

          # ----------------------------------------------------------------
          # O TÍTULO REALMENTE VAI PARA O COMMIT SQUASH?
          #
          # Depende de `FONTE_TITULO` (medido acima):
          #
          #   PR_TITLE           -> o título sempre governa. Com 1 commit
          #                        ou com 10, a primeira linha do squash é o
          #                        título da PR.
          #   COMMIT_OR_PR_TITLE -> com 1 commit, governa a MENSAGEM do
          #                        commit; com 2+, governa o título da PR.
          #                        (é o estado atual deste repositório)
          #
          # Quando o título não governa, FALHAR aqui seria alarme falso: a
          # linha que vira commit é a mensagem do commit, e quem valida a do
          # commit é o job `commitlint` acima, no MESMO workflow. Nesse caso
          # o gate avisa e explica, em vez de barrar a PR por uma linha que
          # não vai virar commit.
          # ----------------------------------------------------------------
          case "${FONTE_TITULO^^}" in
            PR_TITLE)
              TITULO_GOVERNA=true
              ;;
            COMMIT_OR_PR_TITLE)
              if [[ "${N_COMMITS}" -gt 1 ]]; then
                TITULO_GOVERNA=true
              else
                TITULO_GOVERNA=false
              fi
              ;;
            *)
              TITULO_GOVERNA=false
              ;;
          esac

          echo "[gate] config do squash: ${FONTE_TITULO}/${FONTE_CORPO} (fonte: ${FONTE}) | commits na PR: ${N_COMMITS} | o título governa: ${TITULO_GOVERNA}"
          echo "[gate] título: ${TITULO}"

          if [[ ! "$TITULO" =~ $RE ]]; then
            # O título não vira commit: aviso, não barreira.
            if [[ "$TITULO_GOVERNA" == false ]]; then
              echo "::warning title=Título fora do padrão, mas não é ele que vira commit::A PR #${PR_NUMBER} tem ${N_COMMITS} commit(s) e a config do repo usa 'squash_merge_commit_title=${FONTE_TITULO}': a primeira linha do commit de squash será a mensagem do commit, não o título da PR. A mensagem do commit já é validada pelo job 'Validate Conventional Commits' deste mesmo workflow. Para o TÍTULO ser a mensagem do squash — e auditável por este gate — mude a config para 'Pull request title' nas Settings do repositório."
              exit 0
            fi

            # Título vazio é caso próprio: o GitHub aceita PR sem título, e
            # sem título não há nem regex para casar nemConventional Commit
            # para o release entender.
            if [[ -z "${TITULO//[[:space:]]/}" ]]; then
              echo "::error title=Título vazio::A PR #${PR_NUMBER} não tem título, e o título é a primeira linha do commit de squash. Sem ele não há mensagem para o release entender e nenhuma tag sai. Dê um título no formato tipo(escopo): descrição."
              exit 1
            fi

            # Caso comum de quem já sabe a regra e escreve no lugar errado: o
            # Conventional Commit está na PRIMEIRA LINHA DO CORPO. O corpo do
            # PR não entra na mensagem do squash (o corpo do squash vem das
            # mensagens dos commits, se vier), então isso não salva nada — e é
            # justamente por isso que o erro repete "renomeie o título".
            PRIMEIRA_LINHA_CORPO="$(printf '%s\n' "$CORPO" | grep -m1 -v '^[[:space:]]*$' || true)"
            if [[ -n "$PRIMEIRA_LINHA_CORPO" && "$PRIMEIRA_LINHA_CORPO" =~ $RE ]]; then
              echo "  OBSERVAÇÃO: a primeira linha do CORPO ('${PRIMEIRA_LINHA_CORPO}')"
              echo "  parece um Conventional Commit, mas o corpo da PR não entra na"
              echo "  mensagem do squash. O que vale é o TÍTULO."
              echo
            fi

            echo "::error title=Título fora de Conventional Commits::A PR #${PR_NUMBER} precisa de um título no formato tipo(escopo): descrição. O título atual é: ${TITULO}"
            echo
            echo "POR QUE ESTE JOB EXISTE"
            echo "  Com ${N_COMMITS} commit(s), a primeira linha do commit de squash é"
            echo "  a MENSAGEM do commit; com 2 ou mais, é o TÍTULO desta PR. Nos dois"
            echo "  casos o Semantic Release só publica tag se a linha for um"
            echo "  Conventional Commit — e quando não é, o run fica VERDE, o merge"
            echo "  acontece, e nenhuma tag sai. Foi o PR #89: 31 arquivos e 5.586"
            echo "  linhas na main, zero release, zero aviso."
            echo
            echo "COMO RESOLVER (renomeie o título, não o commit)"
            echo "  gh pr edit ${PR_NUMBER} --title 'feat(escopo): descrição'"
            echo
            echo "  Tipos aceitos: feat (tag minor), fix/perf/revert (tag patch);"
            echo "                 build, chore, ci, docs, refactor, style, test"
            echo "                 (aceitos, mas NÃO publicam tag — o job avisa)."
            echo
            echo "  Exemplos que passariam:  feat(printer): dry-run sem vazamento de tmpdir"
            echo "                          fix(deploy): tag sem run de auditoria"
            echo "                          docs(agent-deploy): documentar os dois portões"
            echo "                          perf(deploy): cache do assembly do Caddy"
            if [[ -n "${AUTO_MERGE}" ]]; then
              echo
              echo "ATENÇÃO — ESTA PR JÁ ESTÁ NA FILA DE AUTO-MERGE (desde ${AUTO_MERGE})"
              echo "  Editar o título DEPOIS de enfileirar o auto-merge NÃO muda o"
              echo "  commit de squash: o GitHub congela a mensagem na hora em que a"
              echo "  PR entra na fila. Medido no repo: com o auto-merge ligado às"
              echo "  22:43:09 e o título editado depois, o squash saiu com o título"
              echo "  VELHO ('fix(printer): ... (#90)') e a falha passou batida."
              echo "  Portanto, nesta ordem:"
              echo "    1. tire da fila de auto-merge (botão 'Cancel auto-merge' na PR"
              echo "       ou GraphQL disablePullRequestAutoMerge);"
              echo "    2. renomeie o título;"
              echo "    3. reenfileire o auto-merge."
            fi
            echo
            echo "  (O job 'Validate Conventional Commits' desta PR olha os commits"
            echo "  da BRANCH, nunca o título. Os dois jobs são necessários.)"
            exit 1
          fi

          # O título passou no formato. Agora a pergunta que interessa de
          # verdade: o `.releaserc.json` vai publicar alguma coisa com esta
          # linha? É aqui que mora a segunda metade do silêncio — o formato
          # pode estar perfeito e a tag mesmo assim não sair.
          TIPO="${BASH_REMATCH[1]}"
          BREAKING="${BASH_REMATCH[3]}"

          if [[ -n "$BREAKING" ]]; then
            # MEDIDO com o próprio `commit-analyzer` do repo (mesmas
            # releaseRules do .releaserc.json, mesmo preset
            # conventionalcommits): o `!` no cabeçalho NÃO publica major, e na
            # verdade não publica NADA —
            #   'feat(api)!: quebra a API'  ->  type=null  ->  release=undefined
            # O preset `conventionalcommits` não casa o `!` no headerPattern,
            # então a linha inteira sai com type=null e nenhuma regra casa.
            # E o `{ "breaking": true, "release": "major" }` do .releaserc.json
            # só vale com uma NOTA `BREAKING CHANGE:` — que o analyzer lê do
            # CORPO do commit.
            if [[ "$TITULO_GOVERNA" == true ]]; then
              echo "::warning title='!' não publica major::'${TITULO}' tem '!', mas neste repo isso NÃO gera tag nenhuma (medido: o commit-analyzer devolve release=undefined para qualquer título com '!', porque o preset conventionalcommits não lê o '!' e o type sai null). Major só sai com uma nota 'BREAKING CHANGE:' no CORPO do commit. Deixe o título como 'feat(escopo): descrição' e ponha a incompatibilidade no corpo do commit (o corpo do squash vem de '${FONTE_CORPO}' neste repositório)."
            fi
            echo
            echo "  Detalhe do '!': a nota que dispara o major é 'BREAKING CHANGE:'"
            echo "  no corpo do COMMIT, não o '!' no cabeçalho. Quem valida o"
            echo "  cabeçalho do commit é o outro job desta PR; este aviso existe"
            echo "  porque o '!' no título passa em todo mundo e não publica nada."
            echo
          elif [[ "$TIPO" =~ ^($TIPOS_SEM_TAG)$ ]]; then
            echo "::warning title=Tipo não publica tag::'${TITULO}' é válido como Conventional Commit, mas o .releaserc.json marca '${TIPO}' com \"release\": false — ESTA LINHA NÃO VAI GERAR TAG. Se a intenção era entregar, use feat (minor), fix/perf (patch)."
            echo
            echo "  Para conferir a regra que decide isto: .releaserc.json →"
            echo "  commit-analyzer → releaseRules."
            echo
          fi

          # `header-max-length` do config-conventional é 100, mas aqui é
          # AVISO e não barreira: o squash ainda acrescenta ' (#NNN)' ao
          # título, e linha longa não impede tag nenhuma. Barrar por isso
          # seria o gate inventando regra que o release não tem.
          if [[ "${#TITULO}" -gt 100 ]]; then
            echo "::warning title=Título longo::${#TITULO} caracteres (o config-conventional põe 100). Não impede a tag, mas o título também é o resumo no CHANGELOG — considere encurtar."
          fi
          exit 0
