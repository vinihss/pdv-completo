name: Build e Pacote do Daemon (printer)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, feat/printer]

jobs:
  build-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: printer/daemon/go.sum
      - name: verificação dos 4 portões
        working-directory: printer/daemon
        run: |
          go mod download
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::rode gofmt -w printer/daemon"; exit 1; }
          go test -count=1 ./...
      - name: cross-compile Windows
        working-directory: printer/daemon
        run: |
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
          echo "Windows cross-compile OK"
      - name: pacote Linux
        working-directory: printer/daemon
        run: bash ../../printer/scripts/package-daemon-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-artefato
          path: printer/artifacts/*.tar.gz
