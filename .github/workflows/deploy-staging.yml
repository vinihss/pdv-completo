name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test (Staging Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdv_test
          POSTGRES_PASSWORD: pdv_test
          POSTGRES_DB: pdv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pdv_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pdv_test:pdv_test@localhost:5432/pdv_test
      TEST_DATABASE_URL: postgres://pdv_test:pdv_test@localhost:5432/pdv_test
      JWT_SECRET: test-secret-minimum-32-characters-long
      DEPLOYMENT_MODE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Test Backend
        working-directory: backend
        run: npm run test -- --run

      - name: Install Frontend
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Test Frontend
        working-directory: frontend
        run: npm run test -- --run
