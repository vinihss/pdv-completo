name: Desktop Windows

# Gera o instalador do app desktop (Tauri) para Windows a partir do mesmo
# código do PWA. O Linux é buildado localmente com `npm run desktop:build`
# (AppImage + deb) — ver frontend/build-app.sh.
#
# Dispara por tag `desktop-v*` ou manual. O instalador vai para a release da
# tag (rascunho, para revisar antes de publicar) — não há artefato do run:
# o tauri-action anexa direto na release, então um job de upload/download
# de artefato aqui não teria o que pegar.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (vazio = usa a branch/ref atual)"
        required: false
        default: ''
  push:
    tags:
      - 'desktop-v*'

env:
  VITE_DEFAULT_SERVER: https://app.umamisushiarte.com.br

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependências
        working-directory: frontend
        run: npm ci

      - name: Testes do frontend
        working-directory: frontend
        run: npm run lint && npm run test

      - name: Gera o instalador (.msi + setup.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: PDV ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: "Instalador do app desktop do PDV (Windows)."
          releaseDraft: true
          prerelease: false
          args: --bundles msi,nsis
