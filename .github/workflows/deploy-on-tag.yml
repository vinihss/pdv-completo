name: Deploy on Tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          npm run build
          npm run test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test

  build-desktop:
    # Gera o instalador Windows assinado e publica o manifesto do updater.
    # Só roda em tag: é o que define a versão, e o app instalado pergunta
    # "existe 0.3.0?" comparando com o manifesto servido.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: printer/daemon/go.sum

      - name: Conferir versão (tag x tauri.conf.json)
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($conf.version -ne $tag) {
            Write-Error "Tag $tag nao bate com tauri.conf.json version=$($conf.version). O updater publica a versao do conf, entao um desvio aqui gera manifesto errado."
            exit 1
          }
          Write-Host "Versao confere: $tag"

      - name: Gerar sidecar do daemon
        shell: bash
        run: bash printer/scripts/build-sidecar.sh

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      - name: Build do instalador (assinado)
        working-directory: frontend
        env:
          # A chave publica esta no tauri.conf.json (plugins.updater.pubkey);
          # a privada so existe aqui. Sem TAURI_SIGNING_PRIVATE_KEY o build
          # falha em vez de gerar artefato que o app rejeita.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Montar manifesto latest.json
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          # Descoberta pelo artefato, nao por nome fixo: o sufixo do zip mudou
          # entre versoes do Tauri (.exe.zip, .nsis.zip) e um glob rigido
          # publicaria um manifesto apontando para arquivo inexistente — o
          # sintoma seria "update simplesmente nao acontece", sem erro.
          $zip = Get-ChildItem "$dir/*.zip" | Select-Object -First 1
          if (-not $zip) { Write-Error "Nenhum artefato .zip em $dir"; exit 1 }
          $sig = "$($zip.FullName).sig"   # o .sig e sempre o artefato + .sig
          if (-not (Test-Path $sig)) { Write-Error "Falta a assinatura $sig"; exit 1 }

          $base = '${{ secrets.UPDATE_BASE_URL }}'
          if (-not $base) { $base = 'https://app.umamisushiarte.com.br' }
          $base = $base.TrimEnd('/')
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version

          # Chave da plataforma = {{target}}-{{arch}} do endpoint dinamico.
          # O alvo e Windows x64; um dia sair arm64 vira outra chave aqui.
          $manifest = @{
            version   = $version
            notes     = "PDV $version"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $sig -Raw).Trim()
                url       = "$base/updates/files/windows-x86_64/$($zip.Name)"
              }
            }
          }
          # utf8NoBOM: um BOM no inicio faz o serde_json do plugin recusar o
          # manifesto (falha de parse em silencio, update nao acontece).
          $out = Join-Path $dir 'latest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $out -Encoding utf8NoBOM
          Write-Host "Manifesto $version -> $($zip.Name)"
          Get-Content $out

      - name: Publicar no servidor (SSH)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          known_hosts: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          source: 'src-tauri/target/release/bundle/nsis/*'
          target: ${{ secrets.HOSTINGER_APP_PATH }}/deploy/updates/

      - name: Ajustar layout no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          known_hosts: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          script: |
            set -Eeuo pipefail
            UPDATES="${{ secrets.HOSTINGER_APP_PATH }}/deploy/updates"
            # scp joga tudo no mesmo nivel; o Caddy espera latest.json na raiz
            # e os artefatos em files/windows-x86_64/ (ver Caddyfile).
            mkdir -p "$UPDATES/files/windows-x86_64"
            cd "$UPDATES"
            mv -f -- *.exe *.zip *.zip.sig files/windows-x86_64/ 2>/dev/null || true
            ls -la . files/windows-x86_64

      - name: Anexar instalador na release do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' --title 'PDV ${{ github.ref_name }}' --generate-notes || \
          gh release upload '${{ github.ref_name }}' 'src-tauri/target/release/bundle/nsis/*.exe' --clobber

  deploy:
    needs: [test-backend, test-frontend, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sem downtime no VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          known_hosts: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          script: |
            set -Eeuo pipefail

            APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"
            TAG="${GITHUB_REF_NAME}"

            cd "$APP_PATH"

            echo "[deploy] Versão atual: $(git describe --tags --always 2>/dev/null || echo 'desconhecida')"
            echo "[deploy] Deploy da tag: $TAG"

            # Backup antes do deploy (não corromper dados)
            echo "[deploy] Criando backup antes do deploy..."
            ./deploy/backup.sh /opt/backups

            # Guarda o ponteiro de "qual instância está no ar" ANTES do
            # checkout. O `git checkout -f` abaixo reverte o arquivo para o
            # conteúdo do repo (sempre `backend`), e o switch lê esse
            # arquivo para saber de que lado está o tráfego: sem salvar,
            # ele promote a instância errada (e a imagem anterior se perde
            # como alvo de rollback).
            cp deploy/state/active-upstream /tmp/pdv-active-upstream.bak

            # Atualiza código para a tag
            echo "[deploy] Atualizando código para $TAG..."
            git fetch --prune origin
            git checkout -f "$TAG"
            cp /tmp/pdv-active-upstream.bak deploy/state/active-upstream

            # O switch faz tudo: build da imagem nova, sobe a instância
            # "-next" ao lado da atual, espera o healthcheck (o /health só
            # responde depois das migrations), aponta o Caddy por `reload`
            # e só então para a antiga. Se a instância nova não ficar
            # healthy, ele aborta ANTES do reload — o app antigo continua no
            # ar e o job falha, sem janela de erro.
            # `git checkout -f` e o bind mount de diretório: o container do
            # Caddy lê a Caddyfile nova no reload, sem precisar ser recriado
            # (o truque antigo de `--force-recreate caddy` custava ~2s de
            # proxy fora do ar).
            echo "[deploy] Switch (instância nova + reload do proxy)..."
            PDV_PROBE_URL="https://$(grep '^DOMAIN=' deploy/.env | cut -d= -f2)" \
              ./deploy/switch.sh

            echo "[deploy] Estado final:"
            ./deploy/switch.sh --status

            echo "[deploy] Deploy da tag $TAG concluído com sucesso."
            echo "[deploy] URL: https://$(grep '^DOMAIN=' deploy/.env | cut -d= -f2)"
            echo "[deploy] Se algo parecer errado no app: cd $APP_PATH && ./deploy/switch.sh --rollback"

