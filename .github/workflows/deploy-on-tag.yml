name: Deploy on Tag

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'        # linha BACKEND (publica o deploy)
      - 'app-v*.*.*'   # linha APP (publica o instalador Windows)

jobs:
  # As suítes moram em `tests.yml` (reusable workflow), e não aqui: o mesmo
  # gate roda na PR (ci-pr.yml) e na tag. Se cada caller carregasse uma
  # cópia dos corpos, a CI de PR e o gate de release iam divergir em
  # silêncio — o merge deixaria passar exatamente o que o deploy rejeita.
  # As CHAVES dos jobs continuam `test-backend`/`test-frontend` porque o
  # `needs:` abaixo resolve pelo nome do job NESTE arquivo, não pelo do
  # workflow chamado.
  #
  # E `test-pedido-public` (que existe dentro do `tests.yml` desde o PR #85)
  # NÃO ganha uma chave aqui de propósito. Cada chave deste arquivo é uma
  # chamada INTEIRA ao workflow reusable, e o GitHub roda TODOS os jobs de
  # dentro a cada chamada: acrescentar a chave não "rodaria o build do app
  # público uma vez a mais", rodaria as três suítes de novo. O build do app
  # público já roda nestas chamadas, porque o `tests.yml` o tem como job — e o
  # `deploy` NÃO depende dele: o `switch.sh` não sobe o container
  # `pedidopublic` (ele é `docker compose up` do serviço, fora do rodízio
  # azul/verde), então um `needs:` nele não protegeria nada e custaria uma
  # execução extra de tudo. Se um dia o app público entrar no caminho do
  # deploy, aí sim ele entra no `needs:` — e o jeito barato de fazer isso sem
  # triplicar runner é `needs: [tag-info, test-backend]` mais uma condição,
  # não uma chave nova.
  test-backend:
    uses: ./.github/workflows/tests.yml

  test-frontend:
    uses: ./.github/workflows/tests.yml

  tag-validation:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Validar formato da tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|app-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag $TAG fora do formato esperado (vX.Y.Z ou app-vX.Y.Z)"
            exit 1
          fi
          echo "Tag $TAG OK"

  # ============================================================
  # O NOME DA TAG É O PORTÃO. O DIFF É A AUDITORIA.
  # ============================================================
  # Duas linhas de versão, um prefixo cada:
  #
  #   v1.0.17      linha BACKEND  -> publica o backend (job `deploy`)
  #   app-v1.4.2   linha APP      -> publica o instalador Windows
  #
  # Antes these duas linhas dividiam o MESMO namespace e o MESMO formato
  # `vX.Y.Z`, e isso já causou incidente: `git push origin v1.4.1` (tag de
  # app) casou com `tags: ['v*.*.*']` e o job `deploy` RODOU — o log mostra
  # "[deploy] Deploy da tag: v1.4.1" e um switch azul/verde bem-sucedido em
  # produção. Um push meanto só para compilar o instalador publicava backend.
  #
  # POR QUE O PREFIXO DECIDE, E O DIFF SÓ FISCALIZA
  # A alternativa "descobrir o que mudou e decidir pelo diff" foi testada e
  # descartada por dois motivos medidos neste repo:
  #
  #   1. Falso positivo caro. `printer/asdasda.md` (zero bytes, commitado por
  #      engano no PR #7) mora dentro de `printer/`, que está no escopo do
  #      app: um arquivo inútil sozinho disparava ~20 min de compilação Rust.
  #   2. Falso negativo silencioso é pior. A lista de caminhos é inferência
  #      sobre arquivos, e inferência erra quieta.
  #
  # Quem decide é a tag, que é uma afirmação explícita do humano. O diff
  # vira fiscal: quando as duas coisas discordam, este job FALHA com a lista
  # dos arquivos, em vez de escolher sozinho e errar em silêncio.
  #
  # Viés deliberado: na dúvida, gritar. Erro de configuração custa um run
  # vermelho que alguém lê; o inverso custa cliente sem instalador.
  #
  # Sem `dorny/paths-filter` nem action de terceiros: dependência externa de
  # Action é superfície de supply chain, e este repo não usa nenhuma. Só
  # `actions/checkout` e shell.
  # ============================================================
  tag-info:
    runs-on: ubuntu-latest
    outputs:
      is-app-tag: ${{ steps.audit.outputs.is_app_tag }}
      is-backend-tag: ${{ steps.audit.outputs.is_backend_tag }}
      build-desktop-should-run: ${{ steps.audit.outputs.build_desktop_should_run }}
      deploy-should-run: ${{ steps.audit.outputs.deploy_should_run }}
      previous-tag: ${{ steps.audit.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 é OBRIGATÓRIO: o checkout padrão traz 1 commit e
          # NENHUMA tag, então `git describe --tags` não teria o que casar
          # e a auditoria rodaria sem comparação nenhuma.
          fetch-depth: 0

      - name: Classificar a tag e auditar o diff
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${GITHUB_REF_NAME}"

          # A linha da tag. O `--match` abaixo usa a MESMA chave: é isto que
          # impede a auditoria de comparar uma tag de app contra uma tag de
          # backend (os globs são disjuntos — `v*.*.*` NÃO casa `app-v1.4.2`,
          # porque o padrão exige `v` no primeiro caractere).
          #
          # `MATCH` da linha backend é `v*.*.*`, com `EXCLUDE='v1.4.*'`: a
          # família do app usou `v1.4.x` até a separação de prefixo (#27), e
          # sem o exclude essas tags legadas de app seriam casadas como se
          # fossem de backend. As tags de app novas já usam o prefixo `app-v`,
          # que o glob `v*.*.*` não casa.
          if [[ "$TAG" == app-v* ]]; then
            IS_APP=true
            IS_BACKEND=false
            MATCH='app-v*.*.*'
            EXCLUDE='__none__'
          else
            IS_APP=false
            IS_BACKEND=true
            MATCH='v*.*.*'
            EXCLUDE='v1.4.*'
          fi

          # Tag anterior DA MESMA LINHA, e só entre ancestrais: `HEAD^` como
          # ponto de partida garante que o resultado descreve um commit que
          # está de fato na história deste tag. Isto importa porque `v1.0.16`
          # NÃO é ancestral de `main` — comparar contra ela diffaria duas
          # histórias divergentes e a resposta seria aleatória.
          PREV="$(git describe --tags --abbrev=0 --match "$MATCH" --exclude "$EXCLUDE" HEAD^ 2>/dev/null || true)"

          # ==========================================================
          # ESCOPO DO APP — o que de fato entra no artefato instalado.
          #
          # `frontend/**` é o item mais fácil de errar: o app embute o
          # web. Os `standalone-*/tauri.conf.json` têm
          #   beforeBuildCommand: cd ../frontend && npm run build:pdv|kds
          #   frontendDist:       ../frontend/dist/pdv|kds
          # então QUALQUER mudança em `frontend/` entra no .exe. O backend
          # não vai para o binário, mas o build do app sempre recompila o
          # frontend — é por isso que `frontend/` conta como escopo do app
          # e não como escopo do backend.
          #
          # `standalone-pdv/**` e `standalone-kds/**` cobrem de uma vez
          # `tauri.conf.json`, `capabilities/**`, `icons/**` e os `*.rs`
          # dos dois crates.
          #
          # `Cargo.toml`/`Cargo.lock` contam porque a versão publicada do
          # instalador é resolvida de lá: trocar uma `tauri-plugin-*`
          # muda o binário. `printer/**` é o daemon; `scripts/build/build-standalone.sh`
          # é o build local equivalente; `build-desktop.yml` é a definição
          # canônica do próprio instalador, e mudá-lo é motivo para
          # revalidar o artefato.
          #
          # NÃO entram: `.githooks/**` e `scripts/dev/dev-worktree.sh` — são
          # ferramentas de desenvolvimento, não componentes do artefato.
          # ==========================================================
          APP_SCOPE_RE='^(?:standalone-pdv/|standalone-kds/|frontend/|printer/|scripts/build/)|^(?:Cargo\.toml|Cargo\.lock|\.github/workflows/build-desktop\.yml)$'

          APP_CHANGED=false
          TOTAL_CHANGED=0
          ERRO=""
          AVISO=""

          if [[ -n "$PREV" ]]; then
            DIFF="$(git diff --name-only "$PREV..$TAG")"
            TOTAL_CHANGED="$(printf '%s\n' "$DIFF" | wc -l)"
            RELEVANTES="$(printf '%s\n' "$DIFF" | grep -E "$APP_SCOPE_RE" || true)"
            if [[ -n "$RELEVANTES" ]]; then
              APP_CHANGED=true
            fi

            # Frontend numa tag de backend NÃO é erro: o deploy backend também
            # publica o web. `switch.sh` roda `docker compose build backend
            # frontend` e o switch promove `PDV_FRONTEND_UPSTREAM` junto com
            # `PDV_BACKEND_UPSTREAM` (switch.sh:186-187) — o container `frontend`
            # é o nginx que serve o app em produção. Mudar `frontend/` é o
            # caminho normal de toda release, e tratá-lo como "tag errada"
            # travava a linha backend desde a v1.0.15, quando a última tag de
            # backend foi publicada.
            #
            # Mudança que só o instalador Windows consome (os crates, `printer/`,
            # `Cargo.toml`/`Cargo.lock`, o próprio `build-desktop.yml`) NÃO é erro
            # numa tag de backend. As duas linhas são independentes: a separação de
            # prefixo (#27) existe para o push de `app-` não disparar deploy de
            # backend — o incidente foi `git push origin v1.4.1` publicar backend.
            # O inverso (backend mudando enquanto o app também mudou) é a situação
            # NORMAL de um time que trabalha nas duas frentes, e tratar isso como
            # erro travava a linha backend: entre a v1.0.15 e esta tag entravam
            # as PRs #20/#21, que mexiam em `Cargo.lock` e `build-desktop.yml`
            # justamente para consertar o build do instalador. Exigir a `app-` antes
            # da `v-` era um deadlock — a auditoria da linha backend sempre
            # compara com a tag backend anterior, então publicar a `app-` primeiro
            # não muda nada e o `v1.0.15` continuava no meio.
            #
            # Fica como AVISO, com o caminho de saída explícito: quem quiser o
            # instalador publicado publica a tag `app-` na MESMA tag de backend.
            INSTALADOR_RE='^(?:standalone-pdv/|standalone-kds/|printer/|scripts/build/)|^(?:Cargo\.toml|Cargo\.lock|\.github/workflows/build-desktop\.yml)$'
            SO_INSTALADOR="$(printf '%s\n' "$DIFF" | grep -E "$INSTALADOR_RE" || true)"

            if [[ "$IS_BACKEND" == true && -n "$SO_INSTALADOR" ]]; then
              AVISO="tag de backend '$TAG' e o diff $PREV..$TAG também toca $(printf '%s\n' "$SO_INSTALADOR" | wc -l) arquivo(s) de escopo do instalador Windows: $(printf '%s\n' "$SO_INSTALADOR" | head -10 | tr '\n' ' ')|| O deploy segue (backend e web). O instalador NÃO sai com esta tag — se ele também precisa ir, publique 'app-<versão>' na MESMA tag de backend."
            fi

            if [[ "$IS_APP" == true && "$APP_CHANGED" == false ]]; then
              # NÃO falha: release forçado/rebuild é legítimo, e o
              # `workflow_dispatch` do build-desktop.yml já é o escape.
              AVISO="tag de app '$TAG' mas NENHUM arquivo do escopo do instalador mudou entre $PREV e $TAG ($TOTAL_CHANGED arquivo(s) no total). Seguindo com o build mesmo assim — se foi rebuild forçado, tudo bem."
            fi
          else
            AVISO="primeira tag da linha '$MATCH' neste repo: não há tag anterior para comparar, então a auditoria NÃO foi verificada. O portão (o prefixo da tag) segue valendo."
          fi

          # O portão. Só o prefixo decide o que é publicado.
          BUILD_DESKTOP=false
          DEPLOY=false
          if [[ "$IS_APP" == true ]]; then
            BUILD_DESKTOP=true
            DEPLOY=false
          else
            BUILD_DESKTOP=false
            DEPLOY=true
          fi

          {
            echo "is_app_tag=$IS_APP"
            echo "is_backend_tag=$IS_BACKEND"
            echo "build_desktop_should_run=$BUILD_DESKTOP"
            echo "deploy_should_run=$DEPLOY"
            echo "previous_tag=$PREV"
          } >> "$GITHUB_OUTPUT"

          echo "::group::decisao por prefixo"
          echo "  tag            : $TAG"
          echo "  linha          : $([[ $IS_APP == true ]] && echo 'APP (instalador Windows)' || echo 'BACKEND (deploy)')"
          echo "  tag anterior   : ${PREV:-(nenhuma)}"
          if [[ -n "$PREV" ]]; then
            echo "  arquivos no diff: $TOTAL_CHANGED (escopo do app: $APP_CHANGED)"
          fi
          echo "  build-desktop  : $BUILD_DESKTOP"
          echo "  deploy backend : $DEPLOY"
          echo "::endgroup::"

          if [[ -n "$ERRO" ]]; then
            echo "::error::$ERRO"
            exit 1
          fi
          if [[ -n "$AVISO" ]]; then
            echo "::warning::$AVISO"
          fi

  build-desktop:
    # `needs` + `if` no job CHAMADOR, e não dentro do `build-desktop.yml`:
    # a regra do repo é uma única definição de build, e `if:` em job de
    # `workflow_call` é do chamador por definição. `needs.<job>.outputs`
    # resolve no contexto do chamador (o contexto `needs` está disponível em
    # `jobs.<job_id>.if`), então o resultado do `tag-info` chega aqui
    # normalmente.
    #
    # O `needs` também é o freio de segurança do resto do workflow: se a
    # auditoria falhar, este job não roda mesmo que o `if`-passasse.
    needs: tag-info
    if: needs.tag-info.outputs.build-desktop-should-run == 'true'
    # Os instaladores da família standalone (PDV Caixa + KDS Cozinha) é o
    # workflow `build-desktop.yml`, que também pode ser disparado sozinho
    # ("gerar só o instalador", sem tag e sem deploy do backend). Aqui ele
    # roda a cada tag: o manifesto do auto-update é publicado junto com o
    # deploy do backend, e o app instalado pergunta "existe <versão>?"
    # comparando com ele.
    #
    # A versão publicada é a do tauri.conf.json de CADA crate (conferida
    # contra o Cargo.toml do crate), não a tag — a tag é do app v1/backend,
    # e cada app da família tem sua própria versão. O app v1
    # (frontend/src-tauri, em produção) tem o seu próprio script de build:
    # `scripts/build/build-app.sh`.
    uses: ./.github/workflows/build-desktop.yml
    # `contents: write` precisa estar AQUI, não só no workflow chamado: em
    # `workflow_call` o token é a interseção das permissões de quem chama com
    # as do chamado, então sem isto o `gh release create` do instalador falha
    # com "resource not accessible by integration" — e o passo do manifesto
    # vem antes dele, ou seja, o run só quebra no fim, com tudo pronto.
    permissions:
      contents: write
    with:
      publicar_no_servidor: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      UPDATE_BASE_URL: ${{ secrets.UPDATE_BASE_URL }}
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      # É o secret que o `build-desktop.yml` lê no input `fingerprint` dos
      # três steps appleboy do job `publish` (ver o bloco de comentário dele).
      # Passar o nome errado aqui — o que era `HOSTINGER_KNOWN_HOSTS`, que não
      # verifica nada — deixa o `fingerprint` vazio no workflow chamado sem
      # erro visível: em `workflow_call` o secret do chamador é a interseção
      # das permissões, então o que não for declarado no bloco `secrets:` do
      # `build-desktop.yml` nem chega lá.
      HOSTINGER_SSH_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
      HOSTINGER_APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}

  deploy:
    # `tag-info` entra no `needs` e ganha um `if:` — as DUAS linhas
    # são o mínimo estrito para a mudança de gatilho: sem elas, uma
    # tag `app-v*.*.*` casaria no `on:` e este job continuaria
    # publicando o backend, que é exatamente o incidente que o
    # prefixo veio para fechar. O script SSH abaixo não foi tocado.
    needs: [test-backend, test-frontend, tag-info]
    if: needs.tag-info.outputs.deploy-should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sem downtime no VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          # `fingerprint` é o input que VERIFICA a host key — e o único que
          # esta action tem para isso. A linha que estava aqui passava o
          # secret `HOSTINGER_KNOWN_HOSTS` no input `known_hosts`, e isso
          # não fazia NADA: `known_hosts` não é um input do
          # appleboy/ssh-action@v1, a action o ignora e segue conectando sem
          # conferir a host key.
          #
          # O aviso é SILENCIOSO, que é o que torna isso pior do que openly
          # não passar: no run de produção 37244228557 (v1.21.0) a action
          # imprimiu "Unexpected input(s) 'known_hosts', valid inputs are
          # ['host', 'port', ..., 'fingerprint', ...]" e o job foi VERDE. O
          # deploy mandava a chave privada de produção para qualquer coisa que
          # se fizesse passar pelo Hostinger no meio da rede — e o log dizia
          # que estava protegido.
          #
          # O formato é o segundo campo do `ssh-keygen -lf`, o "SHA256:...":
          #   ssh-keyscan -p 22 SEU_HOST_OU_IP | ssh-keygen -lf -
          # Cuidado ao escolher a linha: o `ssh-keyscan` imprime UMA LINHA
          # POR TIPO de chave, e a action compara com a chave que o cliente SSH
          # dela (drone-ssh, em Go) REALMENTE negocia — cuja preferência é
          # ecdsa-sha2-nistp256 > ecdsa-384 > ecdsa-521 > rsa-sha2-256/512 >
          # ssh-rsa > ssh-ed25519. O valor é o da linha `ecdsa-sha2-nistp256`;
          # o ed25519 é a ÚLTIMA preferência, então o `-t ed25519`, que parece
          # o óbvio, dá mismatch. Se connectar estiver falhando, o erro é
          # "ssh: host key fingerprint mismatch", e ele acontece NO HANDSHAKE,
          # antes de qualquer comando rodar no servidor: errar o fingerprint
          # custa um run vermelho, não um deploy pela metade.
          #
          # POR QUE FALLBACK EM SECRET VAZIO, E NÃO VALOR FIXO AQUI
          # O fingerprint nasce do `ssh-keyscan` no host, não deste
          # repositório: cadastrá-lo é decisão de quem opera o deploy, e o
          # custo de errar é o deploy parar. Secret vazio = comportamento de
          # hoje (sem verificação), ou seja, sem regressão e sem deploy
          # quebrado. Com o secret criado, a verificação passa a valer sem
          # ninguém mexer neste arquivo de novo.
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          script: |
            set -Eeuo pipefail

            APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"
            # Interpolado no texto do script, e não lido do ambiente: o
            # ssh-action roda isto num shell remoto dentro do container e só
            # repassa as variáveis declaradas no input `envs`. GITHUB_REF_NAME
            # é contexto do Actions, não uma env var do shell — com `set -u`
            # o script morria em "GITHUB_REF_NAME: unbound variable" logo na
            # primeira linha útil, 6 segundos depois de começar. A APP_PATH
            # acima sempre funcionou por estar interpolada, o que é a
            # diferença entre as duas linhas.
            TAG="${{ github.ref_name }}"

            if [ -z "$TAG" ]; then
              echo "[deploy] TAG vazia: este workflow só faz sentido por push de tag v*.*.*"
              exit 1
            fi

            cd "$APP_PATH"

            echo "[deploy] Versão atual: $(git describe --tags --always 2>/dev/null || echo 'desconhecida')"
            echo "[deploy] Deploy da tag: $TAG"

            # Guarda o ponteiro de "qual instância está no ar" ANTES do
            # checkout. O `git checkout -f` abaixo reverte o arquivo para o
            # conteúdo do repo (sempre `backend`), e o switch lê esse
            # arquivo para saber de que lado está o tráfego: sem salvar,
            # ele promote a instância errada (e a imagem anterior se perde
            # como alvo de rollback).
            #
            # `|| true` nos dois cp: o arquivo só existe a partir do commit
            # 0fef83d (switch azul/verde). Num host que ainda está num
            # commit anterior — como este, em v1.0.1-61 — ele não existe,
            # e não há ponteiro a preservar: o switch.sh cria o estado na
            # primeira execução. Sem o `|| true` o `set -e` matava o deploy
            # em "cannot stat 'deploy/state/active-upstream'", depois de
            # já ter feito o trabalho caro.
            cp deploy/state/active-upstream /tmp/pdv-active-upstream.bak 2>/dev/null || true

            # Atualiza código para a tag
            echo "[deploy] Atualizando código para $TAG..."
            # `--force` nas tags: quando a tag já existe no host e o remoto
            # aponta para outro commit, o fetch REJEITA mover a tag
            # ("would clobber existing tag") e o `checkout` abaixo fica
            # num commit antigo — com cara de deploy novo e código velho. Foi
            # o que aconteceu ao reusar a v1.0.2 enquanto se corrigia o
            # pipeline. Aqui a tag remota é a fonte da verdade; forçar é o
            # comportamento certo, e `--tags` garante que ela venha mesmo
            # quando ninguém pediu o ref.
            git fetch --prune --tags --force origin
            git checkout -f "$TAG"
            # Se não havia ponteiro para preservar (host em commit antigo),
            # deixa o arquivo que o checkout trouxe — é o estado inicial
            # correto, e o switch.sh o ajusta na primeira execução.
            cp /tmp/pdv-active-upstream.bak deploy/state/active-upstream 2>/dev/null || true

            # Backup ANTES do switch, e DEPOIS do checkout — não antes. O
            # backup roda o script que está no host, e o host só recebe o
            # código da tag no checkout: com o backup antes dele, o script
            # usado era o da versão anterior, e qualquer correção feita na
            # tag não valia nada (foi assim que a correção do container do
            # Postgres não chegou ao deploy — o host rodou o backup.sh velho
            # e abortou de novo em "2 containers Postgres no host").
            #
            # O banco não muda no checkout (só código), então o snapshot é o
            # mesmo — e fica mais perto do momento em que as migrations vão
            # mexer nele, que é o que importa para rollback.
            echo "[deploy] Criando backup antes do deploy..."
            ./deploy/backup.sh /opt/backups

            # O switch faz tudo: build da imagem nova, sobe a instância
            # "-next" ao lado da atual, espera o healthcheck (o /health só
            # responde depois das migrations), aponta o Caddy por `reload`
            # e só então para a antiga. Se a instância nova não ficar
            # healthy, ele aborta ANTES do reload — o app antigo continua no
            # ar e o job falha, sem janela de erro.
            # `git checkout -f` e o bind mount de diretório: o container do
            # Caddy lê a Caddyfile nova no reload, sem precisar ser recriado
            # (o truque antigo de `--force-recreate caddy` custava ~2s de
            # proxy fora do ar).
            echo "[deploy] Switch (instância nova + reload do proxy)..."
            PDV_PROBE_URL="https://$(grep '^DOMAIN=' deploy/.env | cut -d= -f2)" \
              ./deploy/switch.sh

            echo "[deploy] Estado final:"
            ./deploy/switch.sh --status

            echo "[deploy] Deploy da tag $TAG concluído com sucesso."
            echo "[deploy] URL: https://$(grep '^DOMAIN=' deploy/.env | cut -d= -f2)"
            echo "[deploy] Se algo parecer errado no app: cd $APP_PATH && ./deploy/switch.sh --rollback"

