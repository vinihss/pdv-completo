name: Deploy on Tag

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'        # linha BACKEND (publica o deploy)
      - 'app-v*.*.*'   # linha APP (publica o instalador Windows)

jobs:

  test-backend:
    uses: ./.github/workflows/tests.yml

  test-frontend:
    uses: ./.github/workflows/tests.yml

  tag-validation:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Validar formato da tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|app-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag $TAG fora do formato esperado (vX.Y.Z ou app-vX.Y.Z)"
            exit 1
          fi
          echo "Tag $TAG OK"


  tag-info:
    runs-on: ubuntu-latest
    outputs:
      is-app-tag: ${{ steps.audit.outputs.is_app_tag }}
      is-backend-tag: ${{ steps.audit.outputs.is_backend_tag }}
      build-desktop-should-run: ${{ steps.audit.outputs.build_desktop_should_run }}
      deploy-should-run: ${{ steps.audit.outputs.deploy_should_run }}
      previous-tag: ${{ steps.audit.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 é OBRIGATÓRIO: o checkout padrão traz 1 commit e
          # NENHUMA tag, então `git describe --tags` não teria o que casar
          # e a auditoria rodaria sem comparação nenhuma.
          fetch-depth: 0

      - name: Classificar a tag e auditar o diff
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail

          TAG="${GITHUB_REF_NAME}"

          # A linha da tag. O `--match` abaixo usa a MESMA chave: é isto que
          # impede a auditoria de comparar uma tag de app contra uma tag de
          # backend (os globs são disjuntos — `v*.*.*` NÃO casa `app-v1.4.2`,
          # porque o padrão exige `v` no primeiro caractere).
          #
    

          # Tag anterior DA MESMA LINHA, e só entre ancestrais: `HEAD^` como
          # ponto de partida garante que o resultado descreve um commit que
          # está de fato na história deste tag. Isto importa porque `v1.0.16`
          # NÃO é ancestral de `main` — comparar contra ela diffaria duas
          # histórias divergentes e a resposta seria aleatória.
          PREV="$(git describe --tags --abbrev=0 --match "$MATCH" --exclude "$EXCLUDE" HEAD^ 2>/dev/null || true)"

          # ==========================================================
          # ESCOPO DO APP — o que de fato entra no artefato instalado.
          #
          # `frontend/**` é o item mais fácil de errar: o app embute o
          # web. Os `standalone-*/tauri.conf.json` têm
          #   beforeBuildCommand: cd ../frontend && npm run build:pdv|kds
          #   frontendDist:       ../frontend/dist/pdv|kds
          # então QUALQUER mudança em `frontend/` entra no .exe. O backend
          # não vai para o binário, mas o build do app sempre recompila o
          # frontend — é por isso que `frontend/` conta como escopo do app
          # e não como escopo do backend.
          #
          # `standalone-pdv/**` e `standalone-kds/**` cobrem de uma vez
          # `tauri.conf.json`, `capabilities/**`, `icons/**` e os `*.rs`
          # dos dois crates.
          #
          # `Cargo.toml`/`Cargo.lock` contam porque a versão publicada do
          # instalador é resolvida de lá: trocar uma `tauri-plugin-*`
          # muda o binário. `printer/**` é o daemon; `scripts/build/build-standalone.sh`
          # é o build local equivalente; `build-desktop.yml` é a definição
          # canônica do próprio instalador, e mudá-lo é motivo para
          # revalidar o artefato.
          #
          # NÃO entram: `.githooks/**` e `scripts/dev/dev-worktree.sh` — são
          # ferramentas de desenvolvimento, não componentes do artefato.
          # ==========================================================
          APP_SCOPE_RE='^(?:frontend/|printer/|scripts/build/)|^(?:Cargo\.toml|Cargo\.lock|\.github/workflows/build-desktop\.yml)$'

          APP_CHANGED=false
          TOTAL_CHANGED=0
          ERRO=""
          AVISO=""

          if [[ -n "$PREV" ]]; then
            DIFF="$(git diff --name-only "$PREV..$TAG")"
            TOTAL_CHANGED="$(printf '%s\n' "$DIFF" | wc -l)"
            RELEVANTES="$(printf '%s\n' "$DIFF" | grep -E "$APP_SCOPE_RE" || true)"
            if [[ -n "$RELEVANTES" ]]; then
              APP_CHANGED=true
            fi

            # Frontend numa tag de backend NÃO é erro: o deploy backend também
            # publica o web. `switch.sh` roda `docker compose build backend
            # frontend` e o switch promove `PDV_FRONTEND_UPSTREAM` junto com
            # `PDV_BACKEND_UPSTREAM` (switch.sh:186-187) — o container `frontend`
            # é o nginx que serve o app em produção. Mudar `frontend/` é o
            # caminho normal de toda release, e tratá-lo como "tag errada"
            # travava a linha backend desde a v1.0.15, quando a última tag de
            # backend foi publicada.
            #
          fi

          # O portão. Só o prefixo decide o que é publicado.
          BUILD_DESKTOP=false
          DEPLOY=false
          if [[ "$IS_APP" == true ]]; then
            BUILD_DESKTOP=true
            DEPLOY=false
          else
            BUILD_DESKTOP=false
            DEPLOY=true
          fi

          {
            echo "is_app_tag=$IS_APP"
            echo "is_backend_tag=$IS_BACKEND"
            echo "build_desktop_should_run=$BUILD_DESKTOP"
            echo "deploy_should_run=$DEPLOY"
            echo "previous_tag=$PREV"
          } >> "$GITHUB_OUTPUT"

          echo "::group::decisao por prefixo"
          echo "  tag            : $TAG"
          echo "  linha          : $([[ $IS_APP == true ]] && echo 'APP (instalador Windows)' || echo 'BACKEND (deploy)')"
          echo "  tag anterior   : ${PREV:-(nenhuma)}"
          if [[ -n "$PREV" ]]; then
            echo "  arquivos no diff: $TOTAL_CHANGED (escopo do app: $APP_CHANGED)"
          fi
          echo "  build-desktop  : $BUILD_DESKTOP"
          echo "  deploy backend : $DEPLOY"
          echo "::endgroup::"

          if [[ -n "$ERRO" ]]; then
            echo "::error::$ERRO"
            exit 1
          fi
          if [[ -n "$AVISO" ]]; then
            echo "::warning::$AVISO"
          fi

  deploy:

    needs: [test-backend, test-frontend, tag-info]
    if: needs.tag-info.outputs.deploy-should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sem downtime no VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}

          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          script: |
            set -Eeuo pipefail

            APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"
            # Interpolado no texto do script, e não lido do ambiente: o
            # ssh-action roda isto num shell remoto dentro do container e só
            # repassa as variáveis declaradas no input `envs`. GITHUB_REF_NAME
            # é contexto do Actions, não uma env var do shell — com `set -u`
            # o script morria em "GITHUB_REF_NAME: unbound variable" logo na
            # primeira linha útil, 6 segundos depois de começar. A APP_PATH
            # acima sempre funcionou por estar interpolada, o que é a
            # diferença entre as duas linhas.
            TAG="${{ github.ref_name }}"

            if [ -z "$TAG" ]; then
              echo "[deploy] TAG vazia: este workflow só faz sentido por push de tag v*.*.*"
              exit 1
            fi

            cd "$APP_PATH"

            echo "[deploy] Versão atual: $(git describe --tags --always 2>/dev/null || echo 'desconhecida')"
            echo "[deploy] Deploy da tag: $TAG"

            # Guarda o ponteiro de "qual instância está no ar" ANTES do
            # checkout. O `git checkout -f` abaixo reverte o arquivo para o
            # conteúdo do repo (sempre `backend`), e o switch lê esse
            # arquivo para saber de que lado está o tráfego: sem salvar,
            # ele promote a instância errada (e a imagem anterior se perde
            # como alvo de rollback).
            #
            # `|| true` nos dois cp: o arquivo só existe a partir do commit
            # 0fef83d (switch azul/verde). Num host que ainda está num
            # commit anterior — como este, em v1.0.1-61 — ele não existe,
            # e não há ponteiro a preservar: o switch.sh cria o estado na
            # primeira execução. Sem o `|| true` o `set -e` matava o deploy
            # em "cannot stat 'deploy/state/active-upstream'", depois de
            # já ter feito o trabalho caro.
            cp deploy/state/active-upstream /tmp/pdv-active-upstream.bak 2>/dev/null || true

            # Atualiza código para a tag
            echo "[deploy] Atualizando código para $TAG..."
            # `--force` nas tags: quando a tag já existe no host e o remoto
            # aponta para outro commit, o fetch REJEITA mover a tag
            # ("would clobber existing tag") e o `checkout` abaixo fica
            # num commit antigo — com cara de deploy novo e código velho. Foi
            # o que aconteceu ao reusar a v1.0.2 enquanto se corrigia o
            # pipeline. Aqui a tag remota é a fonte da verdade; forçar é o
            # comportamento certo, e `--tags` garante que ela venha mesmo
            # quando ninguém pediu o ref.
            git fetch --prune --tags --force origin
            git checkout -f "$TAG"
            # Se não havia ponteiro para preservar (host em commit antigo),
            # deixa o arquivo que o checkout trouxe — é o estado inicial
            # correto, e o switch.sh o ajusta na primeira execução.
            cp /tmp/pdv-active-upstream.bak deploy/state/active-upstream 2>/dev/null || true

            # Backup ANTES do switch, e DEPOIS do checkout — não antes. O
            # backup roda o script que está no host, e o host só recebe o
            # código da tag no checkout: com o backup antes dele, o script
            # usado era o da versão anterior, e qualquer correção feita na
            # tag não valia nada (foi assim que a correção do container do
            # Postgres não chegou ao deploy — o host rodou o backup.sh velho
            # e abortou de novo em "2 containers Postgres no host").
            #
            # O banco não muda no checkout (só código), então o snapshot é o
            # mesmo — e fica mais perto do momento em que as migrations vão
            # mexer nele, que é o que importa para rollback.
            echo "[deploy] Criando backup antes do deploy..."
            ./deploy/backup.sh /opt/backups

            # O switch faz tudo: build da imagem nova, sobe a instância
            # "-next" ao lado da atual, espera o healthcheck (o /health só
            # responde depois das migrations), aponta o Caddy por `reload`
            # e só então para a antiga. Se a instância nova não ficar
            # healthy, ele aborta ANTES do reload — o app antigo continua no
            # ar e o job falha, sem janela de erro.
            # `git checkout -f` e o bind mount de diretório: o container do
            # Caddy lê a Caddyfile nova no reload, sem precisar ser recriado
            # (o truque antigo de `--force-recreate caddy` custava ~2s de
            # proxy fora do ar).
            echo "[deploy] Switch (instância nova + reload do proxy)..."
            PDV_PROBE_URL="https://$(grep '^DOMAIN=' deploy/.env | cut -d= -f2)" \
              ./deploy/switch.sh

            echo "[deploy] Estado final:"
            ./deploy/switch.sh --status

            echo "[deploy] Deploy da tag $TAG concluído com sucesso."
            echo "[deploy] URL: https://$(grep '^DOMAIN=' deploy/.env | cut -d= -f2)"
            echo "[deploy] Se algo parecer errado no app: cd $APP_PATH && ./deploy/switch.sh --rollback"

