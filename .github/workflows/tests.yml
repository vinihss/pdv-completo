name: Testes (backend + frontend)

# ============================================================
# O PORTÃO DE TESTES do repo, em UM SÓ LUGAR.
#
# Duas portas de entrada, uma só definição de suíte:
#
#   1. `ci-pr.yml` — a cada pull_request contra `main`: é o gate de merge.
#   2. `deploy-on-tag.yml` — a cada tag `v*.*.*`, antes do `deploy` (e antes
#      do `build-desktop`, que tem as próprias verificações).
#
# Por que não são dois arquivos com os corpos duplicados: a CI de PR e o
# gate de release são o MESMO contrato ("isto não pode ir para main"). Se
# fossem cópias, a primeira vez que alguém acrescentasse um passo ao gate
# de release — um `npm audit`, um typecheck — a cópia da CI de PR
# continuaria verde e o merge passaria a aceitar o que o deploy rejeita.
# Divergência silenciosa entre os dois gates é pior do que nenhum gate.
#
# Isto segue o mesmo padrão do `build-desktop.yml` (reusable workflow com
# `uses:`), que já é a convenção da casa. Regra do repo (AGENTS.md):
# uma única definição de build — se um passo de teste mudar, muda AQUI.
#
# Os jobs se chamam `test-backend`/`test-frontend` e o caller mantém essas
# MESMAS chaves, porque o `needs: [test-backend, test-frontend]` do job
# `deploy` resolve pelo nome do job no caller, não pelo do workflow chamado.
# Renomear um dos lados sem renomear o outro quebra o deploy no push da
# próxima tag.
#
# O mesmo vale para `test-ws-gateway`: o check aparece como
# `tests / test-ws-gateway` no PR (o job chamador se chama `tests`), e é esse
# nome que um ruleset por check precisaria. Não há ruleset exigindo os checks
# de teste por nome hoje — se um dia houver, o nome novo entra na regra junto
# com os outros dois.
# ============================================================

on:
  workflow_call:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    # Os testes do backend rodam contra um Postgres DEDICADO (pdv_test), não
    # contra o banco da aplicação: o global setup (backend/test/global-setup.ts)
    # derruba e recria o schema `public` antes de cada suíte, o que num banco
    # real apagaria os dados. Sem este serviço o job morria com ECONNREFUSED e
    # o vitest ainda imprimia "No test files found", que engana: o glob está
    # certo, quem falha é o setup.
    services:
      postgres:
        image: postgres:16
        env:
          # Mesmas credenciais do default em backend/test/test-db.ts, para o
          # banco efêmero do CI e o Postgres local de desenvolvimento não
          # divergirem.
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv_test_pw
          POSTGRES_DB: pdv_test
        ports:
          - 55432:5432
        # Sem healthcheck o vitest começa antes do Postgres aceitar conexão e
        # o job falha de forma intermitente, dependendo da carga do runner.
        options: >-
          --health-cmd "pg_isready -U pdv -d pdv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Aponta para o serviço acima. O global setup usa esta variável para
      # recriar o schema e o config do vitest a repassa como DATABASE_URL.
      TEST_DATABASE_URL: postgres://pdv:pdv_test_pw@localhost:55432/pdv_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          npm run build
          npm run test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test

  # O gateway WebSocket em Go (ws-gateway/). Módulo Go independente, com as
  # próprias dependências — não entra no `npm ci` do backend nem no do frontend,
  # então sem este job o único portão de qualidade do gateway era o `go build` da
  # imagem Docker em produção.
  #
  # `gofmt -l` é o passo incomodo e é o motivo de o job existir: ele imprime o
  # nome dos arquivos fora de formato e SAI 0 sempre (é um linter de listagem, não
  # um verificador). Sem o `test -z` logo abaixo, um arquivo mal formatado
  # passaria verde para sempre — e o resto do repo tem lint no portão
  # (`npm run lint` no frontend), então a exceção aqui seria uma porta aberta.
  test-ws-gateway:
    runs-on: ubuntu-latest
    # O dispatcher (`internal/outbox`) tem duas camadas de teste: o GATE e o
    # `Run` não precisam de banco nenhum, mas o CICLO (`PollOnce`) precisa de
    # um Postgres de verdade — o que está em jogo é a coluna `published`, e um
    # mock não prova nada sobre advisory lock, transação e `UPDATE`. São cinco
    # testes que pulam (`t.Skip` no helper `testDB`) sem
    # `WS_GATEWAY_TEST_DATABASE_URL`, e um deles é a proteção da regressão mais
    # grave do gateway: com o gate `WS_DISPATCH` desligado, a linha plantada
    # tem que continuar `published = false`. Se o guard de `PollOnce` sumir, o
    # gateway volta a descartar em silêncio o evento de quem está conectado em
    # outro servidor. E `t.Skip` é justamente o modo de falha que esconde isso:
    # o job fica verde e a proteção desaparece do portão de merge.
    #
    # Daí as duas decisões abaixo: o serviço de Postgres, sem o qual a suíte
    # roda pela metade; e o passo "nenhum teste pulado" depois do `go test`,
    # que é a parte que importa mais que subir o banco.
    services:
      postgres:
        image: postgres:16
        env:
          # Mesmas credenciais do job `test-backend` e do default em
          # backend/test/test-db.ts: o banco efêmero do CI e o Postgres local de
          # desenvolvimento não podem divergir. Copiado do `test-backend` de
          # propósito — um terceiro conjunto de credenciais aqui passaria
          # despercebido até alguém apontar a suíte para o banco errado.
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv_test_pw
          POSTGRES_DB: pdv_test
        ports:
          - 55432:5432
        # Sem healthcheck o `go test` começa antes do Postgres aceitar conexão e
        # o job falha de forma intermitente, dependendo da carga do runner.
        # Mesmos intervalos do `test-backend`: o contêiner sobe em paralelo com
        # o checkout e o `setup-go`, então o healthcheck quase nunca é o gargalo
        # — ele só impede que a suíte comece com o banco ainda subindo.
        options: >-
          --health-cmd "pg_isready -U pdv -d pdv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Nome diferente do `TEST_DATABASE_URL` do job `test-backend` de propósito:
      # o gateway não usa o global-setup do vitest, e a suíte Go lê a variável
      # pelo nome dela. Nada a renomear.
      #
      # `sslmode=disable` não é decoração: é o que faz os cinco testes rodarem.
      # O driver do gateway é o lib/pq (`internal/db`), que assume
      # `sslmode=require` quando a DSN não diz nada, e a imagem `postgres:16` do
      # serviço não tem SSL — sem este parâmetro eles pulam com "pq: SSL is not
      # enabled on the server" e o job passa verde sem executar nada. A DSN do
      # `test-backend` dispensa o parâmetro porque o driver do Node (`pg`)
      # negocia para texto puro; host, porta, usuário, senha e banco são os
      # mesmos nos dois jobs.
      WS_GATEWAY_TEST_DATABASE_URL: postgres://pdv:pdv_test_pw@localhost:55432/pdv_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Mesma versão declarada no go.mod do gateway. `go-version` com
          # `check-latest` desligado (default) instala exatamente esta versão, e
          # o `cache: true` usa o go.sum como chave do cache do module/build
          # cache — o equivalente ao `cache-dependency-path` do npm nos jobs
          # acima. Se o go.mod subir, este número sobe junto (o próprio build
          # falha com "go.mod requires go >= X" se ficarem divergentes).
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: ws-gateway/go.sum
      - working-directory: ws-gateway
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::rode gofmt -w ."; exit 1; }
      # `-v` e o `tee` não são vaidade: `--- SKIP:` é o que o passo
      # seguinte lê. O `set -o pipefail` é o que impede o `tee` de engolir o
      # status do `go test` — sem ele, um teste vermelho passaria o passo
      # (o shell padrão do Actions é `bash -e`, sem pipefail) e o job inteiro
      # perderia o sinal de falha do `go test`.
      #
      # `-race` é o detector de corrida do runtime, e ele está aqui por causa
      # de uma classe de defeito que a suíte sem ele não pega: o hub de
      # conexões (`internal/connmanager`) fecha `c.send` enquanto o `send`
      # ainda escreve no mesmo canal. Sem `-race` isso reprova por
      # `panic: send on closed channel` — que é o SINTOMA, e depende de
      # escalonamento de goroutines: na máquina de desenvolvimento o mesmo
      # código reprovou em 20 de 20 execuções, mas no runner do CI só em
      # 11 de 20 no mesmo teste, porque o sintoma é uma corrida. Com `-race` o
      # mesmo código reprova em 20 de 20, e o relatório nomeia a CAUSA: as duas
      # goroutines, os dois acessos e as linhas do `close` e do `send`. A
      # diferença não é só taxa de reprovação — é um vermelho que aponta o
      # defeito contra um vermelho que aponta o estrago, e o primeiro é o que
      # sobrevive a um teste novo ou a um CI mais rápido que o seu.
      #
      # O `-race` não muda o formato que o passo de baixo lê: `--- PASS:` e
      # `--- SKIP:` saem iguais, a ordem dos pacotes é a mesma e a contagem de
      # pulos continua em zero contra o Postgres do serviço (medido nos dois
      # ramos do `t.Skip`: env ausente e banco que não responde). Por isso o
      # gate de skip abaixo não precisou de nenhum ajuste.
      #
      # O custo é pequeno neste módulo e cabe em uma frase: em 4 vCPUs a suíte
      # vai de ~3,7s para ~5,4s. A primeira execução depois deste commit paga
      # ~+35s de compilação a mais, porque `-race` gera um build instrumentado
      # SEPARADO e o passo `go build`/`go vet` acima só aquece o cache sem
      # detector; da segunda em diante o cache do `setup-go` (que inclui o
      # GOCACHE) já resolve. Requisito de ambiente: `-race` depende de cgo, e
      # por isso de um compilador C — o `gcc` das imagens `ubuntu-latest` do
      # GitHub está lá. Sem ele o passo morre com erro críptico
      # ("-race requires cgo"), que é o jeito que essa dependência se
      # denuncia.
      - name: suíte (com o Postgres do serviço)
        working-directory: ws-gateway
        run: |
          set -o pipefail
          go test -v -count=1 -race ./... 2>&1 | tee "$RUNNER_TEMP/ws-gateway-test.log"
      # `go test` sai 0 com `t.Skip`: o verde deste job não distingue "testou"
      # de "pulou", e é essa distinção que segura a regressão do gate desligado.
      # Vale para o módulo inteiro, não só para os cinco testes de `PollOnce`:
      # hoje as únicas chamadas de `t.Skip` do gateway são as duas do helper
      # `testDB` — env ausente OU Postgres que não responde, e as duas precisam
      # virar vermelho aqui. Um `t.Skip` legítimo que apareça um dia aparece como
      # falha neste passo, com nome e motivo, em vez de sumir num verde.
      - name: nenhum teste pulado
        run: |
          log="$RUNNER_TEMP/ws-gateway-test.log"

          # Log ausente ou vazio NÃO é "nenhum pulo": é o passo anterior não ter
          # rodado. Sem esta guarda o `grep` abaixo não casaria nada e o job
          # passaria verde sem ter conferido nada — o silêncio que este passo
          # existe para impedir.
          if [ ! -s "$log" ]; then
            echo "::error::log da suíte ausente ou vazio ($log): o passo de go test não produziu saída"
            exit 1
          fi

          # `--- SKIP:` é o formato do `go test -v` (indentado nos subtestes) e
          # `-B2` traz o motivo do pulo: a linha de log do `t.Skip` fica logo
          # acima, e é ela que diz se faltou a env ou se o banco não respondeu.
          #
          # Antes do skip, o espelho do mesmo receio: se o `go test` mudar essa
          # linha um dia, o `grep` de baixo deixa de casar e este passo volta a
          # ser o verde silencioso que veio para acabar. Um `--- PASS:` no log é
          # a prova de que o formato é o esperado — e ele existe porque há
          # pacotes com testes que passam (só `internal/db` é `[no test files]`).
          if ! grep -qE '^[[:space:]]*--- PASS: ' "$log"; then
            echo "::error::nenhuma linha '--- PASS:' no log da suíte: o gate de skip pode ter parado de casar (formato de saída do go test mudou?)"
            exit 1
          fi

          if grep -nE -B2 '^[[:space:]]*--- SKIP: ' "$log"; then
            echo "::error::teste(s) pulado(s) no ws-gateway: a suíte do outbox não rodou contra o Postgres. Se WS_GATEWAY_TEST_DATABASE_URL sumiu do env do job, ou aponta para um Postgres que não responde, o gateway fica sem a única proteção contra o despacho com o gate desligado"
            exit 1
          fi

          echo "nenhum teste pulado: os cinco testes de PollOnce rodaram contra o Postgres do serviço"

  # TODO: refazer os testes do printer/daemon (go test ./...) — removidos
  # temporariamente para destravar o build. Ver printer/README.md.
  # Quando voltarem, é AQUI que entra o job (não no caller): os dois
  # chamadores o ganham de graça, e nenhum gate diverge do outro.
