name: Testes (backend + frontend)

# ============================================================
# O PORTÃO DE TESTES do repo, em UM SÓ LUGAR.
#
# Duas portas de entrada, uma só definição de suíte:
#
#   1. `ci-pr.yml` — a cada pull_request contra `main`: é o gate de merge.
#   2. `deploy-on-tag.yml` — a cada tag `v*.*.*` (backend) e `app-v*.*.*`
#      (app), antes do `deploy` (e antes
#      do `build-desktop`, que tem as próprias verificações).
#
# Por que não são dois arquivos com os corpos duplicados: a CI de PR e o
# gate de release são o MESMO contrato ("isto não pode ir para main"). Se
# fossem cópias, a primeira vez que alguém acrescentasse um passo ao gate
# de release — um `npm audit`, um typecheck — a cópia da CI de PR
# continuaria verde e o merge passaria a aceitar o que o deploy rejeita.
# Divergência silenciosa entre os dois gates é pior do que nenhum gate.
#
# Isto segue o mesmo padrão do `build-desktop.yml` (reusable workflow com
# `uses:`), que já é a convenção da casa. Regra do repo (AGENTS.md):
# uma única definição de build — se um passo de teste mudar, muda AQUI.
#
# Os jobs se chamam `test-backend`/`test-frontend` e o caller mantém essas
# MESMAS chaves, porque o `needs: [test-backend, test-frontend]` do job
# `deploy` resolve pelo nome do job no caller, não pelo do workflow chamado.
# Renomear um dos lados sem renomear o outro quebra o deploy no push da
# próxima tag.
#
# O mesmo vale para os jobs de serviço e para o app público: `test-ws-gateway`
# aparece como `tests / test-ws-gateway` no PR (o job chamador se chama
# `tests`), `test-pagarme-webhook` como `tests / test-pagarme-webhook`,
# `test-printer-daemon` como `tests / test-printer-daemon` e
# `test-pedido-public` como `tests / test-pedido-public` — é esse nome que um
# ruleset por check precisaria. Não há ruleset exigindo os checks de teste por
# nome hoje — se um dia houver, os nomes novos entram na regra junto com os
# outros.
#
# E o número de jobs NÃO é um número fixo: acrescentar um aqui cria o check
# sozinho nos DOIS chamadores, sem tocar em nenhum deles (é o que o `ci-pr.yml`
# registra como consequência). A lista de suítes mora neste arquivo — que é
# justamente o ponto do reusable workflow. O erro a evitar continua sendo
# "descompartilhar em N chamadores achando que se economiza runner": o
# `workflow_call` roda o workflow chamado INTEIRO, cada vez.
# ============================================================
# O CUSTO REAL DA SUÍTE RODAR DUAS VEZES NA TAG (documentado, NÃO corrigido)
# ============================================================
# O `ci-pr.yml` tem UM chamador (`tests`) — bom, é o que a PR vê. O
# `deploy-on-tag.yml` tem DOIS (`test-backend` e `test-frontend`), e cada
# chamada roda os SETE jobs deste arquivo. Ou seja: a suíte inteira roda 2x a
# cada push de tag.
#
# MEDIDO no run 37409580179 (tag v1.29.0), agrupando os jobs pelo chamador:
#
#   cópia 1 (chamado `test-backend`):  478s em 7 jobs
#   cópia 2 (chamado `test-frontend`): 496s em 7 jobs
#
# 974 runner-segundos para provar o MESMO contrato duas vezes, ou ~8 minutos de
# runner jogados fora por tag — sobre um run de 1183s no total. Nenhum check a
# mais no gate: os dois conjuntos são idênticos, e o `tag-validation` e o
# `deploy` só precisam que os dois chamadores terminem.
#
# POR QUE NÃO FOI CORRIGIDO AQUI (e o que seria preciso): as chaves
# `test-backend`/`test-frontend` do `deploy-on-tag.yml` NÃO são "uma suíte
# cada" — são apelidos que o `needs: [test-backend, test-frontend]` do job
# `deploy` resolve pelo nome do job NO CALLER (é a razão de o bloco do topo
# deste arquivo existir). Apagar UMA das duas chaves funciona e economiza
# ~8 min de runner por tag; mexer nas duas (por exemplo, para `tests` e
# `tests-2`) quebra o `needs:` do `deploy` no próximo push de tag, que é o
# caminho de produção. É um trabalho com medição própria no
# `deploy-on-tag.yml`, não um efeito colateral de mexer no healthcheck — e
# aquele arquivo está fora do escopo deste commit.
# ============================================================
# POR QUE ESTE ARQUIVO NÃO DECLARA `concurrency`
# ============================================================
# O `concurrency` dos gatilhos fica no CHAMADOR (`ci-pr.yml`), e é lá que deve
# ficar. Dois motivos, ambos com a documentação do GitHub como fonte:
#
# 1. NUMA SEGUNDA CHAMADA, DUAS CHAMADAS CAEM NO MESMO GRUPO. O
#    `github.workflow` de um workflow CHAMADO é o nome do workflow CHAMADOR
#    (documentação do GitHub, seção "Reusing workflow configurations"), então
#    qualquer grupo montado com `${{ github.workflow }}` aqui seria idêntico
#    nas duas chamadas do `deploy-on-tag.yml` — e a segunda cancelaria a
#    primeira. Isto é, declarar `concurrency` aqui com `cancel-in-progress`
#    mataria metade da suíte de release.
# 2. GRUPO IGUAL NO CHAMADOR E NO CHAMADO É DOCUMENTADAMENTE UM DEADLOCK. A
#    mesma documentação avisa: usar o mesmo valor de `concurrency.group` nos
#    dois lados cancela o workflow chamador no meio do caminho.
#
# A regra que fica: `concurrency` pertence ao workflow de NÍVEL SUPERIOR (que
# é quem tem `pull_request` e número de PR); este arquivo é a suíte, e a suíte
# não sabe de qual PR ela é parte.
# ============================================================

on:
  workflow_call:

jobs:
  # ============================================================
  # O JOB `changes`: FILTRO DE PATHS, PARA NÃO PAGAR 7 JOBS POR PR DE 1 PASTA
  # ============================================================
  # Antes deste job, um PR que tocava só `ws-gateway/**` pagava a suíte
  # INTEIRA: backend (com Postgres), frontend (lint+build+test), app público,
  # os dois serviços Go e o printer — medido ~8min de runner por execução
  # (run 37409580179: 478s só na cópia do chamador `test-backend`). O que
  # interessa ao gate é "a área que mudou continua verde"; as outras áreas
  # não foram tocadas e o resultado delas não mudou desde o último run.
  #
  # COMO FUNCIONA: `dorny/paths-filter` compara o diff do PR (base...head) e
  # liga um output por área; o passo `resultado por evento` repassa (em PR)
  # ou liga tudo (fora de PR); e cada job de suíte tem
  # `if: !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.<area> == 'true')`
  # — três cláusulas, na ordem: (1) FAIL-OPEN: `changes` vermelho ⇒ roda
  # tudo, nunca skip silencioso; (2) fora de PR ⇒ roda tudo; (3) em PR ⇒
  # roda se o filtro ligou a área.
  #
  # POR QUE O FALLBACK É "RODA TUDO", E NÃO "PULA TUDO":
  #
  # 1. FORA DE pull_request, TUDO RODA. Este workflow é chamado também pelo
  #    `deploy-on-tag.yml` (evento `push` de tag) — e antes de ir para
  #    produção o contrato é a suíte INTEIRA, não o delta. É por isso que
  #    este job `changes` NÃO tem `if:` de evento (ver "ARMADILHA" abaixo):
  #    fora de PR ele roda o passo `todas-as-areas`, que liga os seis
  #    outputs como `true`, e todo job de suíte entra. (O paths-filter até
  #    aceita evento de push comparando com o commit anterior, mas em push
  #    de TAG o `before` é 0000... e o comportamento deixa de ser "o diff do
  #    PR" — não é o que queremos no caminho de release.)
  #
  #    ARMADILHA — A VERSÃO ANTES DESTE COMMIT PULAVA OS TESTES NA TAG:
  #    este job tinha `if: github.event_name == 'pull_request'` e, em tag,
  #    ele era pulado. E o GitHub Actions pula TRABALHOS QUE `needs:` UM JOB
  #    PULADO — o `if:` próprio do dependente (que avaliava verdadeiro,
  #    porque `event_name != 'pull_request'`) NÃO o resgata: a semântica de
  #    `needs:` é que a dependência pulada = dependente pulado, a menos que
  #    o dependente use `always()`/`!cancelled()`. Medido no run 37520858498
  #    (deploy da v1.32.0, 06/10): `test-backend / test-backend` e
  #    `test-frontend / test-frontend` saíram SKIPPED e o `deploy` foi pra
  #    produção com NENHUMA suíte de teste — só o `shellcheck` (que não tem
  #    `needs:`) executou. Gate verde e vazio, a pior categoria. A regra que
  #    este comentário deixa registrada: um job com `if:` condicional que o
  #    skipa NÃO pode ficar à frente de `needs:` em nenhum dos caminhos do
  #    workflow — ou o próprio job roda sempre e o condicionamento acontece
  #    DENTRO dele (nos steps), como abaixo.
  # 2. ARQUIVO FORA DE ÁREA MAPEADA FAZ TUDO RODAR. Cada filtro inclui
  #    `.github/**` (mudar um workflow é mexer no próprio gate) e os
  #    lockfiles/manifests da RAIZ (`package.json`, `package-lock.json` —
  #    a CLI do Tauri mora na raiz, ver AGENTS.md). Um arquivo que nenhum
  #    filtro conhece (ex.: `docs/**`, `AGENTS.md`) não liga nenhum job de
  #    suíte — e está certo: markdown não muda código.
  #
  # EFEITO NOS NOMES DOS CHECKS: um job pulado pelo `if:` aparece no PR como
  # `tests / test-<area>` com status SKIPPED, e skipped CONTA COMO SUCESSO
  # para required checks e auto-merge — o gate não quebra, e a lista de
  # checks continua mostrando todos os nomes (só muda o ícone). Se um dia
  # houver ruleset por nome de check, o nome continua o mesmo.
  # Esse "skipped = sucesso" é exatamente por que o FAIL-OPEN acima existe:
  # como skipped não bloqueia merge, um `changes` que falhasse deixaria o
  # gate passar vazio (medido nas PRs #122/#123, que mergearam com
  # `changes: FAILURE` e todas as suítes skipped — a permissão que faltava
  # está no `ci-pr.yml`).
  #
  # O QUE ISTO NÃO FAZ: não descompartilha o `tests.yml` em vários chamadores
  # (a armadilha documentada no `ci-pr.yml` — cada chamador roda o workflow
  # chamado INTEIRO). O filtro é DENTRO da suíte, um chamador continua sendo
  # um chamador.
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    # SEM `if:` de evento aqui — de propósito (ver "ARMADILHA" no bloco
    # acima): este job fica à frente de todos os de suíte via `needs:`, e um
    # `if:` que o pulasse em tag pularia TODOS eles, deixando o gate de
    # deploy verde sem rodar teste nenhum. O condicionamento mora nos steps.
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
      pedido-public: ${{ steps.result.outputs.pedido-public }}
      ws-gateway: ${{ steps.result.outputs.ws-gateway }}
      pagarme-webhook: ${{ steps.result.outputs.pagarme-webhook }}
      printer: ${{ steps.result.outputs.printer }}
    steps:
      # Sem checkout: o paths-filter usa a API do GitHub para listar os
      # arquivos do PR (não precisa da árvore em disco).
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'frontend/**'
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
            # O app público importa `frontend/src` pelo alias `@/`
            # (apps/pedido-public/vite.config.ts) e o Vite resolve as deps
            # bare do código compartilhado a partir do diretório do
            # importador — por isso `frontend/src/**` e o lockfile do
            # frontend ligam este job também, não só `apps/pedido-public/**`.
            pedido-public:
              - 'apps/pedido-public/**'
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
            ws-gateway:
              - 'ws-gateway/**'
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
            pagarme-webhook:
              - 'pagarme-webhook/**'
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'
            printer:
              - 'printer/**'
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'

      # Passo normalizador: é ele que define os outputs reais do job.
      #   - Em PR: repassa o que o `filter` acima calculou (uma área só
      #     liga o output dela).
      #   - Fora de PR (tag/deploy): liga OS SEIS como `true` — a suíte
      #     inteira é o contrato antes de produção, e este passo é o que
      #     materializa o fallback "roda tudo" descrito no bloco acima.
      # A razão de existir um passo próprio (em vez de os outputs apontarem
      # direto para `steps.filter`): fora de PR o `filter` nem roda (tem
      # `if:` de evento), e os outputs ficariam VAZIOS — com outputs vazios,
      # o `needs.changes.outputs.<area> == 'true'` de cada suíte seria
      # falso e, em tese, pularia tudo. Com este passo, o valor nunca é
      # vazio em nenhum dos dois eventos.
      - name: resultado por evento
        id: result
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_FRONTEND: ${{ steps.filter.outputs.frontend }}
          FILTER_PEDIDO: ${{ steps.filter.outputs.pedido-public }}
          FILTER_WS: ${{ steps.filter.outputs.ws-gateway }}
          FILTER_PAGARME: ${{ steps.filter.outputs.pagarme-webhook }}
          FILTER_PRINTER: ${{ steps.filter.outputs.printer }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            {
              echo "backend=$FILTER_BACKEND"
              echo "frontend=$FILTER_FRONTEND"
              echo "pedido-public=$FILTER_PEDIDO"
              echo "ws-gateway=$FILTER_WS"
              echo "pagarme-webhook=$FILTER_PAGARME"
              echo "printer=$FILTER_PRINTER"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "backend=true"
              echo "frontend=true"
              echo "pedido-public=true"
              echo "ws-gateway=true"
              echo "pagarme-webhook=true"
              echo "printer=true"
            } >> "$GITHUB_OUTPUT"
          fi

  test-backend:
    needs: changes
    # Roda se: (a) não é PR (tag/deploy → suíte inteira, materializada pelo
    # passo `resultado por evento` do `changes`), ou (b) o PR tocou a área.
    # O `changes` NUNCA é pulado (ver "ARMADILHA" no bloco dele), então este
    # `needs:` nunca recebe um job pulado — que é o cenário em que o GitHub
    # pularia ESTE job independentemente do `if` abaixo.
    # FAIL-OPEN em `needs.changes.result != 'success'`: se o próprio `changes`
    # falhar (ex.: API de PR inacessível), os outputs chegam vazios e o
    # condicionamento por área pularia tudo — gate verde e vazio, o defeito
    # que este bloco existe para impedir. Com a cláusula, um `changes`
    # vermelho faz as suítes RODAREM (pior caso = testar de mais, nunca de
    # menos). `!cancelled()` em vez de `always()` para não reanimar jobs de
    # um run cancelado.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # Os testes do backend rodam contra um Postgres DEDICADO (pdv_test), não
    # contra o banco da aplicação: o global setup (backend/test/global-setup.ts)
    # derruba e recria o schema `public` antes de cada suíte, o que num banco
    # real apagaria os dados. Sem este serviço o job morria com ECONNREFUSED e
    # o vitest ainda imprimia "No test files found", que engana: o glob está
    # certo, quem falha é o setup.
    services:
      postgres:
        image: postgres:16
        env:
          # Mesmas credenciais do default em backend/test/test-db.ts, para o
          # banco efêmero do CI e o Postgres local de desenvolvimento não
          # divergirem.
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv_test_pw
          POSTGRES_DB: pdv_test
        ports:
          - 55432:5432
        # Sem healthcheck o vitest começa antes do Postgres aceitar conexão e
        # o job falha de forma intermitente, dependendo da carga do runner.
        #
        # ================================================================
        # OS INTERVALOS DO HEALTHCHECK: 2s, E NÃO 10s — MEDIDO, NÃO PALPITE
        # ================================================================
        # ESTE BLOCO É A REFERÊNCIA DOS TRÊS SERVIÇOS DE POSTGRES DESTE
        # ARQUIVO. O `test-ws-gateway` e o `test-pagarme-webhook` usam as
        # MESMAS três flags, com os números deles medidos no próprio job.
        #
        # POR QUE O INTERVALO PRECISA SER FINO — o tempo é pago no TOPO do job:
        # o passo "Initialize containers" do runner espera o serviço ficar
        # `healthy` ANTES do primeiro `actions/checkout`. Portanto este tempo
        # não é "espera do `go test`": é espera de TODO o job.
        #
        # MEDIDO no run 37409580179 (tag v1.29.0), job `test-backend / test-backend`,
        # log do passo "Initialize containers":
        #
        #   03:34:07.5  docker pull postgres:16 começa
        #   03:34:19.8  "Status: Downloaded newer image"     → 12,3s de rede
        #   03:34:20.0  container criado, "Up Less than a second (health: starting)"
        #   03:34:33.9  "postgres service is healthy"         → 13,9s de espera
        #
        # E o log do PRÓPRIO Postgres mostra que 13,9s é exagero:
        #
        #   03:34:21.4  LOG: starting PostgreSQL 16.15 ... on unix socket
        #   03:34:22.1  LOG: listening on Unix socket "/var/run/postgresql/.s.PGSQL.5432"
        #
        # Ou seja: o banco ficou ACEITANDO CONEXÃO em ~2,1s e o job esperou
        # mais 11,8s por causa do relógio do healthcheck — 47% do tempo do
        # passo foi o contêiner já pronto.
        #
        # DE ONDE VEM O ATRASO (são DOIS relógios, e é por isso que "10s" e
        # "2s" não são a mesma coisa que "10s" e "1s"):
        #
        #   1. Docker só faz a PRIMEIRA sondagem do `pg_isready` depois de
        #      `--health-interval` — o healthcheck não roda no `docker start`.
        #   2. O runner do Actions tem um backoff PRÓPRIO para perguntar o
        #      `docker inspect` (não é configurável pelo workflow). Medido nos
        #      três jobs do run 37411275059: as perguntas saem em ~0,4s, ~2,4s,
        #      ~6,1s e ~13,6s depois do `docker start`.
        #
        # Com 10s, no instante da 3a pergunta do runner (~6,1s) o Docker ainda
        # nem tinha sondado uma vez; a 1a sondagem saiu em ~10s e o runner só
        # voltou a perguntar em ~13,6s — e foi aí que ele viu "healthy".
        # Com 2s, as sondagens saem em 2s, 4s, 6s...; o `pg_isready` passa na
        # de 4s (o banco já estava de pé desde 2,1s) e o runner, que já
        # perguntou aos ~6,1s, libera o job ali.
        #
        # RESULTADO ESPERADO: o trecho "container criado → healthy" cai de
        # ~13,9s para ~6,1s, ou seja ~7,8s a MENOS por job com Postgres.
        # Mais fino que 2s não compra nada: o backoff do runner (~6s) vira o
        # piso, e o banco só fica pronto em ~2,1s mesmo.
        #
        # RESULTADO MEDIDO — melhor do que o previsto. Run 37413096448 (PR
        # #116), job `tests / test-backend`, mesmo passo, mesmas linhas de log:
        #
        #   04:18:50.9  container criado
        #   04:18:51.3  "Up Less than a second (health: starting)"
        #   04:18:51.3  "postgres service is starting, waiting 2 seconds..."
        #   04:18:53.3  "postgres service is healthy"         → 2,4s de espera
        #
        # A 2ª pergunta do runner (que cai em ~2,4s depois do `docker start`)
        # JÁ encontrou o contêiner `healthy`, porque a 1ª sondagem do
        # `pg_isready` — em 2s — passou. Nos três jobs com Postgres:
        # 13,9s / 14,9s / 12,9s antes → 2,4s / 2,4s / 2,3s depois (−34,7s).
        # O passo "Initialize containers" inteiro caiu de 24s/26s/30s para
        # 11s/13s/13s.
        #
        # O resto da diferença é o `docker pull`, que é rede do runner
        # efêmero e variou entre runs (8,4s nesta execução do backend contra
        # 10,5s na do run de base) — por isso o número a citar é o do trecho
        # `docker start → healthy`, que é o que esta mudança controla.
        #
        # POR QUE NÃO É MAIS SEGURO COM 10s — "a margem de segurança do
        # healthcheck" NÃO vem do intervalo, vem do `retries`. Aqui está a
        # conta, e ela é a razão de o retries ter AUMENTADO em vez de
        # diminuído:
        #
        #   antes:  10s × 10 retries  = 100s até o Docker declarar `unhealthy`
        #   agora:   2s × 50 retries  = 100s até o Docker declarar `unhealthy`
        #
        # Mesma tolerância a runner congestado, mesma tolerância a disco lento
        # na camada de imagem do Postgres — o que mudou é só a GRANULARIDADE
        # da detecção (2s em vez de 10s). Se o banco não subir, o job continua
        # reprovando por falta de saúde em 100s, exatamente como antes.
        #
        # POR QUE 50 E NÃO 10 AQUI: o par (intervalo × retries) é o orçamento,
        # e reduzir o retries junto com o intervalo encolheria esse orçamento —
        # que é exatamente o "falso negativo em runner lento" que este bloco
        # existe para não introduzir. 50 é o número que faz 2 × 50 = 100.
        #
        # `--health-start-period` FOI AVALIADO E NÃO ENTRA: com ele, o Docker
        # só faz a primeira sondagem depois de `start-period + interval`
        # (o intervalo inicial passa a ser a soma), e as falhas da janela de
        # start não contam para o retries. Aqui isso só ADIARIA a primeira
        # sondagem — o contrário do que se quer. Ele só pagaria se o
        # healthcheck fosse barulhento durante o boot; o `pg_isready` é
        # silencioso até o banco responder.
        #
        # `--health-timeout 5s` fica como está, de propósito: `pg_isready`
        # responde em milissegundos com o banco de pé, e o timeout só conta
        # quando o servidor está travado — caso em que 5s de paciência não
        # custam nada, porque o banco não está pronto de qualquer jeito.
        #
        # E O RESTO DO PASSO NÃO É HEALTHCHECK: os ~24s do "Initialize
        # containers" são ~12s de `docker pull postgres:16` (o runner
        # efêmero não vem com a imagem pré-carregada) + ~14s de espera de
        # saúde. Tirar os ~8s não deixa o passo em 4s, deixa em ~16s. Quem
        # quiser esse resto precisa de outra coisa (imagem em registry
        # próprio, ou serviço gerenciado) — mexer neste intervalo não chega lá.
        options: >-
          --health-cmd "pg_isready -U pdv -d pdv_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      # Aponta para o serviço acima. O global setup usa esta variável para
      # recriar o schema e o config do vitest a repassa como DATABASE_URL.
      TEST_DATABASE_URL: postgres://pdv:pdv_test_pw@localhost:55432/pdv_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          # `tsc --noEmit` e não `npm run build`: o gate precisa do TYPECHECK,
          # não do `dist/`. O vitest transpila sozinho (esbuild, sem typecheck)
          # e nada neste job consome o `dist/` — o emit era ~1/3 do tempo do
          # `tsc` jogado fora (o build com emit continua existindo para quem
          # precisa do artefato: `npm run build` e o Dockerfile de produção).
          npx tsc --noEmit
          npm run test

  # `test-frontend` NÃO compila o app público de pedidos (apps/pedido-public),
  # e a decisão é deliberada:
  #
  # O app público tem build próprio (`tsc -b && vite build`) e lockfile próprio.
  # Rodar esse build aqui custaria um segundo `npm ci` de ~75 pacotes neste job
  # e, mais importante, RODARIA AO MESMO PASSO um segundo `npm ci` num diretório
  # IRMÃO — que é a classe exata de defeito que o PR #85 introduziu ao declarar
  # `workspaces` na raiz: o `npm ci` do frontend passou a ser resolvido contra
  # o lockfile da raiz, o `vite@6` que o app público quer foi hoisted para
  # `node_modules/` e o `vitest` do frontend passou a resolver esse `vite` no
  # lugar do `vite@8`. O `@vitejs/plugin-react@6` configura o JSX automático
  # pela chave `oxc`, que o Vite 6 não conhece, e a suíte inteira morreu com
  # `ReferenceError: React is not defined` (44 arquivos, 57 testes).
  #
  # Colocar os dois `npm ci` NESTE job não é o problema — o problema é o
  # `--workspaces` implícito, que faz o npm atravessar a árvore. Em jobs
  # separados, cada `npm ci` resolve contra o SEU lockfile, no SEU diretório, e
  # nenhum interfere no outro. É por isso que o lockfile do app público é
  # versionado e não há `workspaces` na raiz.
  #
  # Onde o build do app público é verificado: o job `test-pedido-public` abaixo
  # (mesmo padrão de um job por suíte, sem `needs`, para não acoplar o frontend
  # a esse app) e o `Dockerfile` da própria imagem, que roda `npm ci` nos dois
  # diretórios e o build no stage de build.
  test-frontend:
    needs: changes
    # FAIL-OPEN em `needs.changes.result != 'success'`: se o próprio `changes`
    # falhar (ex.: API de PR inacessível), os outputs chegam vazios e o
    # condicionamento por área pularia tudo — gate verde e vazio, o defeito
    # que este bloco existe para impedir. Com a cláusula, um `changes`
    # vermelho faz as suítes RODAREM (pior caso = testar de mais, nunca de
    # menos). `!cancelled()` em vez de `always()` para não reanimar jobs de
    # um run cancelado.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test

  # O app público de pedidos (apps/pedido-public) — build de produção em job
  # próprio, separado do `test-frontend` pelo motivo exposto acima.
  #
  # `npm ci` roda em `apps/pedido-public/` e NADA mais: o alias `@/` deste app
  # aponta para `frontend/src`, e o Vite resolve as dependências bare do código
  # compartilhado a partir do PRÓPRIO diretório do importador — por isso o
  # `npm ci` do frontend também é necessário (é o que o `Dockerfile` faz, nos
  # dois diretórios). Aqui o que se prova é o que este job é dono de validar: o
  # `tsc -b` do código TypeScript novo (`src/app/**`) e o `vite build` do
  # bundle. Um `npm ci` do frontend aqui dentro não traria prova nova — e é
  # justamente o ensaio que derrubou o PR #85.
  test-pedido-public:
    needs: changes
    # FAIL-OPEN em `needs.changes.result != 'success'`: se o próprio `changes`
    # falhar (ex.: API de PR inacessível), os outputs chegam vazios e o
    # condicionamento por área pularia tudo — gate verde e vazio, o defeito
    # que este bloco existe para impedir. Com a cláusula, um `changes`
    # vermelho faz as suítes RODAREM (pior caso = testar de mais, nunca de
    # menos). `!cancelled()` em vez de `always()` para não reanimar jobs de
    # um run cancelado.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.pedido-public == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pedido-public/package-lock.json
      - working-directory: apps/pedido-public
        run: |
          npm ci
          npm run build

  # O gateway WebSocket em Go (ws-gateway/). Módulo Go independente, com as
  # próprias dependências — não entra no `npm ci` do backend nem no do frontend,
  # então sem este job o único portão de qualidade do gateway era o `go build` da
  # imagem Docker em produção.
  #
  # `gofmt -l` é o passo incomodo e é o motivo de o job existir: ele imprime o
  # nome dos arquivos fora de formato e SAI 0 sempre (é um linter de listagem, não
  # um verificador). Sem o `test -z` logo abaixo, um arquivo mal formatado
  # passaria verde para sempre — e o resto do repo tem lint no portão
  # (`npm run lint` no frontend), então a exceção aqui seria uma porta aberta.
  test-ws-gateway:
    needs: changes
    # FAIL-OPEN em `needs.changes.result != 'success'`: se o próprio `changes`
    # falhar (ex.: API de PR inacessível), os outputs chegam vazios e o
    # condicionamento por área pularia tudo — gate verde e vazio, o defeito
    # que este bloco existe para impedir. Com a cláusula, um `changes`
    # vermelho faz as suítes RODAREM (pior caso = testar de mais, nunca de
    # menos). `!cancelled()` em vez de `always()` para não reanimar jobs de
    # um run cancelado.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.ws-gateway == 'true') }}
    runs-on: ubuntu-latest
    # O dispatcher (`internal/outbox`) tem duas camadas de teste: o GATE e o
    # `Run` não precisam de banco nenhum, mas o CICLO (`PollOnce`) precisa de
    # um Postgres de verdade — o que está em jogo é a coluna `published`, e um
    # mock não prova nada sobre advisory lock, transação e `UPDATE`. São cinco
    # testes que pulam (`t.Skip` no helper `testDB`) sem
    # `WS_GATEWAY_TEST_DATABASE_URL`, e um deles é a proteção da regressão mais
    # grave do gateway: com o gate `WS_DISPATCH` desligado, a linha plantada
    # tem que continuar `published = false`. Se o guard de `PollOnce` sumir, o
    # gateway volta a descartar em silêncio o evento de quem está conectado em
    # outro servidor. E `t.Skip` é justamente o modo de falha que esconde isso:
    # o job fica verde e a proteção desaparece do portão de merge.
    #
    # Daí as duas decisões abaixo: o serviço de Postgres, sem o qual a suíte
    # roda pela metade; e o passo "nenhum teste pulado" depois do `go test`,
    # que é a parte que importa mais que subir o banco.
    services:
      postgres:
        image: postgres:16
        env:
          # Mesmas credenciais do job `test-backend` e do default em
          # backend/test/test-db.ts: o banco efêmero do CI e o Postgres local de
          # desenvolvimento não podem divergir. Copiado do `test-backend` de
          # propósito — um terceiro conjunto de credenciais aqui passaria
          # despercebido até alguém apontar a suíte para o banco errado.
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv_test_pw
          POSTGRES_DB: pdv_test
        ports:
          - 55432:5432
        # Sem healthcheck o `go test` começa antes do Postgres aceitar conexão e
        # o job falha de forma intermitente, dependendo da carga do runner.
        #
        # INTERVALO 2s (e não 10s), MESMAS TRÊS FLAGS DO `test-backend` — o
        # porquê completo, medido, está no bloco do `test-backend` acima (leia
        # lá antes de voltar este número para 10s). O resumo: com
        # `--health-interval 10s` o Docker só sondava o `pg_isready` 10s
        # depois do container subir, e o banco ficava aceitando conexão em
        # ~2,1s — o job esperava ~12s por um banco que já estava pronto.
        #
        # MEDIDO NESTE JOB (run 37411275059, `tests / test-ws-gateway`, passo
        # "Initialize containers"):
        #
        #   03:55:42.8  docker pull postgres:16 começa
        #   03:55:53.2  "Status: Downloaded newer image"      → 10,3s de rede
        #   03:55:53.2  container criado
        #   03:56:08.1  "postgres service is healthy"          → 14,9s de espera
        #
        # (passo inteiro: 26s). Com 2s, os mesmos ~10,3s de pull continuam
        # iguais — a diferença é a espera de saúde caindo de ~14,9s para
        # ~2,4s. MEDIDO no run 37413096448 (PR #116): o contêiner ficou
        # `healthy` em 2,4s e o passo inteiro caiu de 26s para 13s.
        #
        # `--health-retries 50` × 2s = 100s de janela até `unhealthy`, a MESMA
        # janela que 10 retries × 10s dava: a tolerância a runner congestado
        # não caiu, a granularidade da detecção é que mudou. Não reduza o
        # retries junto com o intervalo — esse par é o orçamento de paciência,
        # e encolhê-lo é o falso negativo que este bloco existe para evitar.
        options: >-
          --health-cmd "pg_isready -U pdv -d pdv_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      # Nome diferente do `TEST_DATABASE_URL` do job `test-backend` de propósito:
      # o gateway não usa o global-setup do vitest, e a suíte Go lê a variável
      # pelo nome dela. Nada a renomear.
      #
      # `sslmode=disable` não é decoração: é o que faz os cinco testes rodarem.
      # O driver do gateway é o lib/pq (`internal/db`), que assume
      # `sslmode=require` quando a DSN não diz nada, e a imagem `postgres:16` do
      # serviço não tem SSL — sem este parâmetro eles pulam com "pq: SSL is not
      # enabled on the server" e o job passa verde sem executar nada. A DSN do
      # `test-backend` dispensa o parâmetro porque o driver do Node (`pg`)
      # negocia para texto puro; host, porta, usuário, senha e banco são os
      # mesmos nos dois jobs.
      WS_GATEWAY_TEST_DATABASE_URL: postgres://pdv:pdv_test_pw@localhost:55432/pdv_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Mesma versão declarada no go.mod do gateway. `go-version` com
          # `check-latest` desligado (default) instala exatamente esta versão, e
          # o `cache: true` usa o go.sum como chave do cache do module/build
          # cache — o equivalente ao `cache-dependency-path` do npm nos jobs
          # acima. Se o go.mod subir, este número sobe junto (o próprio build
          # falha com "go.mod requires go >= X" se ficarem divergentes).
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: ws-gateway/go.sum
      - working-directory: ws-gateway
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::rode gofmt -w ."; exit 1; }
      # `-v` e o `tee` não são vaidade: `--- SKIP:` é o que o passo
      # seguinte lê. O `set -o pipefail` é o que impede o `tee` de engolir o
      # status do `go test` — sem ele, um teste vermelho passaria o passo
      # (o shell padrão do Actions é `bash -e`, sem pipefail) e o job inteiro
      # perderia o sinal de falha do `go test`.
      #
      # `-race` é o detector de corrida do runtime, e ele está aqui por causa
      # de uma classe de defeito que a suíte sem ele não pega: o hub de
      # conexões (`internal/connmanager`) fecha `c.send` enquanto o `send`
      # ainda escreve no mesmo canal. Sem `-race` isso reprova por
      # `panic: send on closed channel` — que é o SINTOMA, e depende de
      # escalonamento de goroutines: na máquina de desenvolvimento o mesmo
      # código reprovou em 20 de 20 execuções, mas no runner do CI só em
      # 11 de 20 no mesmo teste, porque o sintoma é uma corrida. Com `-race` o
      # mesmo código reprova em 20 de 20, e o relatório nomeia a CAUSA: as duas
      # goroutines, os dois acessos e as linhas do `close` e do `send`. A
      # diferença não é só taxa de reprovação — é um vermelho que aponta o
      # defeito contra um vermelho que aponta o estrago, e o primeiro é o que
      # sobrevive a um teste novo ou a um CI mais rápido que o seu.
      #
      # O `-race` não muda o formato que o passo de baixo lê: `--- PASS:` e
      # `--- SKIP:` saem iguais, a ordem dos pacotes é a mesma e a contagem de
      # pulos continua em zero contra o Postgres do serviço (medido nos dois
      # ramos do `t.Skip`: env ausente e banco que não responde). Por isso o
      # gate de skip abaixo não precisou de nenhum ajuste.
      #
      # O custo é pequeno neste módulo e cabe em uma frase: em 4 vCPUs a suíte
      # vai de ~3,7s para ~5,4s. A primeira execução depois deste commit paga
      # ~+35s de compilação a mais, porque `-race` gera um build instrumentado
      # SEPARADO e o passo `go build`/`go vet` acima só aquece o cache sem
      # detector; da segunda em diante o cache do `setup-go` (que inclui o
      # GOCACHE) já resolve. Requisito de ambiente: `-race` depende de cgo, e
      # por isso de um compilador C — o `gcc` das imagens `ubuntu-latest` do
      # GitHub está lá. Sem ele o passo morre com erro críptico
      # ("-race requires cgo"), que é o jeito que essa dependência se
      # denuncia.
      - name: suíte (com o Postgres do serviço)
        working-directory: ws-gateway
        run: |
          set -o pipefail
          go test -v -count=1 -race ./... 2>&1 | tee "$RUNNER_TEMP/ws-gateway-test.log"
      # `go test` sai 0 com `t.Skip`: o verde deste job não distingue "testou"
      # de "pulou", e é essa distinção que segura a regressão do gate desligado.
      # Vale para o módulo inteiro, não só para os cinco testes de `PollOnce`:
      # hoje as únicas chamadas de `t.Skip` do gateway são as duas do helper
      # `testDB` — env ausente OU Postgres que não responde, e as duas precisam
      # virar vermelho aqui. Um `t.Skip` legítimo que apareça um dia aparece como
      # falha neste passo, com nome e motivo, em vez de sumir num verde.
      - name: nenhum teste pulado
        run: |
          log="$RUNNER_TEMP/ws-gateway-test.log"

          # Log ausente ou vazio NÃO é "nenhum pulo": é o passo anterior não ter
          # rodado. Sem esta guarda o `grep` abaixo não casaria nada e o job
          # passaria verde sem ter conferido nada — o silêncio que este passo
          # existe para impedir.
          if [ ! -s "$log" ]; then
            echo "::error::log da suíte ausente ou vazio ($log): o passo de go test não produziu saída"
            exit 1
          fi

          # `--- SKIP:` é o formato do `go test -v` (indentado nos subtestes) e
          # `-B2` traz o motivo do pulo: a linha de log do `t.Skip` fica logo
          # acima, e é ela que diz se faltou a env ou se o banco não respondeu.
          #
          # Antes do skip, o espelho do mesmo receio: se o `go test` mudar essa
          # linha um dia, o `grep` de baixo deixa de casar e este passo volta a
          # ser o verde silencioso que veio para acabar. Um `--- PASS:` no log é
          # a prova de que o formato é o esperado — e ele existe porque há
          # pacotes com testes que passam (só `internal/db` é `[no test files]`).
          if ! grep -qE '^[[:space:]]*--- PASS: ' "$log"; then
            echo "::error::nenhuma linha '--- PASS:' no log da suíte: o gate de skip pode ter parado de casar (formato de saída do go test mudou?)"
            exit 1
          fi

          if grep -nE -B2 '^[[:space:]]*--- SKIP: ' "$log"; then
            echo "::error::teste(s) pulado(s) no ws-gateway: a suíte do outbox não rodou contra o Postgres. Se WS_GATEWAY_TEST_DATABASE_URL sumiu do env do job, ou aponta para um Postgres que não responde, o gateway fica sem a única proteção contra o despacho com o gate desligado"
            exit 1
          fi

          echo "nenhum teste pulado: os cinco testes de PollOnce rodaram contra o Postgres do serviço"

  # O serviço Pagar.me em Go (pagarme-webhook/). Módulo Go independente, com as
  # próprias dependências — não entra no `npm ci` do backend nem no do frontend,
  # então sem este job o único portão de qualidade do serviço era o `go build` da
  # imagem Docker em produção, e os 228 testes que o protegem (contando subtestes)
  # só rodavam na máquina de quem os escreveu.
  #
  # `gofmt -l` é o passo incomodo e é o motivo de o job existir: ele imprime o
  # nome dos arquivos fora de formato e SAI 0 sempre (é um linter de listagem, não
  # um verificador). Sem o `test -z` logo abaixo, um arquivo mal formatado
  # passaria verde para sempre — e o resto do repo tem lint no portão
  # (`npm run lint` no frontend), então a exceção aqui seria uma porta aberta.
  test-pagarme-webhook:
    needs: changes
    # FAIL-OPEN em `needs.changes.result != 'success'`: se o próprio `changes`
    # falhar (ex.: API de PR inacessível), os outputs chegam vazios e o
    # condicionamento por área pularia tudo — gate verde e vazio, o defeito
    # que este bloco existe para impedir. Com a cláusula, um `changes`
    # vermelho faz as suítes RODAREM (pior caso = testar de mais, nunca de
    # menos). `!cancelled()` em vez de `always()` para não reanimar jobs de
    # um run cancelado.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.pagarme-webhook == 'true') }}
    runs-on: ubuntu-latest
    # Este serviço tem DUAS suítes que precisam de Postgres de verdade, e nenhuma
    # das duas é substituível por mock:
    #
    # 1. A INBOX (`internal/inbox`, 7 testes que pulam): o `Record` grava em
    #    `payment_event` de verdade, porque o que está em jogo é o `ON CONFLICT`
    #    (provider, event_id) sobre o índice UNIQUE `uq_payment_event_provider_event_id`.
    #    Um mock que devolvesse "conflito" quando o teste manda provaria exatamente
    #    o que o teste mandou. É a proteção contra o dedupe quebrado — e dedupe
    #    quebrado é o defeito que cobra a mesma cobrança duas vezes, porque o
    #    Pagar.me reenvia o mesmo evento e o segundo apply chega ao Node.
    #
    # 2. O CICLO DO DRAIN (`internal/queue`, 31 testes que pulam): `DrainOnce` e
    #    `ReconcileOnce` precisam do banco porque disputam o advisory lock
    #    `pg_try_advisory_xact_lock(hashtext('pdv:payment:worker'))` e mexem em
    #    `status`/`attempts`/`next_attempt_at` — nenhum mock prova advisory lock,
    #    transação nem `UPDATE`. Aqui moram as proteções da DLQ
    #    (`TestDrainOneEstouraATetoEParaNaDLQ`, `TestCountDeadLettered`) e da
    #    serialização entre instâncias (`TestDrainOncePulaQuandoOutroDrenadorTemOLock`).
    #
    # São 38 testes que pulam (`t.Skip` no helper `testDB`) sem
    # `PAGARME_TEST_DATABASE_URL`, e o `t.Skip` é justamente o modo de falha que
    # esconde as duas proteções acima. Medido nesta máquina, sem a env:
    # 38 pulam, 190 passam e a suíte sai VERDE — ou seja, `go test` sozinho é
    # falso-verde garantido se a env faltar. O que some nesse verde é a proteção
    # contra dedupe quebrado e a única forma de observar a DLQ.
    #
    # Daí as duas decisões abaixo: o serviço de Postgres, sem o qual a suíte roda
    # pela metade; e o passo "nenhum teste pulado" depois do `go test`, que é a
    # parte que importa mais que subir o banco.
    services:
      postgres:
        image: postgres:16
        env:
          # Mesmas credenciais do job `test-backend`, do `test-ws-gateway` e do
          # default em backend/test/test-db.ts: o banco efêmero do CI e o Postgres
          # local de desenvolvimento não podem divergir. Copiado dos outros de
          # propósito — um terceiro conjunto de credenciais aqui passaria
          # despercebido até alguém apontar a suíte para o banco errado.
          POSTGRES_USER: pdv
          POSTGRES_PASSWORD: pdv_test_pw
          POSTGRES_DB: pdv_test
        ports:
          - 55432:5432
        # Sem healthcheck o `go test` começa antes do Postgres aceitar conexão e
        # o job falha de forma intermitente, dependendo da carga do runner.
        #
        # INTERVALO 2s (e não 10s), MESMAS TRÊS FLAGS DO `test-backend` — o
        # porquê completo, medido, está no bloco do `test-backend` acima (leia
        # lá antes de voltar este número para 10s). O resumo: com
        # `--health-interval 10s` o Docker só sondava o `pg_isready` 10s
        # depois do container subir, e o banco ficava aceitando conexão em
        # ~2,1s — o job esperava ~11s por um banco que já estava pronto.
        #
        # MEDIDO NESTE JOB (run 37411275059, `tests / test-pagarme-webhook`,
        # passo "Initialize containers"):
        #
        #   03:55:43.3  docker pull postgres:16 começa
        #   03:56:01.0  "Status: Downloaded newer image"      → 17,7s de rede
        #   03:56:01.0  container criado
        #   03:56:14.0  "postgres service is healthy"          → 12,9s de espera
        #
        # (passo inteiro: 30s). Este job foi o pior dos três no pull (17,7s
        # contra 10,3s do `test-ws-gateway` e 10,5s do `test-backend` na mesma
        # janela): o pull é rede do runner e varia job a job — e é a metade do
        # custo deste passo que NÃO é healthcheck. Com 2s, a espera de saúde
        # cai de ~12,9s para ~2,3s. MEDIDO no run 37413096448 (PR #116): o
        # contêiner ficou `healthy` em 2,3s e o passo inteiro caiu de 30s
        # para 13s.
        #
        # `--health-retries 50` × 2s = 100s de janela até `unhealthy`, a MESMA
        # janela que 10 retries × 10s dava: a tolerância a runner congestado
        # não caiu, a granularidade da detecção é que mudou. Não reduza o
        # retries junto com o intervalo — esse par é o orçamento de paciência,
        # e encolhê-lo é o falso negativo que este bloco existe para evitar.
        options: >-
          --health-cmd "pg_isready -U pdv -d pdv_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 50
    env:
      # Nome diferente do `TEST_DATABASE_URL` do job `test-backend` de propósito:
      # o serviço não usa o global-setup do vitest, e a suíte Go lê a variável
      # pelo nome dela (`os.Getenv("PAGARME_TEST_DATABASE_URL")` nos dois helpers
      # `testDB`). Nada a renomear.
      #
      # `sslmode=disable` não é decoração: é o que faz os 38 testes rodarem.
      # O driver do serviço é o mesmo lib/pq do gateway (`internal/db`), que
      # assume `sslmode=require` quando a DSN não diz nada, e a imagem
      # `postgres:16` do serviço não tem SSL — sem este parâmetro os 38 pulam com
      # "pq: SSL is not enabled on the server" e o job passa verde sem executar
      # nada (medido: `ok internal/inbox 0.117s`, contra 2,1s rodando). O
      # `testDB` pula, não falha, nesse caso — que é o pior formato possível:
      # env setada, banco de pé, suíte verde e 38 testes não exercitados. A DSN
      # do `test-backend` dispensa o parâmetro porque o driver do Node (`pg`)
      # negocia para texto puro; host, porta, usuário, senha e banco são os
      # mesmos nos três jobs.
      PAGARME_TEST_DATABASE_URL: postgres://pdv:pdv_test_pw@localhost:55432/pdv_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Mesma versão declarada no go.mod do serviço (`go 1.25.0`).
          # `go-version` com `check-latest` desligado (default) instala exatamente
          # esta versão, e o `cache: true` usa o go.sum como chave do cache do
          # module/build cache — o equivalente ao `cache-dependency-path` do npm
          # nos jobs acima. Se o go.mod subir, este número sobe junto (o próprio
          # build falha com "go.mod requires go >= X" se ficarem divergentes).
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: pagarme-webhook/go.sum
      - working-directory: pagarme-webhook
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::rode gofmt -w ."; exit 1; }
      # `-v` e o `tee` não são vaidade: `--- SKIP:` é o que o passo
      # seguinte lê. O `set -o pipefail` é o que impede o `tee` de engolir o
      # status do `go test` — sem ele, um teste vermelho passaria o passo
      # (o shell padrão do Actions é `bash -e`, sem pipefail) e o job inteiro
      # perderia o sinal de falha do `go test`.
      #
      # `-race` é o detector de corrida do runtime, e ele está aqui por causa de
      # uma classe de defeito que a suíte sem ele não pega. Este serviço tem
      # estado compartilhado em três lugares, e os três dependem do mesmo
      # detector para dizer se o mutex ainda cobre o campo:
      #
      #   - O `HealthProbe` (internal/server/health.go) guarda `st` e `inFlight`
      #     sob `sync.Mutex`, e o probe roda em goroutine (`go probe.Run(ctx)`)
      #     enquanto o `/health` lê `st` da goroutine do handler. As suítes
      #     `TestProbeNaoAcumulaPerguntasPresas` e `TestProbeDestravaDepois` usam
      #     um `dbPinger` que trava de propósito (é o que o lib/pq faz contra um
      #     banco congelado) para abrir a janela de corrida de verdade — e leem
      #     `len(probe.inFlight)` tomando `probe.mu` antes, exatamente a disciplina
      #     que o `-race` verifica.
      #   - O `fakeAplica` (`internal/queue`) acumula `chamadas`/`enderecos` sob
      #     `mu`, e o par de testes do gate (`TestRunComGateDesligado…` /
      #     `TestRunComGateLigado…`) roda `d.Run(ctx)` em goroutine e depois lê
      #     `aplica.quantasChamadas()` da goroutine do teste.
      #   - O `fechaPool` (cmd/webhook/main.go) fecha o pool em goroutine e
      #     espera num `select` com prazo.
      #
      # Sem `-race`, um mutex que pare de cobrir um campo não reprova nada: os
      # testes continuam verdes e a corrida fica esperando um CI mais lento ou
      # uma máquina mais cheia para se manifestar. Com `-race` o relatório nomeia
      # as DUAS goroutines, os DOIS acessos e as linhas — que é o vermelho que
      # sobrevive a um teste novo.
      #
      # O `-race` não muda o formato que o passo de baixo lê: `--- PASS:` e
      # `--- SKIP:` saem iguais, a ordem dos pacotes é a mesma e a contagem de
      # pulos continua em zero contra o Postgres do serviço (medido nos dois
      # ramos do `t.Skip`: env ausente e banco que não responde, com e sem
      # `sslmode=disable`). Por isso o gate de skip abaixo não precisou de nenhum
      # ajuste.
      #
      # O custo cabe em uma frase, medido em 4 vCPUs: a suíte vai de ~5s para
      # ~9s. A primeira execução depois deste commit paga ~+4s a mais (13s contra
      # 9s aqui), porque `-race` gera um build instrumentado SEPARADO e o passo
      # `go build`/`go vet` acima só aquece o cache sem detector; da segunda em
      # diante o cache do `setup-go` (que inclui o GOCACHE) já resolve. Requisito
      # de ambiente: `-race` depende de cgo, e por isso de um compilador C — o
      # `gcc` das imagens `ubuntu-latest` do GitHub está lá. Sem ele o passo morre
      # com erro críptico ("-race requires cgo"), que é o jeito que essa
      # dependência se denuncia.
      - name: suíte (com o Postgres do serviço)
        working-directory: pagarme-webhook
        run: |
          set -o pipefail
          go test -v -count=1 -race ./... 2>&1 | tee "$RUNNER_TEMP/pagarme-webhook-test.log"
      # `go test` sai 0 com `t.Skip`: o verde deste job não distingue "testou" de
      # "pulou", e é essa distinção que segura as duas proteções de cima. Vale para
      # o módulo inteiro, não só para os 38 testes de banco: hoje as únicas
      # chamadas de `t.Skip` do serviço são as duas do helper `testDB`, replicadas
      # em `internal/inbox` e `internal/queue` — env ausente OU Postgres que não
      # responde, e as duas precisam virar vermelho aqui. Um `t.Skip` legítimo que
      # apareça um dia aparece como falha neste passo, com nome e motivo, em vez de
      # sumir num verde.
      - name: nenhum teste pulado
        run: |
          log="$RUNNER_TEMP/pagarme-webhook-test.log"

          # Log ausente ou vazio NÃO é "nenhum pulo": é o passo anterior não ter
          # rodado. Sem esta guarda o `grep` abaixo não casaria nada e o job
          # passaria verde sem ter conferido nada — o silêncio que este passo
          # existe para impedir.
          if [ ! -s "$log" ]; then
            echo "::error::log da suíte ausente ou vazio ($log): o passo de go test não produziu saída"
            exit 1
          fi

          # `--- SKIP:` é o formato do `go test -v` (indentado nos subtestes) e
          # `-B2` traz o motivo do pulo: a linha de log do `t.Skip` fica logo
          # acima, e é ela que diz qual dos três modos foi — env ausente, banco
          # que não responde, ou o `sslmode` faltando na DSN.
          #
          # Antes do skip, o espelho do mesmo receio: se o `go test` mudar essa
          # linha um dia, o `grep` de baixo deixa de casar e este passo volta a
          # ser o verde silencioso que veio para acabar. Um `--- PASS:` no log é
          # a prova de que o formato é o esperado — e ele existe porque há pacotes
          # com testes que passam (só `cmd/webhook` e `internal/db` são
          # `[no test files]`).
          if ! grep -qE '^[[:space:]]*--- PASS: ' "$log"; then
            echo "::error::nenhuma linha '--- PASS:' no log da suíte: o gate de skip pode ter parado de casar (formato de saída do go test mudou?)"
            exit 1
          fi

          if grep -nE -B2 '^[[:space:]]*--- SKIP: ' "$log"; then
            echo "::error::teste(s) pulado(s) no pagarme-webhook: a suíte não rodou contra o Postgres. Se PAGARME_TEST_DATABASE_URL sumiu do env do job, aponta para um Postgres que não responde, ou perdeu o '?sslmode=disable' (o lib/pq assume sslmode=require e a imagem postgres:16 do serviço não tem SSL), o serviço fica sem a proteção contra dedupe quebrado na inbox e sem como observar a DLQ do drain"
            exit 1
          fi

          echo "nenhum teste pulado: os 38 testes de banco (7 da inbox, 31 do drain) rodaram contra o Postgres do serviço"

  # Shellcheck como portão: um script com warning (SC2155, SC2206, SC2064...)
  # passa despercebido no review e vira bug de deploy depois. Rodar sobre todos os
  # scripts versionados (incluindo .githooks, que não terminam em .sh) mantém a
  # barra no mesmo nível do `npm run lint` do frontend e do `gofmt -l` dos jobs Go.
  # `shellcheck` NÃO entra no filtro de paths, de propósito: é o job mais
  # barato da suíte (sem npm ci, sem Postgres, ~10s) e os alvos dele são os
  # arquivos mais transversais do repo — `git ls-files '*.sh' '.githooks/*'`
  # pega scripts de `deploy/`, `scripts/`, raiz, que não pertencem a nenhuma
  # das seis áreas mapeadas. Um filtro `**.sh` casaria o glob, mas deixaria
  # de fora exatamente o modo de falha que interessa (script novo em pasta
  # nova). Sempre roda.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          mapfile -t files < <(git ls-files '*.sh' '.githooks/*')
          shellcheck --severity=warning "${files[@]}"

  # O daemon de impressão (`printer/daemon/`) — o segundo módulo Go do repo.
  #
  # Este job é a razão de o `gofmt -l` existir acima dele: o daemon passou
  # quebrado (sem compilar) tempo demais na `main` porque NADA o verificava.
  # Nem build, nem vet, nem suíte: `printer/daemon` não entra no `npm ci` do
  # backend nem do frontend, e o `test-ws-gateway` só cobre `ws-gateway/`. O
  # único portão que o daemon tinha era o `go build` da imagem de produção —
  # isto é, o erro só aparecia depois de virar tag. Um `gofmt -l` sem o
  # `test -z` seria o mesmo furo em forma nova: o `gofmt` imprime e sai 0.
  #
  # `-count=1` desliga o cache de resultado do `go test`: sem ele um run pode
  # reaproveitar o "ok, sem arquivo de teste" cacheado de uma execução em que o
  # pacote ainda não tinha testes.
  test-printer-daemon:
    needs: changes
    # FAIL-OPEN em `needs.changes.result != 'success'`: se o próprio `changes`
    # falhar (ex.: API de PR inacessível), os outputs chegam vazios e o
    # condicionamento por área pularia tudo — gate verde e vazio, o defeito
    # que este bloco existe para impedir. Com a cláusula, um `changes`
    # vermelho faz as suítes RODAREM (pior caso = testar de mais, nunca de
    # menos). `!cancelled()` em vez de `always()` para não reanimar jobs de
    # um run cancelado.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || github.event_name != 'pull_request' || needs.changes.outputs.printer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Mesma versão declarada no `go 1.25.0` do go.mod do daemon — a mesma
          # regra do `test-ws-gateway`. `go-version` sem `check-latest` instala
          # exatamente esta versão, e o `cache: true` usa o go.sum como chave do
          # cache de módulos/build (o equivalente ao `cache-dependency-path` do
          # npm nos jobs Node). Se o go.mod subir, este número sobe junto: o
          # próprio build morre com "go.mod requires go >= X" se divergirem.
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: printer/daemon/go.sum
      # O nome do passo cita os dois GOOS de propósito: quando este passo fica
      # vermelho, a primeira pergunta é se foi o build linux ou o cross-compile
      # do Windows, e o título é o que o operador lê antes de abrir o log.
      - name: build, vet e gofmt (linux + GOOS=windows)
        working-directory: printer/daemon
        run: |
          # `go mod download` explícito: o daemon puxa dependências de terceiros
          # (selfupdate, bbolt, modernc.org/sqlite), então a primeira execução
          # gasta rede. O `cache: true` do setup-go acima já resolve isso a
          # partir da segunda, mas o passo deixa a falha de DOWNLOAD
          # distinguível da falha de COMPILAÇÃO no log — sem ele, as duas saem
          # como "cannot find package" no mesmo `go build`.
          go mod download
          go build ./...
          go vet ./...
          # `gofmt -l` é um lister: sai 0 mesmo fora de formato, então o
          # `test -z` é o gate. Sem `-w`: formatar no CI esconde o defeito em
          # vez de reprovar o PR, e ninguém vê o diff que o gofmt faria.
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::rode gofmt -w printer/daemon"; exit 1; }
          # ============================================================
          # CROSS-COMPILE PARA WINDOWS — a plataforma que o daemon REALMENTE
          # entrega (o instalador da linha `app-v*` embarca ele como serviço).
          #
          # Sem estes dois comandos, `service_windows.go` e `transport_windows.go`
          # NÃO ERAM COMPILADOS POR NENHUM GATE DESTE JOB. Medido com
          # `go list`: sob linux entram `service_other.go` + `transport_cups.go`;
          # sob windows entram `service_windows.go` + `transport_windows.go`. São
          # arquivos disjuntos — o build linux não os vê, e `go vet` sem GOOS não
          # os vê. Um erro de digitação no `svc.Handle` ou no
          # `windows.UTF16PtrFromString` só apareceria no `go build` da imagem de
          # produção, isto é, depois da tag.
          #
          # O `vet` do Windows não é enfeite: ele também troca o CONJUNTO de
          # arquivos de teste analisados (`go list .TestGoFiles`) — `phase2_test.go`
          # e `transport_cups_test.go` saem da lista em windows, os outros seis
          # permanecem — então o passo não é o build linux repetido com outra
          # variável, é uma segunda passagem de type-check sobre um conjunto
          # diferente de arquivos.
          #
          # RISCO DE VERSÃO (medido, não presumido): o CI fixa `1.25.0` e este
          # gate foi verificado no `1.25.0` exato via `GOTOOLCHAIN=go1.25.0` —
          # build, vet, gofmt e suíte verdes nos dois GOOS. O risco estrutural
          # é baixo e está ao alcance da leitura: os dois arquivos windows-only
          # não importam `syscall` da stdlib, e sim `golang.org/x/sys/windows` e
          # `.../windows/svc`, que são MÓDULO com versão fixada no go.mod/go.sum
          # — idênticos em qualquer toolchain. O único `unsafe` é layout de
          # struct do próprio x/sys, e o algoritmo de layout do compilador Go não
          # mudou entre 1.25 e 1.27. E a versão de LINGUAGEM do módulo é 1.25
          # pelo go.mod, então o compilador 1.27 rodando localmente não aceitaria
          # por acidente um constructo que o 1.25 do CI rejeitaria.
          #
          # ARQUIVO SOLTO: `printer/daemon` é um `package main` só, então
          # `go build` não descarta o executável — ele ESCREVE
          # `pdv-printer-daemon.exe` no diretório de trabalho. Em runner efêmero
          # isso é irrelevante (ninguém commita), mas estes mesmos comandos são
          # rodados localmente, e o artefato tem de sumir do `git status`.
          # `printer/.gitignore` (linhas 4-5) cobre `daemon/pdv-printer-daemon` e
          # `daemon/pdv-printer-daemon.exe`; conferido com `git check-ignore -v`.
          # ============================================================
          GOOS=windows go build ./...
          GOOS=windows go vet ./...
      - name: suíte
        working-directory: printer/daemon
        run: go test -count=1 ./...

  # ============================================================
  # POR QUE SEM `-race` AQUI, AO CONTRÁRIO DO `test-ws-gateway`
  # ============================================================
  #
  # O `-race` do gateway não é decoração: ele existe porque a suíte do gateway
  # tinha uma corrida real (`send on closed channel` em `internal/connmanager`)
  # que só aparecia em 11 de 20 execuções — uma classe de defeito que o
  # `-race` Reprova em 20 de 20 e nomeando a causa. Ligado ali, ele compra
  # determinismo.
  #
  # No daemon não há caso conhecido que peça isso: a suíte sobe `httptest.Server`
  # em portas efêmeras e tem caminhos de retry/backoff sensíveis a tempo.
  # `-race` nesse terreno troca um vermelho que aponta a CAUSA por um vermelho
  # que pode ser o próprio `-race` estourando o orçamento de tempo do teste —
  # ou seja, um gate que reprova sem dizer o que está errado. Regra que vale
  # para os dois: `-race` só entra quando foi medido verde em execuções
  # repetidas, nunca porque "parece mais rigoroso".
  #
  # O gate de "nenhum teste pulado" do `test-ws-gateway` NÃO é copiado aqui, e
  # a diferença é de fundo: os `t.Skip` do gateway existem para esconder testes
  # que protegem uma regressão concreta (o `WS_DISPATCH` desligado), então
  # pulá-los é exatamente o modo de falha que aquele passo existe para impedir.
  # Os três do daemon (medidos nesta máquina) são condicionais de plataforma e
  # legítimos: dois `TestResolveDir` de caminho Windows e
  # `TestDiscoverPrintersReturnsNotImplementedOutsideWindows`. Copiar o gate
  # reprovaria a suíte em todo runner Linux, e o passo viraria um teste sobre
  # o sistema operacional em vez de sobre o daemon.
  # ============================================================
