server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location ~* \.(?:js|css|woff2|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ---------- Health check do container ----------
  # O healthcheck do `pedidopublic` (deploy/docker-compose.yml) pede
  # `GET /healthz` e SAI COMO ERRO se não vier 2xx — é o portão que o
  # switch.sh usa antes de apontar o Caddy para este container.
  #
  # Este bloco é o que faz o portão valer alguma coisa. Sem ele o
  # `location /` abaixo respondia 200 para QUALQUER caminho (o
  # `try_files` cai no `/index.html`), então o healthcheck ficava verde
  # mesmo com o bundle ausente ou quebrado — nunca provou nada.
  # `location =` (match exato) tem prioridade sobre o `location /`, e a
  # resposta sai do próprio nginx, sem tocar arquivo.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
